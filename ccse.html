<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2f2f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<title>Compi</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
/* JS resolves auto -> an explicit data-theme, so each palette is defined once and
   never duplicated across a media query. */
:root{
  --bg:#f2f2f4; --card:#fff; --fg:#16161a; --mut:#65656d; --line:#ebebef; --edge:#d0d0d6;
  --accent:#8d2027; --accent-fg:#fff; --ink:#8d2027; --danger:#c62828;
  --good:#2f8f34; --good-bg:#eaf6ea; --bad-bg:#fbecec;
  --dot:#c2c2ca; --dim:#83838c;
  --exp-bg:#f7f5f1;
  --todo-bg:#fff7e0; --todo-line:#b8860b; --todo-fg:#5a4610;
  --bar:#e0e0e6; --warn:#b06f00; --nope:#cf9a9a;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px;
}
:root[data-theme="dark"]{
  --bg:#141416; --card:#1f1f22; --fg:#f0f0f3; --mut:#9d9da5; --line:#2e2e33; --edge:#42424a;
  --accent:#a8323b; --accent-fg:#fff; --ink:#ff9ba1; --danger:#ff6b6b;
  --good:#4cc746; --good-bg:#182a19; --bad-bg:#33191c;
  --dot:#55555e; --dim:#8a8a93;
  --exp-bg:#26262b;
  --todo-bg:#2e2717; --todo-line:#c99000; --todo-fg:#e8cf95;
  --bar:#3a3a42; --warn:#e0a838; --nope:#8a5a60;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:contain}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
     background:var(--bg);color:var(--fg);
     padding:env(safe-area-inset-top) var(--s3) env(safe-area-inset-bottom) var(--s3);
     -webkit-text-size-adjust:100%}
.wrap{max-width:600px;margin:0 auto;padding:var(--s2) 0 80px}

/* header: title + theme icon on one row, no wasted vertical space */
.top{display:flex;align-items:center;gap:var(--s2);margin:0 0 var(--s2)}
.top h1{flex:1;font-size:17px;font-weight:700;margin:0;letter-spacing:.2px;text-align:center}
.spacer{width:44px;flex:0 0 44px}

.card{background:var(--card);border-radius:14px;padding:var(--s4);margin:var(--s2) 0}
.card.tight{padding:var(--s3) var(--s4)}
.ttl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
     color:var(--mut);margin-bottom:var(--s2)}

/* Action buttons opt IN via .btn, so role classes always outrank the base.
   Never restyle the bare `button` type selector: it fights .opt and .btn both. */
.btn{font:inherit;font-weight:600;border:1.5px solid transparent;border-radius:11px;
     min-height:46px;padding:var(--s3) var(--s4);background:transparent;color:var(--fg);
     cursor:pointer;width:100%;transition:opacity .15s ease}
.btn:active{opacity:.6}
.btn[disabled]{opacity:.35;cursor:default}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.out{color:var(--ink);border-color:var(--ink)}
.btn.neu{color:var(--fg);border-color:var(--edge)}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:42px;padding:var(--s2) var(--s3);font-size:14px}
.stack>*+*{margin-top:var(--s2)}
.row{display:flex;gap:var(--s2)}.row>*{flex:1;min-width:0}

/* icon button: 20px glyph, 44px tap area per the touch-target rule */
.icon{width:44px;height:44px;flex:0 0 44px;padding:0;border-radius:11px;
      border:1.5px solid var(--edge);background:transparent;color:var(--fg);
      display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon svg{width:20px;height:20px;display:block}

/* bank as chips instead of a 5-row table: same data, a third of the height */
.chips{display:flex;gap:var(--s1)}
.chip{flex:1;text-align:center;background:var(--bg);border-radius:9px;padding:var(--s2) 2px}
.chip b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.chip span{font-size:11px;color:var(--mut)}

/* geometry must NOT change when answered, or the list shifts under your thumb */
.opt{display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s3) var(--s2);
     border-radius:10px;cursor:pointer;min-height:46px;
     border:1.5px solid transparent;background:transparent;color:inherit;text-align:left;
     font:inherit;font-weight:400;width:100%;margin:1px 0}
.opt:focus:not(:focus-visible){outline:none}
.dot{flex:0 0 22px;height:22px;border-radius:50%;border:2.5px solid var(--dot);display:flex;
     align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;margin-top:1px}
.opt.good .dot{background:var(--good);border-color:var(--good)}
.opt.bad .dot{background:var(--danger);border-color:var(--danger)}
.opt.good{background:var(--good-bg)}.opt.bad{background:var(--bad-bg)}
.opt.dim{color:var(--dim)}

.qhead{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2);
       font-size:13px;color:var(--mut)}
/* one segment per exam question, filled as you answer */
.dots{display:flex;gap:2px;flex:1}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--bar)}
.dots i.ok{background:var(--good)}
.dots i.no{background:var(--danger)}
.clock{flex:0 0 44px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
       color:var(--mut)}
.clock.warn{color:var(--warn)}
.clock.crit{color:var(--danger)}
.badge{background:var(--accent);color:var(--accent-fg);font-weight:700;border-radius:6px;
       padding:1px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.q{font-size:17px;line-height:1.35;margin:0 0 var(--s3)}
.verdict{font-weight:700;font-size:15px;margin-top:var(--s3)}
.exp{background:var(--exp-bg);border-radius:8px;
     padding:var(--s3);margin-top:var(--s2);font-size:13.5px;line-height:1.42}
.exp .w{border-left:3px solid var(--nope);padding-left:var(--s3);margin-top:var(--s3)}
.exp .w:first-child{margin-top:0}
.exp .w.key{border-left-color:var(--good);font-size:14.5px}
.exp .lbl{display:block;margin-bottom:2px;font-weight:400;color:var(--mut)}
.exp .w.key .lbl{font-weight:700;color:var(--good)}
.src{background:var(--exp-bg);border-radius:8px;padding:var(--s3);margin-top:var(--s2);
     font-style:italic;color:var(--mut);font-size:13px;line-height:1.4}
.todo .lbl{font-weight:700;color:var(--todo-fg)}
.todo{background:var(--todo-bg);border-left-color:var(--todo-line);color:var(--todo-fg)}

input{font:inherit;width:100%;min-height:46px;padding:var(--s3) var(--s4);
      border:1.5px solid var(--edge);border-radius:11px;background:var(--card);color:var(--fg)}
.hit{padding:var(--s3) var(--s1);border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
.hit:last-child{border:0}
.hit small{color:var(--ink);font-weight:700;margin-right:var(--s2)}
.hit.done{opacity:.4}

.stat+.stat{margin-top:var(--s2)}
.stat .hd2{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);
           font-size:14px;line-height:1.25}
.stat .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{color:var(--mut);font-size:13px}
code{font-family:ui-monospace,monospace;font-size:12px}
.score{font-size:30px;font-weight:800;text-align:center;line-height:1.1;
       font-variant-numeric:tabular-nums}
.ctr{text-align:center}
.bar{height:6px;background:var(--bar);border-radius:3px;margin-top:5px;position:relative}
.bar i{display:block;height:100%;border-radius:3px;transition:width .3s ease,background .3s ease}
/* Pass-mark marker. It must OVERHANG the bar to read as a gauge tick, so .bar cannot
   clip: the fill carries its own border-radius instead of relying on overflow:hidden. */
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;
       background:var(--fg);opacity:.85}

.fix{position:fixed;left:0;right:0;bottom:0;background:var(--bg);
     padding:var(--s2) var(--s3) calc(var(--s2) + env(safe-area-inset-bottom));
     border-top:1px solid var(--line)}
.fix .in{max-width:600px;margin:0 auto;display:flex;gap:var(--s2)}
.fix .btn{flex:1}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;scroll-behavior:auto !important}
}
</style>
</head>

<script>
const Q = [{"id":"0dcdb6eb7f","num":1001,"tarea":1,"type":"mc","question":"España es...","options":["una monarquía parlamentaria.","una república federal.","una monarquía federal."],"answer_index":0,"explanation":"El Reino de España es un Estado social y democrático de Derecho cuya forma política es la monarquía parlamentaria, con la libertad, la justicia, la igualdad y el pluralismo político como valores superiores. La Corona es hereditaria y simboliza la unidad de España.","why_wrong":{"una república federal.":"en una república el jefe del Estado es un presidente elegido, mientras que en España lo es el rey, cargo hereditario.","una monarquía federal.":"España sí tiene rey, pero no es un Estado federal: la Constitución la define como patria común e indivisible, organizada en comunidades autónomas, provincias y municipios."},"source_page":6},{"id":"3e562aa95a","num":1002,"tarea":1,"type":"mc","question":"La ley fundamental de España se llama...","options":["Constitución.","Ley básica.","Ordenamiento esencial."],"answer_index":0,"explanation":"La Constitución es la «ley de leyes», aprobada en referéndum el 6 de diciembre de 1978, y a partir de ella se establece todo el ordenamiento jurídico español.","why_wrong":{"Ley básica.":"la expresión ley institucional básica se usa para el Estatuto de Autonomía de cada comunidad, no para la norma suprema del Estado.","Ordenamiento esencial.":"el ordenamiento jurídico es el conjunto de normas que se deriva de la Constitución, no el nombre de ninguna ley."},"source_page":6},{"id":"5d972e456b","num":1003,"tarea":1,"type":"mc","question":"Según la Constitución española, la soberanía nacional reside en...","options":["el pueblo español.","el Gobierno del Estado.","el Congreso de los Diputados."],"answer_index":0,"explanation":"La soberanía nacional corresponde al pueblo español y de él derivan todos los poderes del Estado; el pueblo la ejerce mediante sufragio universal, libre, igual, directo y secreto desde los 18 años.","why_wrong":{"el Gobierno del Estado.":"es el órgano superior del poder ejecutivo y dirige la política interior y exterior y la Administración civil y militar, pero su poder deriva del pueblo.","el Congreso de los Diputados.":"es una de las dos cámaras de las Cortes Generales, con 350 diputados elegidos por provincias; representa al pueblo, pero no es el titular de la soberanía."},"source_page":6},{"id":"cddc5c787d","num":1004,"tarea":1,"type":"mc","question":"El Instituto de las Mujeres es...","options":["una institución europea.","un organismo español.","una ONG."],"answer_index":1,"explanation":"El Instituto de las Mujeres es uno de los organismos públicos españoles que dependen de un ministerio, como el Instituto Cervantes o el Instituto Nacional de Estadística (INE).","why_wrong":{"una institución europea.":"las instituciones de la Unión Europea son otras, como el Parlamento Europeo, en el que España elige a sus eurodiputados.","una ONG.":"una organización de ese tipo es una asociación privada que debe inscribirse en un registro según el artículo 22 de la Constitución, mientras que este instituto es público y depende de un ministerio."},"source_page":11},{"id":"bd1c05bce7","num":1005,"tarea":1,"type":"mc","question":"¿Cuándo puedo hacer los trámites en la sede electrónica?","options":["En cualquier horario.","Únicamente por la mañana.","De lunes a viernes."],"answer_index":0,"explanation":"Los trámites en línea están disponibles en cualquier momento, no solo en horario de oficina, y además permiten consultar en cualquier momento cómo va el expediente sin desplazarse ni hacer colas.","why_wrong":{"Únicamente por la mañana.":"ese es el horario propio de la atención presencial en las oficinas, que es justo lo que la sede electrónica evita.","De lunes a viernes.":"la sede electrónica de cada ministerio u organismo es una web oficial siempre accesible, sin restricción de días de la semana."},"source_page":15},{"id":"26aed27e54","num":1006,"tarea":1,"type":"mc","question":"El castellano o español es lengua oficial...","options":["en toda España.","solo donde no hay otras lenguas.","en toda la península ibérica."],"answer_index":0,"explanation":"La Constitución indica que el castellano es la lengua oficial del Estado: todos los españoles tienen el derecho de usarla y el deber de conocerla. Las demás lenguas españolas son también oficiales solo en las comunidades donde se usan, según sus estatutos.","why_wrong":{"solo donde no hay otras lenguas.":"en Galicia, Cataluña, Islas Baleares, Comunidad Valenciana, Navarra y País Vasco el castellano es oficial a la vez que la lengua propia, es decir, cooficial con ella.","en toda la península ibérica.":"la península incluye también Portugal y Andorra, países independientes que no forman parte de España."},"source_page":7},{"id":"4ec40f7d81","num":1007,"tarea":1,"type":"mc","question":"¿Cuál de estas fuerzas de seguridad es de ámbito autonómico?","options":["Policía local.","Guardia Civil.","Policía Foral de Navarra."],"answer_index":2,"explanation":"Las policías autonómicas son cuatro: la Ertzaintza en el País Vasco, los Mossos d'Esquadra en Cataluña, la Policía Foral de Navarra y el Cuerpo General de la Policía de Canarias.","why_wrong":{"Policía local.":"es de ámbito local: protege a las instituciones y autoridades locales, regula el tráfico en pueblos y ciudades y presta auxilio en accidentes.","Guardia Civil.":"es un cuerpo de ámbito nacional, con mando superior en el ministro del Interior, que vigila el tráfico interurbano, los puertos, aeropuertos, fronteras y costas."},"source_page":11,"source_quote":"De ámbito autonómico: Ertzaintza en el País Vasco, Mossos d'Esquadra en Cataluña, Policía Foral de Navarra, Cuerpo General de la Policía de Canarias."},{"id":"285f466abe","num":1008,"tarea":1,"type":"mc","question":"¿Qué fuerza de seguridad está en toda España?","options":["La Policía Foral de Navarra.","El Cuerpo Nacional de Policía.","Los Mossos d'Esquadra."],"answer_index":1,"explanation":"Junto a la Guardia Civil forma las Fuerzas y Cuerpos de Seguridad del Estado, con mando superior en el ministro del Interior. Expide el Documento Nacional de Identidad (DNI) y el pasaporte, tramita permisos de residencia y trabajo y controla la entrada y salida del territorio nacional.","why_wrong":{"La Policía Foral de Navarra.":"es la policía autonómica de Navarra y actúa solo en esa comunidad.","Los Mossos d'Esquadra.":"son el cuerpo autonómico de Cataluña, equivalente a la Ertzaintza en el País Vasco."},"source_page":11},{"id":"b81f788cad","num":1009,"tarea":1,"type":"mc","question":"En la Constitución se establece la separación de poderes: el poder ejecutivo, el legislativo y el...","options":["judicial.","informativo.","político."],"answer_index":0,"explanation":"El poder judicial está formado por jueces y magistrados que administran la justicia bajo el principio de unidad jurisdiccional; su órgano de gobierno es el Consejo General del Poder Judicial.","why_wrong":{"informativo.":"la información oficial del Estado se difunde por el Boletín Oficial del Estado y los boletines autonómicos, que no constituyen un poder del Estado.","político.":"el pluralismo político es uno de los valores superiores de la Constitución, no uno de los tres poderes."},"source_page":10},{"id":"2e8246a89a","num":1010,"tarea":1,"type":"mc","question":"La bandera de España debe utilizarse...","options":["solo los días de fiesta oficial.","en todos los edificios públicos.","solo en actos del Gobierno español."],"answer_index":1,"explanation":"Cada comunidad autónoma tiene su propia bandera y debe usarla junto a la española en sus edificios públicos y en sus actos oficiales. La bandera española tiene tres franjas: roja, amarilla y roja.","why_wrong":{"solo los días de fiesta oficial.":"el uso no se limita a unas fechas: alcanza también a los actos oficiales y a los edificios de forma permanente.","solo en actos del Gobierno español.":"también ondea en los edificios y actos oficiales de las comunidades autónomas, acompañada de la bandera propia de cada una."},"source_page":7},{"id":"c9f84a3d36","num":1011,"tarea":1,"type":"mc","question":"¿Quién es el jefe del Estado en España?","options":["El presidente del Gobierno.","El rey.","El ministro de Economía."],"answer_index":1,"explanation":"El rey tiene la máxima representación del Estado: aprueba y ordena la publicación de las leyes, nombra a los miembros del Gobierno a propuesta de su presidente y tiene el mando supremo de las Fuerzas Armadas. Felipe VI fue proclamado el 19 de junio de 2014.","why_wrong":{"El presidente del Gobierno.":"encabeza el poder ejecutivo, es investido en el Congreso de los Diputados y reside en el Palacio de la Moncloa.","El ministro de Economía.":"es un miembro más del Gobierno, nombrado por el rey a propuesta del presidente."},"source_page":8},{"id":"b5be93cec7","num":1012,"tarea":1,"type":"mc","question":"La gestión de la sanidad es competencia de...","options":["el Estado.","las comunidades autónomas.","los ayuntamientos."],"answer_index":1,"explanation":"La sanidad y la educación son las competencias más significativas asumidas por las comunidades autónomas en sus Estatutos de Autonomía, con el traspaso de los servicios correspondientes.","why_wrong":{"el Estado.":"sus competencias exclusivas son materias como la nacionalidad, la extranjería, la inmigración, las relaciones internacionales y la administración de justicia.","los ayuntamientos.":"se ocupan del patrimonio histórico, el medio ambiente, el urbanismo, el suministro de agua e iluminación y las instalaciones culturales y deportivas."},"source_page":13},{"id":"acf7129f6e","num":1013,"tarea":1,"type":"mc","question":"¿Quién fue el primer presidente del Gobierno de España en democracia?","options":["Mariano Rajoy.","Adolfo Suárez.","José Luis Rodríguez Zapatero."],"answer_index":1,"explanation":"Gobernó entre 1979 y 1981 con Unión de Centro Democrático (UCD) y le sucedió Leopoldo Calvo-Sotelo, del mismo partido. Desde 1978 hasta 2023 ha habido 7 presidentes de Gobierno de 3 partidos distintos.","why_wrong":{"Mariano Rajoy.":"presidió el Gobierno entre 2011 y 2018 por el Partido Popular, muchos años después de la aprobación de la Constitución.","José Luis Rodríguez Zapatero.":"gobernó entre 2004 y 2011 por el Partido Socialista Obrero Español (PSOE), tras José María Aznar."},"source_page":17},{"id":"cd1fd3dcc9","num":1014,"tarea":1,"type":"mc","question":"¿Cuál de estos organismos se encarga de interpretar la Constitución?","options":["El Poder Constitucional.","El Tribunal Constitucional.","El Consejo General del Poder Judicial."],"answer_index":1,"explanation":"El Tribunal Constitucional es independiente de los poderes del Estado, lo que le permite interpretar la norma fundamental sin depender del Gobierno ni de las Cortes.","why_wrong":{"El Poder Constitucional.":"no existe con ese nombre: los poderes que separa la Constitución son el ejecutivo, el legislativo y el judicial.","El Consejo General del Poder Judicial.":"es el órgano de gobierno de los jueces y sirve para garantizar la independencia de jueces y tribunales."},"source_page":10},{"id":"ad169e4b3a","num":1015,"tarea":1,"type":"mc","question":"¿Quién modera el funcionamiento de las instituciones españolas?","options":["El presidente del Gobierno.","El rey.","El director de la Real Academia Española."],"answer_index":1,"explanation":"El papel del rey consiste en actuar como mediador y garantizar el buen funcionamiento de las instituciones; la Corona es el símbolo de la unidad de España. Su residencia oficial es el Palacio Real, aunque vive en el Palacio de la Zarzuela.","why_wrong":{"El presidente del Gobierno.":"dirige, junto con su Gobierno, la política interior y exterior y la Administración civil y militar, es decir, gobierna en lugar de moderar.","El director de la Real Academia Española.":"la Real Academia Española (RAE) es el organismo encargado de la normalización lingüística del castellano, sin funciones institucionales del Estado."},"source_page":8},{"id":"0871f2771f","num":1016,"tarea":1,"type":"mc","question":"¿Cómo se llama la cámara de representación territorial en España?","options":["Senado.","Diputación permanente.","Congreso de los Diputados."],"answer_index":0,"explanation":"El Senado puede variar en su número de miembros y en la actualidad tiene 265 senadores: la mayoría los eligen los ciudadanos en las elecciones generales y el resto son elegidos por las comunidades autónomas.","why_wrong":{"Diputación permanente.":"las Cortes Generales solo tienen dos cámaras, el Congreso de los Diputados y el Senado, y la Diputación Permanente no es ninguna de ellas.","Congreso de los Diputados.":"tiene 350 diputados elegidos por provincias y en él se celebran la investidura del presidente, las cuestiones de confianza y las mociones de censura."},"source_page":9},{"id":"d3498d66f1","num":1017,"tarea":1,"type":"mc","question":"¿Qué se necesita para hacer trámites por internet con la Administración?","options":["Un pasaporte válido.","Una firma electrónica.","Una firma en papel."],"answer_index":1,"explanation":"Para actuar en la sede electrónica hace falta una identidad digital: el Documento Nacional de Identidad (DNI) electrónico, el certificado digital o la plataforma Cl@ve sirven como firma electrónica y aportan seguridad jurídica.","why_wrong":{"Un pasaporte válido.":"es un documento de viaje que expide la Policía Nacional, no un sistema de identificación digital ante la Administración.","Una firma en papel.":"tiene el mismo valor jurídico que la electrónica, pero no es válida para internet."},"source_page":15,"source_quote":"Los ciudadanos usan sistemas de identificación segura como el DNI electrónico, el certificado digital o la plataforma Cl@ve."},{"id":"e40a694238","num":1018,"tarea":1,"type":"mc","question":"¿Cómo se aprobó la Constitución?","options":["Por imposición legal.","Por referéndum.","Por el Tribunal Constitucional."],"answer_index":1,"explanation":"Fueron los españoles quienes la aprobaron en referéndum el 6 de diciembre de 1978, fecha a partir de la cual España se organiza en comunidades autónomas, provincias y municipios.","why_wrong":{"Por imposición legal.":"la norma que el Gobierno dicta por sí solo, en casos de especial urgencia, es el decreto ley, y está sometida a la Constitución.","Por el Tribunal Constitucional.":"este tribunal interpreta la Constitución ya aprobada; no la aprueba ni la redacta."},"source_page":6},{"id":"6ebc5c131d","num":1019,"tarea":1,"type":"mc","question":"¿Cómo se llama la ley más importante de cada comunidad autónoma?","options":["Estatuto de Autonomía.","Normativa autonómica.","Ley de la comunidad."],"answer_index":0,"explanation":"El Estatuto de Autonomía fija el nombre de la comunidad, la delimitación de su territorio, la organización y sede de sus instituciones propias y las competencias que asume, entre ellas la sanidad y la educación.","why_wrong":{"Normativa autonómica.":"es una expresión general para el conjunto de reglamentos y órdenes que desarrollan las leyes, no el nombre de la ley institucional básica de la comunidad.","Ley de la comunidad.":"las leyes que aprueba la asamblea legislativa autonómica se dictan dentro del marco que fija el Estatuto de Autonomía, cuya aprobación la Constitución reserva a la ley orgánica."},"source_page":12},{"id":"d26cf05568","num":1020,"tarea":1,"type":"mc","question":"Las instalaciones culturales y deportivas públicas son competencia del...","options":["Ayuntamiento.","Ministerio de Educación, Formación Profesional y Deportes.","Ministerio de Igualdad."],"answer_index":0,"explanation":"El ayuntamiento, formado por el alcalde y los concejales, gestiona los servicios públicos del municipio: patrimonio histórico, medio ambiente, urbanismo, suministro de agua e iluminación y las actividades e instalaciones culturales y deportivas.","why_wrong":{"Ministerio de Educación, Formación Profesional y Deportes.":"la educación es una competencia asumida por las comunidades autónomas, y las instalaciones culturales y deportivas se gestionan desde el ayuntamiento.","Ministerio de Igualdad.":"en materia de igualdad el Estado actúa mediante organismos dependientes de ministerios, como el Instituto de las Mujeres, no gestionando polideportivos ni centros culturales locales."},"source_page":14},{"id":"7b72219240","num":1021,"tarea":1,"type":"mc","question":"¿Quién dirige la administración militar de España?","options":["Los ayuntamientos.","El Gobierno.","Las Cortes Generales."],"answer_index":1,"explanation":"El Gobierno dirige la política interior y exterior, la Administración civil y militar y la defensa del Estado. Dentro de él, la dirección de las Fuerzas Armadas corresponde al Ministerio de Defensa, mientras el rey ostenta el mando supremo.","why_wrong":{"Los ayuntamientos.":"son órganos de gobierno local que gestionan los servicios públicos del municipio, sin competencias de defensa.","Las Cortes Generales.":"su función es elaborar, debatir y aprobar las leyes y los Presupuestos y controlar la acción del Gobierno, no dirigir la Administración."},"source_page":9},{"id":"1325b120a6","num":1022,"tarea":1,"type":"mc","question":"¿Qué hay en las Islas Baleares, en vez de diputaciones?","options":["Cabildos.","Consejos insulares.","Centros de diputados."],"answer_index":1,"explanation":"La Diputación es el órgano de gobierno de la provincia en toda España excepto en Canarias e Islas Baleares; tampoco la tienen las comunidades autónomas uniprovinciales, como Madrid o La Rioja.","why_wrong":{"Cabildos.":"son los órganos de gobierno insular de Canarias, no de Baleares.","Centros de diputados.":"no existe ese órgano; los diputados son los 350 miembros del Congreso, elegidos por provincias."},"source_page":14},{"id":"756da1a8b1","num":1023,"tarea":1,"type":"mc","question":"¿Qué ciudad tiene más habitantes?","options":["Sevilla.","Barcelona.","Zaragoza."],"answer_index":1,"explanation":"Barcelona es la segunda ciudad más poblada de España, solo por detrás de Madrid.","why_wrong":{"Sevilla.":"es la cuarta ciudad más poblada, detrás de Madrid, Barcelona y Valencia.","Zaragoza.":"es la quinta ciudad más poblada, detrás de Madrid, Barcelona, Valencia y Sevilla."},"source_page":15,"source_quote":"Las diez ciudades de España con mayor población son, por este orden: Madrid, Barcelona, Valencia, Sevilla, Zaragoza, Málaga, Murcia, Palma de Mallorca, Las Palmas de Gran Canaria y Alicante."},{"id":"2f2d568da4","num":1024,"tarea":1,"type":"mc","question":"Las Cortes Generales representan...","options":["al pueblo español.","a los partidos políticos.","a los ministros."],"answer_index":0,"explanation":"Cortes Generales es el nombre oficial del Parlamento español y se compone de dos cámaras, el Congreso de los Diputados y el Senado; elaboran, debaten y aprueban las leyes y los Presupuestos generales del Estado y controlan la acción del Gobierno.","why_wrong":{"a los partidos políticos.":"los partidos, reconocidos en el artículo 6 de la Constitución, son las opciones entre las que eligen los votantes en un sistema pluripartidista, no los representados en las Cortes.","a los ministros.":"los ministros, con el presidente y los vicepresidentes, forman el Gobierno; son nombrados por el rey a propuesta del presidente y las Cortes los controlan."},"source_page":9},{"id":"0b63dc06e1","num":1025,"tarea":1,"type":"mc","question":"El Congreso de los Diputados y el Senado constituyen el poder...","options":["ejecutivo.","legislativo.","judicial."],"answer_index":1,"explanation":"Ambas cámaras forman las Cortes Generales: 350 diputados elegidos por provincias y, en la actualidad, 265 senadores. El presidente del Congreso es la tercera autoridad del Estado.","why_wrong":{"ejecutivo.":"lo encabeza el Gobierno, formado por el presidente, los vicepresidentes y los ministros, con sede en Madrid.","judicial.":"lo integran los jueces y magistrados que administran justicia, con el Consejo General del Poder Judicial como órgano de gobierno."},"source_page":9},{"id":"a8c0a22646","num":1026,"tarea":1,"type":"mc","question":"¿Cómo pueden los ciudadanos proponer nuevas leyes al Congreso?","options":["Reuniendo 500 000 firmas.","Solicitándolo al rey.","Creando una asociación."],"answer_index":0,"explanation":"Un mínimo de 500 000 ciudadanos puede presentar una proposición de ley, igual que pueden hacerlo el Congreso, el Senado o una comunidad autónoma; cuando la iniciativa viene del Gobierno se llama proyecto de ley.","why_wrong":{"Solicitándolo al rey.":"el rey convoca las elecciones y aprueba y ordena publicar las leyes ya aprobadas, pero no lleva iniciativas ciudadanas al Congreso.","Creando una asociación.":"el derecho de asociación del artículo 22 de la Constitución obliga a inscribirse en un registro, pero no otorga iniciativa legislativa."},"source_page":10},{"id":"3b6b4febf6","num":1027,"tarea":1,"type":"mc","question":"¿Cuántas comunidades autónomas hay en España?","options":["8.","17.","25."],"answer_index":1,"explanation":"Son 17 comunidades autónomas y 2 ciudades autónomas, Ceuta y Melilla. Se formaron a partir de características históricas, culturales y económicas comunes de provincias con fronteras compartidas.","why_wrong":{"8.":"8 es el número de provincias de Andalucía, no el de comunidades autónomas.","25.":"supera el total: a las 17 comunidades solo hay que sumar 2 ciudades autónomas, Ceuta y Melilla."},"source_page":12},{"id":"79b19a1539","num":1028,"tarea":1,"type":"mc","question":"Los colores de la bandera española son...","options":["blanco y rojo.","rojo y amarillo.","amarillo y blanco."],"answer_index":1,"explanation":"La bandera tiene tres franjas dispuestas roja, amarilla y roja, y cada comunidad autónoma debe usar su propia bandera junto a ella en edificios públicos y actos oficiales.","why_wrong":{"blanco y rojo.":"el blanco no aparece en la enseña española: la franja central es amarilla.","amarillo y blanco.":"acierta con el amarillo central, pero las dos franjas exteriores son rojas, no blancas."},"source_page":6},{"id":"5d2b9dbaaa","num":1029,"tarea":1,"type":"mc","question":"¿Dónde está la sede del Gobierno de España?","options":["En Madrid.","En Barcelona.","En Sevilla."],"answer_index":0,"explanation":"El Gobierno tiene su sede en Madrid, capital de España desde mediados del siglo XVI; el presidente reside oficialmente en el Palacio de la Moncloa.","why_wrong":{"En Barcelona.":"es la segunda ciudad más poblada del país, pero nunca ha sido capital del Estado.","En Sevilla.":"es la cuarta ciudad más poblada; las ciudades que fueron capital antes de Madrid fueron Valladolid y Toledo."},"source_page":9},{"id":"41ec9ad585","num":1030,"tarea":1,"type":"mc","question":"La bandera azul con 12 estrellas amarillas en círculo es la bandera de...","options":["la Unión Europea.","el Parlamento Europeo.","la Comisión de Europa."],"answer_index":0,"explanation":"España entró en la Comunidad Económica Europea, hoy Unión Europea (UE), el 1 de enero de 1986 y ha ejercido cinco veces la Presidencia de turno semestral del Consejo de la UE: 1989, 1995, 2002, 2010 y 2023.","why_wrong":{"el Parlamento Europeo.":"es una institución de la Unión cuyos eurodiputados se eligen cada cinco años en las elecciones europeas; la bandera es de la Unión en su conjunto.","la Comisión de Europa.":"no existe con ese nombre; sí existe el Consejo de Europa, otra organización internacional a la que pertenece España."},"source_page":8},{"id":"749b782945","num":1031,"tarea":1,"type":"mc","question":"En las elecciones municipales se vota a...","options":["alcaldes y concejales.","ministros y ministras.","diputados y senadores."],"answer_index":0,"explanation":"El órgano de gobierno del municipio es el ayuntamiento, formado por el alcalde y los concejales, elegidos por los habitantes de la localidad. En estas elecciones también pueden votar los residentes procedentes de la Unión Europea y de algunos países con acuerdos firmados con España.","why_wrong":{"ministros y ministras.":"no se eligen en las urnas: los nombra el rey a propuesta del presidente del Gobierno.","diputados y senadores.":"se eligen en las elecciones generales, que junto con las autonómicas y municipales se convocan cada cuatro años."},"source_page":16},{"id":"3d8a72fce4","num":1032,"tarea":1,"type":"mc","question":"¿Qué lengua es oficial en el País Vasco?","options":["El bable.","El aragonés.","El euskera."],"answer_index":2,"explanation":"El vasco o euskera es oficial tanto en el País Vasco como en Navarra; su organismo de normalización es la Real Academia de la Lengua Vasca (Euskaltzaindia) y de su difusión se encargan el Instituto Vasco Etxepare y el Instituto Navarro del Vascuence.","why_wrong":{"El bable.":"no es una lengua oficial en España; además del castellano lo son el gallego, el vasco o euskera, el catalán o valenciano y el aranés.","El aragonés.":"Aragón no tiene lengua oficial propia además del castellano."},"source_page":7},{"id":"2834b9daff","num":1033,"tarea":1,"type":"mc","question":"Todos los españoles tienen el deber de conocer la lengua...","options":["autonómica del Estado.","oficial del Estado.","local del Estado."],"answer_index":1,"explanation":"La lengua oficial del Estado es el castellano: la Constitución reconoce el derecho de usarla y el deber de conocerla en toda España.","why_wrong":{"autonómica del Estado.":"las demás lenguas españolas son oficiales solo en su comunidad, de acuerdo con su estatuto, y su enseñanza es competencia autonómica.","local del Estado.":"no existe esa categoría; incluso el aranés, hablado en un territorio pequeño, tiene rango de lengua cooficial en Cataluña."},"source_page":7},{"id":"6dc105b23f","num":1034,"tarea":1,"type":"mc","question":"El aranés es una lengua cooficial que se habla en un pequeño territorio de...","options":["Cataluña.","La Rioja.","Aragón."],"answer_index":0,"explanation":"Cataluña tiene dos lenguas oficiales propias además del castellano: el catalán y el aranés.","why_wrong":{"La Rioja.":"en La Rioja no hay lengua cooficial: allí el castellano es la única lengua oficial.","Aragón.":"las comunidades con lengua oficial propia son Galicia, Navarra, País Vasco, Cataluña, Islas Baleares y Comunidad Valenciana, y Aragón no es una de ellas."},"source_page":7},{"id":"7353a943f0","num":1035,"tarea":1,"type":"mc","question":"Las instituciones de una comunidad autónoma son: el consejo de gobierno, el presidente y...","options":["el ayuntamiento.","la asamblea legislativa.","la delegación de gobierno."],"answer_index":1,"explanation":"La asamblea legislativa, o parlamento autonómico, se elige por votación popular en las elecciones autonómicas; el consejo de gobierno tiene funciones ejecutivas y el presidente, además de ejecutivas, representa a la comunidad.","why_wrong":{"el ayuntamiento.":"es el órgano de gobierno del municipio, formado por alcalde y concejales, dentro del nivel local de la Administración.","la delegación de gobierno.":"el delegado del Gobierno representa al Estado en la comunidad y coordina la Administración estatal en ese territorio, por lo que no es una institución autonómica."},"source_page":13},{"id":"8419f81cae","num":1036,"tarea":1,"type":"mc","question":"¿Cuál de estas opciones es una lengua cooficial en alguna comunidad autónoma?","options":["El gallego.","El aragonés.","El murciano."],"answer_index":0,"explanation":"El gallego es lengua oficial en Galicia; su normalización corresponde a la Real Academia Galega y su difusión a la Secretaría Xeral de Política Lingüística.","why_wrong":{"El aragonés.":"Aragón no tiene lengua oficial propia además del castellano y el aragonés no cuenta con un organismo oficial de normalización.","El murciano.":"Murcia es una comunidad cuya única lengua oficial es el castellano, regulado por la Real Academia Española."},"source_page":7},{"id":"8691616049","num":1037,"tarea":1,"type":"mc","question":"¿Qué institución tiene como fin la promoción de la enseñanza de la lengua española y la difusión de la cultura en español?","options":["El Instituto Nacional de Administración Pública.","El Instituto Nacional de Estadística.","El Instituto Cervantes."],"answer_index":2,"explanation":"El Instituto Cervantes es el organismo encargado de la difusión y la promoción del castellano y de la cultura en español, mientras que la normalización de la lengua corresponde a la Real Academia Española (RAE). Depende de un ministerio y tiene su sede en Madrid.","why_wrong":{"El Instituto Nacional de Administración Pública.":"por su nombre corresponde al ámbito de la Administración Pública y no se ocupa de la normalización ni de la difusión de las lenguas.","El Instituto Nacional de Estadística.":"el Instituto Nacional de Estadística (INE) es un organismo dependiente de un ministerio dedicado a la estadística oficial, como los datos de población por comunidades."},"source_page":7},{"id":"1d65502666","num":1038,"tarea":1,"type":"mc","question":"¿Cuál de los siguientes organismos trabaja para conseguir la normalización lingüística?","options":["El Institut Ramon Llull.","El Instituto Cervantes.","La Real Academia Española."],"answer_index":2,"explanation":"La Real Academia Española (RAE) es el organismo de normalización del castellano; cada lengua cooficial tiene el suyo: Institut d'Estudis Catalans para el catalán, Acadèmia Valenciana de la Llengua, Real Academia Galega y Euskaltzaindia.","why_wrong":{"El Institut Ramon Llull.":"se dedica a la difusión y promoción del catalán y su cultura, junto al Institut d'Estudis Baleàrics.","El Instituto Cervantes.":"difunde y promueve el español y la cultura en español, pero no fija la norma de la lengua."},"source_page":7,"source_quote":"Castellano o español: Real Academia Española (RAE). Catalán: Institut d'Estudis Catalans. Valenciano: Acadèmia Valenciana de la Llengua. Gallego: Real Academia Galega. Vasco o euskera: Real Academia de la Lengua Vasca-Euskaltzaindia."},{"id":"2e20fa62e6","num":1039,"tarea":1,"type":"mc","question":"¿Dónde vive el presidente del Gobierno?","options":["En el Palacio Real.","En el Palacio de la Zarzuela.","En el Palacio de la Moncloa."],"answer_index":2,"explanation":"La Moncloa es la residencia oficial del presidente del Gobierno, cuyo Ejecutivo tiene su sede en Madrid y está formado por el presidente, uno o varios vicepresidentes y los ministros.","why_wrong":{"En el Palacio Real.":"es la residencia oficial del rey, aunque no viva en él.","En el Palacio de la Zarzuela.":"es donde vive realmente el rey de España."},"source_page":9},{"id":"8ee939085e","num":1040,"tarea":1,"type":"mc","question":"¿Cuál de los siguientes cuerpos forma parte de las Fuerzas Armadas de España?","options":["La Policía Foral.","La Guardia Civil.","El Ejército del Aire."],"answer_index":2,"explanation":"Las Fuerzas Armadas están compuestas por el Ejército de Tierra, el Ejército del Aire y la Armada; su máxima autoridad es el rey y su dirección corresponde al Ministerio de Defensa. Participan en misiones de paz de la Organización de las Naciones Unidas (ONU) desde 1989.","why_wrong":{"La Policía Foral.":"es una fuerza de seguridad de ámbito autonómico, la de Navarra.","La Guardia Civil.":"es una Fuerza y Cuerpo de Seguridad del Estado, de ámbito nacional y con mando superior en el ministro del Interior."},"source_page":10},{"id":"73782f21c8","num":1041,"tarea":1,"type":"mc","question":"¿Quiénes forman parte del Gobierno?","options":["Los ministros.","Los concejales.","Los alcaldes."],"answer_index":0,"explanation":"El Gobierno es el órgano superior del poder ejecutivo y lo forman el presidente, uno o varios vicepresidentes y los ministros; tiene su sede en Madrid y sus miembros juran o prometen el cargo ante un ejemplar de la Constitución en presencia del rey.","why_wrong":{"Los concejales.":"son los miembros del ayuntamiento, elegidos por los vecinos en las elecciones municipales para gestionar los servicios públicos del municipio.","Los alcaldes.":"encabezan el ayuntamiento, órgano de gobierno de cada uno de los 8132 municipios españoles, es decir, pertenecen a la Administración local."},"source_page":9},{"id":"acab7e47d7","num":1042,"tarea":1,"type":"mc","question":"España es un...","options":["estado social y democrático de Derecho.","estado libre asociado.","estado confederado."],"answer_index":0,"explanation":"La forma política del Reino de España es la monarquía parlamentaria, y sus valores superiores son la libertad, la justicia, la igualdad y el pluralismo político; la soberanía nacional corresponde al pueblo español, del que derivan todos los poderes del Estado.","why_wrong":{"estado libre asociado.":"esa fórmula supone la dependencia de un territorio respecto de otro Estado, mientras que la Constitución define España como patria común e indivisible cuya soberanía es del pueblo español.","estado confederado.":"una confederación une Estados soberanos distintos; en España la soberanía es única y las 17 comunidades y 2 ciudades autónomas tienen autonomía de gestión, no soberanía."},"source_page":6},{"id":"ef8e202cbd","num":1043,"tarea":1,"type":"mc","question":"¿Cuál de las siguientes siglas corresponde a un partido político?","options":["PP.","PIB.","UE."],"answer_index":0,"explanation":"PP son las siglas del Partido Popular, uno de los tres partidos que han dado presidentes del Gobierno desde 1978, junto con Unión de Centro Democrático (UCD) y el Partido Socialista Obrero Español (PSOE): por el PP gobernaron José María Aznar (1996-2004) y Mariano Rajoy (2011-2018).","why_wrong":{"PIB.":"son las siglas del producto interior bruto, un indicador económico, no una organización política.","UE.":"corresponde a la Unión Europea, la organización internacional a la que España se unió el 1 de enero de 1986."},"source_page":17},{"id":"3709bff3a8","num":1044,"tarea":1,"type":"mc","question":"¿Qué título tiene la futura reina, hija del rey?","options":["Princesa de Asturias.","Princesa de Aragón.","Duquesa de Alba."],"answer_index":0,"explanation":"La Corona de España es hereditaria y el heredero o heredera recibe el título de Príncipe o Princesa de Asturias; desde 2014 reina Felipe VI, cuya hija mayor ostenta ese título.","why_wrong":{"Princesa de Aragón.":"Aragón fue un reino histórico, pero ningún título vinculado a él designa a quien va a heredar la Corona.","Duquesa de Alba.":"es un título nobiliario de una casa aristocrática, sin ninguna función en la sucesión al trono."},"source_page":8},{"id":"b44963b561","num":1045,"tarea":1,"type":"mc","question":"¿Con qué rey se restaura la democracia en España después del régimen de Franco?","options":["Con Carlos III.","Con Alfonso XIII.","Con Juan Carlos I."],"answer_index":2,"explanation":"Juan Carlos I fue rey desde el 22 de noviembre de 1975, pocos días después de la muerte de Franco, hasta el 18 de junio de 2014; durante su reinado apoyó e impulsó el proceso hacia la democracia y España se integró en la Unión Europea.","why_wrong":{"Con Carlos III.":"fue un rey de la dinastía borbónica del siglo XVIII, dos siglos anterior a la dictadura.","Con Alfonso XIII.":"reinó en el primer tercio del siglo XX, antes de la Segunda República, es decir, antes del régimen de Franco y no después."},"source_page":8},{"id":"c2addaf34f","num":1046,"tarea":1,"type":"mc","question":"¿En qué año se aprobó la Constitución española?","options":["En 1957.","En 1978.","En 2001."],"answer_index":1,"explanation":"La Constitución fue aprobada en referéndum por los españoles el 6 de diciembre de 1978 y es la ley de leyes a partir de la cual se ordena todo el sistema jurídico; en ella se establece también la organización de España en comunidades autónomas, provincias y municipios.","why_wrong":{"En 1957.":"en esa fecha España seguía bajo el régimen de Franco, sin texto constitucional democrático ni sufragio universal.","En 2001.":"para entonces la Constitución llevaba más de veinte años en vigor y ya habían gobernado presidentes como Adolfo Suárez, Felipe González y José María Aznar."},"source_page":6},{"id":"0d357f77f0","num":1047,"tarea":1,"type":"mc","question":"¿Cuántas comunidades autónomas tienen su propia bandera?","options":["Ninguna.","Todas.","Las que tienen una lengua cooficial."],"answer_index":1,"explanation":"Cada una de las 17 comunidades autónomas tiene bandera propia y debe usarla junto a la española, de tres franjas roja, amarilla y roja, en sus edificios públicos y en sus actos oficiales.","why_wrong":{"Ninguna.":"todas las comunidades tienen bandera propia, y usarla en los edificios públicos y en los actos oficiales es un deber, no solo una posibilidad.","Las que tienen una lengua cooficial.":"solo seis comunidades tienen lengua cooficial (Galicia, Navarra, País Vasco, Cataluña, Islas Baleares y Comunidad Valenciana), muchas menos que las que poseen bandera."},"source_page":6},{"id":"be6f62a416","num":1048,"tarea":1,"type":"mc","question":"¿Qué organismo oficial atiende las quejas de los ciudadanos por el mal funcionamiento de las administraciones?","options":["La Oficina de Atención al Consumidor.","La Policía Nacional.","El Defensor del Pueblo."],"answer_index":2,"explanation":"El Defensor del Pueblo garantiza el respeto de los derechos fundamentales, es elegido por el Congreso y el Senado para un mandato de cinco años, no recibe órdenes de ninguna autoridad y su intervención es gratuita para cualquier ciudadano.","why_wrong":{"La Oficina de Atención al Consumidor.":"las asociaciones de consumidores y usuarios, reconocidas en el artículo 51 de la Constitución, defienden al consumidor frente a empresas y servicios, no frente a la Administración.","La Policía Nacional.":"es un cuerpo de seguridad del Estado que expide el Documento Nacional de Identidad (DNI) y el pasaporte y tramita autorizaciones y permisos de residencia y trabajo."},"source_page":11},{"id":"04f96e123e","num":1049,"tarea":1,"type":"mc","question":"¿Cuántas firmas, como mínimo, deben recoger los ciudadanos para poder presentar una proposición de ley?","options":["250 000.","100 000.","500 000."],"answer_index":2,"explanation":"La iniciativa popular exige un mínimo de 500 000 firmas; también pueden presentar proposiciones de ley el Congreso, el Senado o una comunidad autónoma, mientras que cuando la propone el Gobierno se llama proyecto de ley.","why_wrong":{"250 000.":"es la mitad del mínimo legal y no basta para registrar una iniciativa legislativa popular.","100 000.":"es solo la quinta parte de las firmas exigidas por la norma."},"source_page":10},{"id":"63e200b326","num":1050,"tarea":1,"type":"mc","question":"¿A cuál de las siguientes organizaciones internacionales pertenece España?","options":["Comunidad de Estados Independientes (CEI).","Fondo Monetario Internacional (FMI).","Unión Económica Euroasiática (UEE)."],"answer_index":1,"explanation":"España pertenece al Fondo Monetario Internacional y también al Banco Mundial, a la Organización de las Naciones Unidas (ONU), al Consejo de Europa, a la Organización del Tratado del Atlántico Norte (OTAN) y a la Unión Europea, en la que entró el 1 de enero de 1986.","why_wrong":{"Comunidad de Estados Independientes (CEI).":"agrupa a Estados surgidos de la antigua Unión Soviética, un ámbito ajeno a España, cuyo espacio preferente de relación exterior es la Comunidad Iberoamericana de Naciones.","Unión Económica Euroasiática (UEE).":"es un bloque de integración económica euroasiático; la unión económica de la que España forma parte es la Unión Europea, de bandera azul con 12 estrellas amarillas."},"source_page":8},{"id":"113c3fb851","num":1051,"tarea":1,"type":"mc","question":"En la organización de la Administración se distinguen tres niveles: central, autonómica y...","options":["estatal.","regional.","local."],"answer_index":2,"explanation":"El tercer nivel es el local, que incluye las provincias (50, más las ciudades autónomas de Ceuta y Melilla) y los 8132 municipios; esta división en tres niveles nace de la Constitución de 1978.","why_wrong":{"estatal.":"es otro nombre del nivel central, el primero de los tres, de modo que se repetiría un nivel ya citado.","regional.":"no es la denominación oficial: la Constitución habla de comunidades autónomas, provincias y municipios."},"source_page":12},{"id":"eeadc6270b","num":1052,"tarea":1,"type":"mc","question":"El poder legislativo corresponde...","options":["al presidente y los ministros.","a los jueces y magistrados.","a los diputados y senadores."],"answer_index":2,"explanation":"Los diputados y senadores integran las Cortes Generales, formadas por el Congreso (350 diputados elegidos por provincias) y el Senado (265 senadores en la actualidad); elaboran, debaten y aprueban las leyes y los Presupuestos y controlan la acción del Gobierno.","why_wrong":{"al presidente y los ministros.":"forman el Gobierno, órgano superior del poder ejecutivo, que dirige la Administración civil y militar.","a los jueces y magistrados.":"componen el poder judicial, cuya función es administrar justicia bajo el principio de unidad jurisdiccional."},"source_page":9},{"id":"aa4182225d","num":1053,"tarea":1,"type":"mc","question":"¿Dónde vive el rey?","options":["En el Palacio de la Moneda.","En el Palacio de la Zarzuela.","En el Palacio de la Moncloa."],"answer_index":1,"explanation":"El rey tiene su residencia oficial en el Palacio Real, pero vive en el Palacio de la Zarzuela; como jefe del Estado ejerce la máxima representación y actúa como mediador entre las instituciones.","why_wrong":{"En el Palacio de la Moneda.":"es la sede presidencial de Chile, no una residencia de la Corona española.","En el Palacio de la Moncloa.":"es la residencia oficial del presidente del Gobierno, no la del jefe del Estado."},"source_page":8},{"id":"54fc06df1b","num":1054,"tarea":1,"type":"mc","question":"El nombre oficial del parlamento español es...","options":["Cortes Generales.","Congreso de los Diputados.","Senado."],"answer_index":0,"explanation":"Las Cortes Generales representan al pueblo español y son bicamerales; entre sus funciones están elaborar y aprobar las leyes y los Presupuestos generales del Estado y controlar la acción del Gobierno.","why_wrong":{"Congreso de los Diputados.":"es solo una de las dos cámaras, con 350 diputados elegidos por provincias, y en ella se celebra la investidura del presidente del Gobierno.","Senado.":"es la otra cámara, la de representación territorial, con 265 senadores: la mayoría los eligen los ciudadanos y el resto, las comunidades autónomas."},"source_page":9},{"id":"1a28ca08d4","num":1055,"tarea":1,"type":"mc","question":"El Instituto de Comercio Exterior de España, el Instituto de las Mujeres y la Dirección General de Tráfico...","options":["son organismos autónomos.","dependen de ministerios.","son organismos internacionales."],"answer_index":1,"explanation":"Son organismos públicos que dependen de ministerios, como la Agencia Estatal de Meteorología (AEMET), la Agencia Tributaria, el Banco de España, el Instituto Cervantes, el Instituto Nacional de Estadística (INE), Patrimonio Nacional o Turespaña.","why_wrong":{"son organismos autónomos.":"la condición de órgano autónomo corresponde a instituciones como el Consejo General del Poder Judicial (CGPJ), creado para garantizar la independencia de los jueces.","son organismos internacionales.":"su ámbito de actuación es español y su superior es un ministerio; los organismos internacionales a los que pertenece España son la Organización de las Naciones Unidas (ONU), la Organización del Tratado del Atlántico Norte (OTAN), el Fondo Monetario Internacional (FMI) o el Banco Mundial."},"source_page":11},{"id":"c9e06321fb","num":1056,"tarea":1,"type":"mc","question":"¿Quién puede reinar en España?","options":["Solo los hombres.","Solo las mujeres.","Tanto los hombres como las mujeres."],"answer_index":2,"explanation":"La Corona es hereditaria y en España pueden reinar tanto los hombres como las mujeres; quien va a heredarla recibe el título de Príncipe o Princesa de Asturias.","why_wrong":{"Solo los hombres.":"la palabra solo excluye a las mujeres, que sí pueden acceder al trono y ostentar el título de Princesa de Asturias.","Solo las mujeres.":"esa exclusión también es falsa, como demuestra que el actual jefe del Estado sea Felipe VI, proclamado rey el 19 de junio de 2014."},"source_page":8},{"id":"10d31cc170","num":1057,"tarea":1,"type":"mc","question":"El Tribunal de Cuentas depende de...","options":["la Presidencia del Gobierno.","las Cortes Generales.","el Ministerio de Hacienda."],"answer_index":1,"explanation":"El Tribunal de Cuentas controla las finanzas y el presupuesto de las administraciones y además la contabilidad de los partidos políticos; depende de las Cortes Generales, igual que el Defensor del Pueblo.","why_wrong":{"la Presidencia del Gobierno.":"encabeza el poder ejecutivo y tiene su residencia oficial en el Palacio de la Moncloa, de modo que es parte de lo fiscalizado, no del fiscalizador.","el Ministerio de Hacienda.":"de él depende la Agencia Tributaria, encargada de recaudar los impuestos y de aplicar el sistema tributario."},"source_page":12},{"id":"9b01840ad6","num":1058,"tarea":1,"type":"mc","question":"¿Quién es la tercera autoridad del Estado, después del rey y el presidente del Gobierno?","options":["El presidente del Senado.","El ministro de Economía.","El presidente del Congreso de los Diputados."],"answer_index":2,"explanation":"El presidente del Congreso de los Diputados es la tercera autoridad del Estado español; preside la cámara de 350 diputados en la que se celebran la investidura del presidente del Gobierno y los debates de cuestiones de confianza y mociones de censura.","why_wrong":{"El presidente del Senado.":"dirige la cámara de representación territorial, con 265 senadores, pero no ocupa el tercer lugar en el orden del Estado.","El ministro de Economía.":"es un miembro del Gobierno, nombrado por el rey a propuesta del presidente, sin rango de autoridad del Estado."},"source_page":9},{"id":"c94c8149af","num":1059,"tarea":1,"type":"mc","question":"¿Qué lengua cooficial se habla en las Islas Baleares?","options":["Gallego.","Catalán.","Euskera."],"answer_index":1,"explanation":"En las Islas Baleares la lengua cooficial es el catalán, oficial también en Cataluña (junto con el aranés) y en la Comunidad Valenciana, donde se denomina valenciano; en las islas su difusión corresponde al Institut d'Estudis Baleàrics.","why_wrong":{"Gallego.":"es la lengua cooficial de Galicia, normalizada por la Real Academia Galega.","Euskera.":"es cooficial en el País Vasco y en Navarra, y su academia es la Real Academia de la Lengua Vasca-Euskaltzaindia."},"source_page":7,"source_quote":"Galicia (gallego), Navarra y País Vasco (vasco o euskera), Cataluña (catalán y aranés), Islas Baleares (catalán), Comunidad Valenciana (catalán o valenciano)."},{"id":"a7913d51e1","num":1060,"tarea":1,"type":"mc","question":"La Constitución defiende valores tales como la libertad, la igualdad, el pluralismo político y...","options":["la justicia.","la solidaridad.","la fraternidad."],"answer_index":0,"explanation":"Los cuatro valores superiores que proclama la Constitución son la libertad, la justicia, la igualdad y el pluralismo político; junto a ellos, entre sus principios figuran el respeto a los derechos humanos y las leyes y la protección de las diferencias de los pueblos de España.","why_wrong":{"la solidaridad.":"la Constitución la menciona, pero como principio de relación entre las nacionalidades y regiones que componen España, no como valor superior.","la fraternidad.":"no es uno de los valores superiores que proclama la Constitución; entre sus principios figura la colaboración y cooperación entre todos los pueblos de la Tierra."},"source_page":6},{"id":"723dc7ec2c","num":1061,"tarea":1,"type":"mc","question":"Cuando una ley ya está aprobada, ¿qué necesita para poder aplicarse?","options":["Nada.","Normas que la desarrollen.","Ser revisada por el Parlamento."],"answer_index":1,"explanation":"Una ley aprobada necesita desarrollarse mediante reglamentos u órdenes ministeriales, es decir, normas del Gobierno o de los ministerios competentes.","why_wrong":{"Nada.":"sin un reglamento o una orden ministerial que la concrete, la ley no llega a aplicarse en la práctica.","Ser revisada por el Parlamento.":"las Cortes Generales intervienen antes, elaborando, debatiendo y aprobando la ley; no vuelven a revisarla una vez aprobada."},"source_page":10},{"id":"94d95859ca","num":1062,"tarea":1,"type":"mc","question":"¿Cuántos habitantes hay en España?","options":["95 millones.","49 millones.","67 millones."],"answer_index":1,"explanation":"España tenía en 2025 más de 49 millones de habitantes y es el cuarto país más poblado de la Unión Europea (UE), por detrás de Alemania, Francia e Italia, con una densidad de 96 habitantes por km2.","why_wrong":{"95 millones.":"casi duplica la cifra real y supondría superar a cualquier país de la Unión Europea, incluida Alemania.","67 millones.":"correspondería a un país más poblado que España, que ocupa el cuarto puesto de la UE y el segundo en extensión con 505 944 km2."},"source_page":15},{"id":"6b57524915","num":1063,"tarea":1,"type":"mc","question":"¿Cuál de estos es un órgano consultivo del Gobierno de España?","options":["El Parlamento Europeo.","El Consejo de Estado.","El Tribunal Constitucional."],"answer_index":1,"explanation":"Los órganos consultivos del Gobierno son el Consejo de Estado y el Consejo Económico y Social; en este último participan los sindicatos más representativos.","why_wrong":{"El Parlamento Europeo.":"es una institución de la Unión Europea cuyos eurodiputados se eligen cada cinco años en las elecciones europeas.","El Tribunal Constitucional.":"interpreta la Constitución española y es independiente de los poderes del Estado, no asesora al Gobierno."},"source_page":11},{"id":"463854c1a9","num":1064,"tarea":1,"type":"mc","question":"¿Quién dirige la política interior y exterior de España?","options":["El rey.","El Gobierno.","El Congreso de los Diputados."],"answer_index":1,"explanation":"El Gobierno es el órgano superior del poder ejecutivo y está formado por el presidente, uno o varios vicepresidentes y los ministros; tiene su sede en Madrid y el presidente reside en el Palacio de la Moncloa.","why_wrong":{"El rey.":"es el jefe del Estado y ejerce la máxima representación como mediador que garantiza el funcionamiento de las instituciones; además ordena la publicación de las leyes y tiene el mando supremo de las Fuerzas Armadas.","El Congreso de los Diputados.":"forma parte del poder legislativo: aprueba leyes y presupuestos y controla la acción del Gobierno, pero no la dirige."},"source_page":9},{"id":"99c8c6531f","num":1065,"tarea":1,"type":"mc","question":"El Defensor del Pueblo depende de...","options":["el Consejo de Ministros.","el Tribunal de Cuentas.","las Cortes Generales."],"answer_index":2,"explanation":"El Defensor del Pueblo es elegido por el Congreso de los Diputados y el Senado por un mandato de cinco años, y no recibe órdenes ni instrucciones de ninguna autoridad.","why_wrong":{"el Consejo de Ministros.":"integra el Gobierno, es decir, forma parte de la Administración cuya actuación presuntamente irregular investiga el propio Defensor del Pueblo.","el Tribunal de Cuentas.":"también depende de las Cortes Generales, pero su cometido es controlar las finanzas de las administraciones y la contabilidad de los partidos, no atender quejas ciudadanas."},"source_page":12},{"id":"6f54fdb25e","num":1066,"tarea":1,"type":"mc","question":"El Instituto Etxepare tiene como misión la difusión del...","options":["euskera y la cultura vasca.","bable y la cultura cántabra.","gallego y la cultura galaica."],"answer_index":0,"explanation":"El Instituto Vasco Etxepare es el organismo de difusión y promoción del euskera y la cultura vasca; la normalización de esa lengua corresponde a la Real Academia de la Lengua Vasca-Euskaltzaindia, y en Navarra actúa además el Instituto Navarro del Vascuence-Euskarabidea.","why_wrong":{"bable y la cultura cántabra.":"el bable no es una lengua oficial de España ni cuenta con un organismo oficial de normalización o difusión.","gallego y la cultura galaica.":"la difusión del gallego corre a cargo de la Secretaría Xeral de Política Lingüística y su normalización, de la Real Academia Galega."},"source_page":7},{"id":"296057b4a1","num":1067,"tarea":1,"type":"mc","question":"¿Cuál de estas ciudades se encuentra entre las 10 más pobladas de España?","options":["Cádiz.","Málaga.","Albacete."],"answer_index":1,"explanation":"Málaga ocupa el sexto lugar entre las ciudades más pobladas de España, detrás de Madrid, Barcelona, Valencia, Sevilla y Zaragoza, y por delante de Murcia, Palma de Mallorca, Las Palmas de Gran Canaria y Alicante.","why_wrong":{"Cádiz.":"las únicas ciudades andaluzas de esa lista son Sevilla, en cuarto lugar, y Málaga, en sexto.","Albacete.":"pertenece a Castilla-La Mancha, comunidad que no aporta ninguna ciudad a las diez más pobladas."},"source_page":15,"source_quote":"Madrid, Barcelona, Valencia, Sevilla, Zaragoza, Málaga, Murcia, Palma de Mallorca, Las Palmas de Gran Canaria y Alicante."},{"id":"c11ad32889","num":1068,"tarea":1,"type":"mc","question":"¿Quién puede realizar trámites en línea ante la Administración Pública?","options":["Jueces y magistrados.","Cualquier ciudadano.","Abogados colegiados."],"answer_index":1,"explanation":"Los trámites en línea están abiertos a cualquier ciudadano que disponga de una identidad digital como el Documento Nacional de Identidad (DNI) electrónico, el certificado digital o Cl@ve, con el mismo valor que una firma en papel, y se pueden hacer a cualquier hora, no solo en horario de oficina.","why_wrong":{"Jueces y magistrados.":"integran el poder judicial y su función es administrar justicia, no un acceso reservado a la sede electrónica.","Abogados colegiados.":"gestiones como pedir un certificado, pagar tasas, inscribirse en el padrón o solicitar ayudas no exigen representación profesional."},"source_page":15},{"id":"8e92134d14","num":1069,"tarea":1,"type":"mc","question":"¿Cómo se llama el rey de España?","options":["Juan Carlos I.","Felipe VI.","Alfonso XIII."],"answer_index":1,"explanation":"Felipe VI fue proclamado rey el 19 de junio de 2014; es el jefe del Estado, tiene el mando supremo de las Fuerzas Armadas y nombra a los miembros del Gobierno a propuesta de su presidente.","why_wrong":{"Juan Carlos I.":"fue rey entre el 22 de noviembre de 1975 y el 18 de junio de 2014, y es el padre del monarca actual.","Alfonso XIII.":"reinó en el primer tercio del siglo XX, antes de la Segunda República, y no pertenece al periodo democrático iniciado en 1978."},"source_page":8},{"id":"c12179854d","num":1070,"tarea":1,"type":"mc","question":"¿Cómo se llama el órgano de gobierno de los jueces y magistrados?","options":["Tribunal Supremo.","Consejo General del Poder Judicial.","Consejo de Estado."],"answer_index":1,"explanation":"El Consejo General del Poder Judicial (CGPJ) es un órgano autónomo cuya finalidad es garantizar la independencia de los jueces y tribunales.","why_wrong":{"Tribunal Supremo.":"es un tribunal que administra justicia dentro del principio de unidad jurisdiccional, no el que gobierna la carrera judicial.","Consejo de Estado.":"es un órgano consultivo del Gobierno, como el Consejo Económico y Social."},"source_page":10},{"id":"896fe33d94","num":1071,"tarea":1,"type":"mc","question":"¿Quién aprueba los presupuestos generales del Estado?","options":["Las Cortes Generales.","El Tribunal de Cuentas.","El Gobierno de España."],"answer_index":0,"explanation":"Aprobar los Presupuestos generales del Estado es una de las funciones principales de las Cortes Generales, junto con elaborar y debatir las leyes y controlar la acción del Gobierno; la decisión pasa por sus dos cámaras, Congreso y Senado.","why_wrong":{"El Tribunal de Cuentas.":"controla después las finanzas y el presupuesto de las administraciones y la contabilidad de los partidos políticos, pero no aprueba las cuentas.","El Gobierno de España.":"elabora y presenta el proyecto de presupuestos, igual que ocurre con los proyectos de ley que propone, pero la aprobación corresponde al Parlamento."},"source_page":9},{"id":"3d18e7c896","num":1072,"tarea":1,"type":"mc","question":"La Constitución española es...","options":["la ley fundamental.","parte de otra ley.","una ley secundaria."],"answer_index":0,"explanation":"La Constitución es la ley de leyes: a partir de ella se establece el ordenamiento de todo el sistema jurídico español, y en ella se reconoce el derecho a la autonomía de las nacionalidades y regiones que componen España.","why_wrong":{"parte de otra ley.":"es al contrario: las leyes orgánicas, las ordinarias y los decretos leyes derivan de ella y no pueden contradecirla.","una ley secundaria.":"es la propia Constitución la que exige regular por ley orgánica materias como los derechos fundamentales o los estatutos de autonomía, así que está por encima de las demás normas."},"source_page":6},{"id":"40ea604d14","num":1073,"tarea":1,"type":"mc","question":"Las Cortes Generales están compuestas por el Senado y...","options":["el Congreso de los Diputados.","el Tribunal Supremo.","el Consejo de Estado."],"answer_index":0,"explanation":"El Congreso de los Diputados cuenta con 350 diputados elegidos por provincias, mientras que el Senado, cámara de representación territorial, tiene actualmente 265 senadores; juntos representan al pueblo español.","why_wrong":{"el Tribunal Supremo.":"pertenece al poder judicial, encargado de administrar justicia, no al legislativo.","el Consejo de Estado.":"es un órgano consultivo del Gobierno y no forma parte del Parlamento."},"source_page":9},{"id":"72b83e6ad0","num":1074,"tarea":1,"type":"mc","question":"¿Quién elabora las leyes?","options":["El poder ejecutivo.","El poder legislativo.","El poder judicial."],"answer_index":1,"explanation":"El poder legislativo lo ejercen las Cortes Generales, que elaboran, debaten y aprueban las leyes; según quién las proponga se habla de proyecto de ley (Gobierno) o de proposición de ley (Congreso, Senado, una comunidad autónoma o 500 000 ciudadanos).","why_wrong":{"El poder ejecutivo.":"el Gobierno desarrolla las leyes ya aprobadas con reglamentos u órdenes ministeriales y solo dicta decretos leyes en casos de especial urgencia.","El poder judicial.":"lo forman jueces y magistrados y su función es administrar justicia aplicando las leyes."},"source_page":9},{"id":"88ca6b0f4f","num":1075,"tarea":1,"type":"mc","question":"La defensa de la integridad territorial de España corresponde a...","options":["la Policía Nacional y la Guardia Civil.","las Fuerzas Armadas.","la Policía Nacional y las policías autonómicas."],"answer_index":1,"explanation":"Las Fuerzas Armadas garantizan la autoridad y la independencia de España y el orden constitucional; las componen el Ejército de Tierra, el Ejército del Aire y la Armada, su máxima autoridad es el rey y su dirección corresponde al Ministerio de Defensa.","why_wrong":{"la Policía Nacional y la Guardia Civil.":"son Fuerzas y Cuerpos de Seguridad del Estado, con el ministro del Interior como mando superior, y protegen los derechos y libertades y la seguridad ciudadana.","la Policía Nacional y las policías autonómicas.":"las policías autonómicas, como la Ertzaintza, los Mossos d'Esquadra, la Policía Foral de Navarra o el Cuerpo General de la Policía de Canarias, actúan solo dentro de su comunidad."},"source_page":10},{"id":"1f01b42a12","num":1076,"tarea":1,"type":"mc","question":"El Ejército español participa desde 1989 en misiones de paz de la...","options":["Organización de Estados Iberoamericanos (OEI).","Unión Europea Occidental (UEO).","Organización de las Naciones Unidas (ONU)."],"answer_index":2,"explanation":"Las Fuerzas Armadas españolas participan en misiones de paz de la ONU desde 1989; España pertenece además al Consejo de Europa, a la Organización del Tratado del Atlántico Norte (OTAN), al Fondo Monetario Internacional (FMI) y al Banco Mundial.","why_wrong":{"Organización de Estados Iberoamericanos (OEI).":"la relación de España con Iberoamérica se articula en la Comunidad Iberoamericana de Naciones, 22 países apoyados por la Secretaría General Iberoamericana, sin misiones militares.","Unión Europea Occidental (UEO).":"España no pertenece a esa organización; la alianza militar de la que forma parte es la OTAN."},"source_page":10},{"id":"00b02c3fec","num":1077,"tarea":1,"type":"mc","question":"¿Quién vigila puertos y aeropuertos, fronteras y costas?","options":["La Guardia Civil.","La Policía local.","La Policía Nacional."],"answer_index":0,"explanation":"La Guardia Civil vigila puertos, aeropuertos, fronteras y costas, y también el tráfico en las vías públicas interurbanas; su mando superior, como el de la Policía Nacional, es el ministro del Interior.","why_wrong":{"La Policía local.":"se ocupa del tráfico en pueblos y ciudades, de proteger las instituciones y autoridades locales y de prestar auxilio en caso de accidente.","La Policía Nacional.":"expide el Documento Nacional de Identidad (DNI) y el pasaporte y gestiona la extranjería, incluidos los permisos de residencia y trabajo."},"source_page":11},{"id":"cf0cd22254","num":1078,"tarea":1,"type":"mc","question":"¿Quién hace el control de pasaportes en las fronteras de España?","options":["La Guardia Civil.","La Policía local.","La Policía Nacional."],"answer_index":2,"explanation":"La Policía Nacional controla la entrada y la salida del territorio nacional de españoles y extranjeros, y es también la encargada de expedir el Documento Nacional de Identidad (DNI) y el pasaporte y de los trámites de extranjería.","why_wrong":{"La Guardia Civil.":"vigila puertos, aeropuertos, fronteras y costas y el tráfico interurbano, pero no realiza el control documental de las personas.","La Policía local.":"su ámbito es municipal: tráfico urbano, protección de las autoridades locales y auxilio en accidentes."},"source_page":11},{"id":"4c90698eda","num":1079,"tarea":1,"type":"mc","question":"¿Cuál de los siguientes políticos ha sido presidente del Gobierno en España?","options":["Manuel Fraga.","José María Aznar.","Yolanda Díaz."],"answer_index":1,"explanation":"José María Aznar fue presidente del Gobierno entre 1996 y 2004 por el Partido Popular (PP), entre los mandatos de Felipe González y de José Luis Rodríguez Zapatero, ambos del Partido Socialista Obrero Español (PSOE).","why_wrong":{"Manuel Fraga.":"Manuel Fraga no ha presidido el Gobierno: desde 1979 lo han hecho Adolfo Suárez, Leopoldo Calvo-Sotelo, Felipe González, José María Aznar, José Luis Rodríguez Zapatero, Mariano Rajoy y Pedro Sánchez.","Yolanda Díaz.":"ninguna mujer ha presidido el Gobierno de España, y desde 2018 el cargo lo ocupa Pedro Sánchez."},"source_page":17},{"id":"ab3478db6c","num":1080,"tarea":1,"type":"mc","question":"¿Cómo se llama la policía autonómica de Cataluña?","options":["Guardia Civil.","Ertzaintza.","Mossos d'Esquadra."],"answer_index":2,"explanation":"Los Mossos d'Esquadra son la policía autonómica de Cataluña; en el mismo nivel autonómico existen la Policía Foral de Navarra y el Cuerpo General de la Policía de Canarias.","why_wrong":{"Guardia Civil.":"es un cuerpo de seguridad de ámbito nacional, bajo el ministro del Interior, que vigila el tráfico interurbano, los puertos, los aeropuertos, las fronteras y las costas.","Ertzaintza.":"es la policía autonómica del País Vasco, no la de Cataluña."},"source_page":11},{"id":"a5880b33de","num":1081,"tarea":1,"type":"mc","question":"¿Cómo se llama la policía autonómica del País Vasco?","options":["Ertzaintza.","Guardia Civil.","Mossos d'Esquadra."],"answer_index":0,"explanation":"La Ertzaintza es uno de los cuatro cuerpos de policía de ámbito autonómico, junto con los Mossos d'Esquadra, la Policía Foral de Navarra y el Cuerpo General de la Policía de Canarias. Solo algunas comunidades tienen policía propia; las demás dependen de los cuerpos estatales.","why_wrong":{"Guardia Civil.":"es un cuerpo de seguridad de ámbito nacional, bajo el mando del ministro del Interior, que vigila el tráfico interurbano, puertos, aeropuertos, fronteras y costas.","Mossos d'Esquadra.":"también es policía autonómica, pero de Cataluña, no del País Vasco."},"source_page":11},{"id":"4dc88c3a2d","num":1082,"tarea":1,"type":"mc","question":"¿Desde qué año es rey Felipe VI?","options":["Desde 1975.","Desde 2014.","Desde 2020."],"answer_index":1,"explanation":"Felipe VI fue proclamado rey el 19 de junio de 2014, un día después de que su padre dejara el trono. Antes de reinar tenía el título de Príncipe de Asturias, que corresponde siempre al heredero o heredera de la Corona.","why_wrong":{"Desde 1975.":"es el año en que empezó a reinar Juan Carlos I, el 22 de noviembre de 1975; durante su reinado España avanzó hacia la democracia y entró en la Unión Europea.","Desde 2020.":"en 2020 no hubo ningún cambio en la Corona: Felipe VI llevaba ya seis años como jefe del Estado."},"source_page":8},{"id":"6c83e8e08a","num":1083,"tarea":1,"type":"mc","question":"¿Quién regula el tráfico en los pueblos y ciudades?","options":["La Guardia Civil.","Protección Civil.","La Policía Local."],"answer_index":2,"explanation":"La Policía local es el cuerpo de seguridad de ámbito local y, además del tráfico urbano, protege las instituciones y autoridades locales y presta auxilio en caso de accidente. Depende del ayuntamiento, no del Ministerio del Interior.","why_wrong":{"La Guardia Civil.":"se ocupa del tráfico en las vías públicas interurbanas, es decir, en las carreteras, y también de puertos, aeropuertos, fronteras y costas.","Protección Civil.":"se dedica a la actuación ante emergencias y catástrofes; no es una de las Fuerzas y Cuerpos de Seguridad, que son nacionales, autonómicas y locales."},"source_page":11},{"id":"f64a111689","num":1084,"tarea":1,"type":"mc","question":"¿Quién puede presentar una queja al Defensor del Pueblo?","options":["Solo los ciudadanos legalmente residentes.","Solo los españoles mayores de 18 años.","Todos los ciudadanos, españoles o extranjeros."],"answer_index":2,"explanation":"Cualquier ciudadano puede pedir su intervención y el trámite es gratuito. El Defensor del Pueblo es elegido por el Congreso y el Senado para un mandato de cinco años y no recibe órdenes de ninguna autoridad.","why_wrong":{"Solo los ciudadanos legalmente residentes.":"la situación administrativa no limita el acceso: el Defensor investiga cualquier actuación presuntamente irregular de la Administración, sea quien sea el que se queja.","Solo los españoles mayores de 18 años.":"los 18 años son el requisito para votar y ser elegible en las elecciones, no para presentar una queja."},"source_page":11},{"id":"2ea708f164","num":1085,"tarea":1,"type":"mc","question":"En España el voto en las elecciones es...","options":["un derecho.","un deber.","una obligación."],"answer_index":0,"explanation":"La Constitución convierte el derecho al voto de todos los españoles en la base del sistema político, mediante sufragio universal, libre, igual, directo y secreto. Todos los españoles mayores de edad pueden ejercerlo, pero nadie está obligado a hacerlo.","why_wrong":{"un deber.":"la Constitución configura el voto como un derecho de los españoles mayores de edad, no como un deber exigible.","una obligación.":"no existe sanción por no votar; el voto es libre, y esa libertad es precisamente uno de los rasgos del sufragio que fija la Constitución."},"source_page":16},{"id":"d34804ea22","num":1086,"tarea":1,"type":"mc","question":"¿Quién vigila el tráfico en las carreteras?","options":["La Guardia Civil.","La Policía Nacional.","El Ejército de Tierra."],"answer_index":0,"explanation":"Su competencia son las vías públicas interurbanas, y además vigila puertos, aeropuertos, fronteras y costas. Junto con el Cuerpo Nacional de Policía forma las Fuerzas y Cuerpos de Seguridad del Estado, cuyo mando superior es el ministro del Interior.","why_wrong":{"La Policía Nacional.":"se encarga de expedir el Documento Nacional de Identidad (DNI) y el pasaporte, de la extranjería (permisos de residencia y trabajo) y del control de entrada y salida del territorio nacional.","El Ejército de Tierra.":"forma parte de las Fuerzas Armadas, junto con el Ejército del Aire y la Armada, cuya misión es la defensa de la integridad territorial y del orden constitucional, no la seguridad vial."},"source_page":11},{"id":"b2423e3d1b","num":1087,"tarea":1,"type":"mc","question":"¿Qué organismo se encarga de recaudar los impuestos?","options":["El Tribunal de Cuentas.","La Agencia Tributaria.","El Consejo Económico y Social."],"answer_index":1,"explanation":"La Agencia Tributaria (AEAT) depende del Ministerio de Hacienda y Función Pública y, además de recaudar, aplica el sistema tributario en general. Lo recaudado sirve para sostener los gastos públicos.","why_wrong":{"El Tribunal de Cuentas.":"no recauda: controla las finanzas y el presupuesto de las administraciones y la contabilidad de los partidos políticos, y depende de las Cortes Generales.","El Consejo Económico y Social.":"es un órgano consultivo del Gobierno en materia económica, en el que participan los sindicatos más representativos."},"source_page":12},{"id":"ee9f8275e6","num":1088,"tarea":1,"type":"mc","question":"¿Dónde se publican las leyes nacionales?","options":["En el boletín del Instituto Nacional de Estadística (INE).","En el Portal de la Administración Electrónica (PAe).","En el Boletín Oficial del Estado (BOE)."],"answer_index":2,"explanation":"El BOE es el medio con el que el Gobierno comunica a los ciudadanos leyes, decretos y nombramientos; cada comunidad autónoma tiene además su propio boletín. Es el rey quien aprueba y ordena la publicación oficial de las leyes.","why_wrong":{"En el boletín del Instituto Nacional de Estadística (INE).":"el INE es el organismo dependiente de un ministerio que se encarga de la estadística oficial, no de publicar normas."
