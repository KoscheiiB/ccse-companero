const SVG = {
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 16.5v-5"/><circle cx="12" cy="8" r=".8" fill="currentColor" stroke="none"/>',
  auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/>',
  light:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>',
  dark:'<path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/>'
};
const THEMES = ["auto","light","dark"];
const TLABEL = {auto:"Tema: automático", light:"Tema: claro", dark:"Tema: oscuro"};
const mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;

function themePref(){ const p = ls(TK); return THEMES.indexOf(p) >= 0 ? p : "auto" }
function applyTheme(){
  const p = themePref();
  const dark = p === "dark" || (p === "auto" && mq && mq.matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  return p;
}
function themeBtn(){
  const p = themePref();
  return `<button class="icon" onclick="cycleTheme()" aria-label="${TLABEL[p]}" title="${TLABEL[p]}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">${SVG[p]}</svg></button>`;
}
let INFO = false;
function toggleInfo(){ INFO = !INFO; home() }
function infoBtn(){
  return `<button class="icon" onclick="toggleInfo()" aria-label="Cómo funciona"
    aria-expanded="${INFO}" title="Cómo funciona">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">${SVG.info}</svg></button>`;
}

function cycleTheme(){
  lset(TK, THEMES[(THEMES.indexOf(themePref()) + 1) % THEMES.length]);
  applyTheme();
  render();   // repaint whatever view is open, so the icon updates in place
}
if(mq && mq.addEventListener) mq.addEventListener("change", applyTheme);
applyTheme();

// Shuffle, then interleave by tarea so no two consecutive questions share one,
// without falling into a predictable cycle. Each step picks a tarea at random,
// weighted by how many it has left, never repeating the previous one. A tarea
// holding more than half the remainder is forced out now -- otherwise it has to
function spread(qs){
  const b = {};
  for(const q of qs) (b[q.tarea] = b[q.tarea] || []).push(q);
  for(const t in b) b[t] = shuf(b[t]);
  const out = []; let prev = null, total = qs.length;
  while(total){
    const left = Object.keys(b).filter(t => b[t].length);
    let t = left.find(x => b[x].length * 2 > total && x !== prev);
    if(!t){
      let cand = left.filter(x => x !== prev);
      if(!cand.length) cand = left;
      let r = Math.random() * cand.reduce((s,x) => s + b[x].length, 0);
      t = cand[cand.length-1];
      for(const x of cand){ r -= b[x].length; if(r <= 0){ t = x; break } }
    }
    out.push(b[t].pop()); prev = t; total--;
  }
  return out;
}

// S = question on screen. RUN = accumulating session (survives returning to the
// search list, so 25 looked-up questions form ONE run). VIEW = last rendered
// screen, so the theme toggle can repaint without losing place.
let S = null, RUN = null, VIEW = home;
function render(){ VIEW() }

function agg(runs){
  const t = {tot:0, ok:0, byT:{}};
  for(const r of runs) for(const it of r.items){
    t.tot++; t.ok += it.ok?1:0;
    const b = t.byT[it.tarea] = t.byT[it.tarea] || {tot:0,ok:0};
    b.tot++; b.ok += it.ok?1:0;
  }
  return t;
}

function statTable(a, bars){
  let h = "";
  for(const t of [1,2,3,4,5]){
    const b = a.byT[t] || {tot:0,ok:0}, p = pct(b.ok,b.tot);
    h += `<div class="stat">
      <div class="hd2"><span>T${t} <span class="mut">${TN[t]}</span></span>
        <span class="num">${b.ok}/${b.tot} · <b>${p}%</b></span></div>
      ${bars?`<div class="bar"><i style="width:${p}%;background:${barColor(p)}"></i>
        <u style="left:${PASS_PCT}%"></u></div>`:``}</div>`;
  }
  return h;
}

/* ---------- home ---------- */
function home(){
  stopClock();
  S = RUN = null; foot.hidden = true; VIEW = home;
  const runs = hist(), a = agg(runs), pend = Q.filter(q=>!q.explanation).length;
  const nf = failList().length;
  app.innerHTML = `
    <div class="top">${infoBtn()}<h1>CCSE · Compañero</h1>${themeBtn()}</div>
    ${INFO?`<div class="card tight mut" style="font-size:13px;line-height:1.5">
      <b style="color:var(--fg)">Examen</b> · ${NQ} preguntas en 45 min ·
        ${Object.entries(MIX).map(([t,n])=>`T${t}×${n}`).join(" · ")}<br>
      <b style="color:var(--fg)">Apto</b> · ${PASS}/${NQ} (${PASS_PCT}%) · los fallos no penalizan<br>
      <b style="color:var(--fg)">Sin fin</b> · las ${Q.length} oficiales, sin dos tareas seguidas<br>
      <b style="color:var(--fg)">Repasar fallos</b> · solo las que fallaste la última vez<br>
      <b style="color:var(--fg)">Buscar</b> · para responder en paralelo al examen oficial<br>
      <b style="color:var(--fg)">Fuente</b> · Manual CCSE 2026, Instituto Cervantes
    </div>`:``}
    <div class="card stack">
      <button class="btn out" onclick="begin('buscar')">Buscar preguntas</button>
      <div class="row"><button class="btn pri" onclick="begin('examen')">Examen · ${NQ}</button>
      <button class="btn pri" onclick="begin('sinfin')">Sin fin</button></div>
    </div>
    <div class="card">
      <div class="ttl">Histórico</div>
      ${a.tot ? `<div class="score">${pct(a.ok,a.tot)}%</div>
      <div class="mut ctr" style="margin-bottom:var(--s3)">${a.ok}/${a.tot} · ${runs.length} ${runs.length===1?"sesión":"sesiones"}${paceLine(runs)}</div>
      ${statTable(a,true)}`
      : `<div class="mut ctr">Sin sesiones todavía. Haz un examen para ver tus estadísticas por tarea.</div>`}
      ${nf?`<button class="btn out" style="margin-top:var(--s3)" onclick="begin('fallos')">Repasar fallos · ${nf}</button>`:``}
    </div>
    <div class="card">
      <div class="ttl">Banco · ${Q.length} oficiales · ${pct(Q.length-pend,Q.length)}% explicadas</div>
      <div class="chips">${BANK.map(b=>`<div class="chip"><b>${b.n}</b><span>T${b.t}</span></div>`).join("")}</div>
      ${pend?`<div class="mut ctr" style="margin-top:var(--s2)">${pend} sin explicación</div>`:``}
    </div>
    <div class="card tight stack">
      <div class="row">
        <button class="btn neu sm" onclick="expo()" ${runs.length?"":"disabled"}>Exportar</button>
        <button class="btn neu sm" onclick="imp()">Importar</button>
      </div>
      <button class="btn dng sm" onclick="wipe()" ${runs.length?"":"disabled"}>Borrar</button>
    </div>`;
}

function paceLine(runs){
  const t = [];
  for(const r of runs) for(const it of r.items) if(it.ms) t.push(it.ms);
  return t.length ? ` · ${Math.round(median(t)/1000)} s/pregunta` : "";
}

// Added to the home screen, iOS gives the app its own storage container, separate
// from Safari's. Import exists so a history started in the browser can move across.
function imp(){
  const picker = Object.assign(document.createElement("input"),
    {type:"file", accept:"application/json,.json"});
  picker.onchange = () => {
    const file = picker.files && picker.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let incoming;
      try { incoming = JSON.parse(reader.result) } catch { incoming = null }
      if(!Array.isArray(incoming)) return alert("Ese archivo no es un histórico válido.");
      const runs = hist(), seen = new Set(runs.map(r => r.ts));
      let added = 0;
      for(const run of incoming){
        if(!run || !Array.isArray(run.items) || seen.has(run.ts)) continue;
        runs.push(run); seen.add(run.ts); added++;
      }
      runs.sort((a,b) => (a.ts||0) - (b.ts||0));
      save(runs); home();
      alert(added ? `${added} sesión(es) importada(s).` : "Nada nuevo que importar.");
    };
    reader.readAsText(file);
  };
  picker.click();
}

function expo(){
  if(!hist().length) return;
  const b = new Blob([JSON.stringify(hist(),null,1)],{type:"application/json"});
  const a = Object.assign(document.createElement("a"),
    {href:URL.createObjectURL(b), download:"ccse_historico.json"});
  a.click();
}
function wipe(){
  if(!hist().length) return;
  if(confirm("¿Borrar todo el histórico? No se puede deshacer.")){ save([]); home() }
}

/* ---------- session ---------- */
function begin(mode){
  RUN = {mode, items:[], done:new Set(), marks:[], t0:Date.now()};
  RUN.last = RUN.t0;
  if(mode === "buscar"){ startClock(); return search() }
  if(mode === "examen"){
    // stratified: draw MIX[t] from each tarea, keep real exam ordering (T1..T5)
    RUN.list = [];
    for(const t of [1,2,3,4,5])
      RUN.list.push(...shuf(Q.filter(q=>q.tarea===t)).slice(0, MIX[t]));
  } else if(mode === "fallos"){
    RUN.list = failList();
    if(!RUN.list.length) return home();
  } else {
    RUN.list = spread(Q);
  }
  RUN.i = 0;
  startClock();
  step();
}

function step(){
  if(RUN.i >= RUN.list.length) return finish();
  const n = RUN.list.length;
  ask(RUN.list[RUN.i], RUN.mode==="sinfin" ? `${RUN.i+1}` : `${RUN.i+1}/${n}`);
}

function ask(q, label){
  const fresh = !S || S.q !== q;
  // mc options are shuffled each time so the correct answer's POSITION cannot be
  // memorised instead of the fact. tf keeps Verdadero/Falso, as the real exam prints it.
  if(fresh) S = {q, picked:null, label,
    order: q.type === "tf" ? q.options.map((_, i) => i) : shuf(q.options.map((_, i) => i))};
  VIEW = () => ask(S.q, S.label);
  const timed = RUN.mode !== "buscar";
  const trail = RUN.mode === "examen"
    ? `<div class="dots">${RUN.list.map((_,i)=>
        `<i class="${RUN.marks[i]===true?"ok":RUN.marks[i]===false?"no":""}"></i>`).join("")}</div>`
    : `<span>${q.type==="tf"?"Verdadero o falso":"Elige una"}</span>`;
  app.innerHTML = `
    <div class="top">${timed?`<span class="clock" id="clock">0:00</span>`:`<span class="spacer"></span>`}
      <h1>T${q.tarea} · ${TN[q.tarea]}</h1>${themeBtn()}</div>
    <div class="card">
      <div class="qhead"><span class="badge">${S.label}</span>${trail}</div>
      <div class="q">${marked(q.question, q.titles)}</div>
      <div id="opts">${S.order.map((real,disp)=>
        `<button class="opt" onclick="pick(${disp})"><span class="dot"></span><span>${marked(q.options[real], q.titles)}</span></button>`
      ).join("")}</div>
      <div id="rev"></div>
    </div>`;
  if(S.picked !== null) paint(S.picked);   // survive a theme repaint mid-question
  navbar();
  tickClock();
}

function navbar(){
  const n = RUN.items.length;
  const fin = `<button class="btn neu" onclick="finish()">Finalizar${n?` · ${n}`:""}</button>`;
  if(S && S.picked === null){ footin.innerHTML = fin; foot.hidden = false; return }
  footin.innerHTML = RUN.mode === "buscar"
    ? fin + `<button class="btn pri" onclick="search()">Buscar otra</button>`
    : fin + `<button class="btn pri" onclick="next()">${RUN.i+1 >= RUN.list.length ? "Resultado" : "Siguiente"}</button>`;
  foot.hidden = false;
}

function paint(disp){
  const q = S.q, box = document.getElementById("opts");
  const right = S.order.indexOf(q.answer_index), ok = disp === right;
  [...box.children].forEach((el,j)=>{
    el.onclick = null;
    if(j === right){ el.classList.add("good"); el.querySelector(".dot").textContent="✓" }
    else if(j === disp){ el.classList.add("bad"); el.querySelector(".dot").textContent="✕" }
    else el.classList.add("dim");
  });
  document.getElementById("rev").innerHTML = expl(q, ok);
  return ok;
}

function pick(i){
  if(!S || S.picked !== null) return;
  S.picked = i;
  const q = S.q, ok = paint(i);
  if(!RUN.done.has(q.id)){
    const now = Date.now();
    RUN.done.add(q.id);
    RUN.items.push({id:q.id, tarea:q.tarea, ok, ms: now - (RUN.last || now)});
    RUN.last = now;
  }
  if(RUN.mode !== "buscar") RUN.marks[RUN.i] = ok;
  navbar();
  // keep the verdict + explanation on screen without hunting for it
  const rev = document.getElementById("rev");
  if(rev.scrollIntoView) rev.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function expl(q, ok){
  const head = `<div class="verdict" style="color:${ok?"var(--good)":"var(--danger)"}">
    ${ok?"✓ Correcta":"✕ Incorrecta"}</div>`;
  if(!q.explanation) return head + `<div class="exp todo"><span class="lbl">Explicación pendiente</span>
    La respuesta correcta es «${esc(q.options[q.answer_index])}».</div>`;
  // rows follow the on-screen option order, so the block maps 1:1 to the list above
  const order = (S && S.order) || q.options.map((_, i) => i);
  let rows = "";
  for(const real of order){
    const opt = q.options[real], key = real === q.answer_index;
    const txt = key ? q.explanation : (q.why_wrong || {})[opt];
    if(!txt) continue;
    rows += `<div class="w${key?" key":""}">
      <span class="lbl">${key?"✓ ":""}${esc(opt)}</span>${esc(txt)}</div>`;
  }
  // Source is a locatable PAGE in the official 102-page manual, not a restatement.
  // A verbatim quote rides along only when it teaches something extra (a list, figures).
  let src = q.source_page ? `Manual CCSE 2026 · p. ${esc(String(q.source_page))}` : "";
  if(q.source_quote) src += (src ? " · " : "") + `«${esc(q.source_quote)}»`;
  return head + `<div class="exp">${rows}</div>`
    + (src ? `<div class="src">${src}</div>` : "");
}

function next(){ RUN.i++; S = null; step() }

function finish(){
  if(!RUN) return home();
  stopClock();
  const items = RUN.items;
  if(!items.length) return home();
  const meta = {ts:Date.now(), mode:RUN.mode, items,
                ms: Date.now() - RUN.t0, timeUp: !!RUN.timeUp};
  const h = hist(); h.push(meta); save(h);
  const a = agg([{items}]), all = agg(h);
  S = RUN = null;
  VIEW = () => showResult(a, all, meta);
  showResult(a, all, meta);
}

function showResult(a, all, meta){
  // the official verdict only means anything over a full 25-question exam
  const exam = meta && meta.mode === "examen" && a.tot === NQ;
  const apto = a.ok >= PASS;
  const verdict = exam
    ? `<div class="score" style="color:${apto?"var(--good)":"var(--danger)"};font-size:22px">
         ${apto?"APTO":"NO APTO"}</div>
       <div class="mut ctr">necesitas ${PASS} de ${NQ}</div>`
    : ``;
  const time = meta && meta.ms ? (meta.mode === "examen"
      ? `${meta.timeUp?"tiempo agotado · ":""}${fmt(meta.ms)} de ${fmt(LIMIT)}`
      : `${fmt(meta.ms)} · ${Math.round(median(meta.items.map(i=>i.ms||0))/1000)} s/pregunta`)
    : "";
  app.innerHTML = `
    <div class="top"><span class="spacer"></span><h1>Resultado</h1>${themeBtn()}</div>
    <div class="card">
      <div class="score">${a.ok}/${a.tot} · ${pct(a.ok,a.tot)}%</div>
      ${verdict}
      <div class="mut ctr" style="margin-bottom:var(--s3)">${time||"esta sesión"}</div>
      ${statTable(a,true)}
    </div>
    <div class="card tight">
      <div class="ttl" style="margin-bottom:var(--s2)">Acumulado · ${all.ok}/${all.tot} · ${pct(all.ok,all.tot)}%</div>
      ${statTable(all,false)}
    </div>`;
  // Inicio lives in the fixed bar so it never needs a scroll to reach
  footin.innerHTML = `<button class="btn neu" onclick="home()">Inicio</button>`;
  foot.hidden = false;
}

/* ---------- search ---------- */
function search(){
  if(!RUN) RUN = {mode:"buscar", items:[], done:new Set(), marks:[], t0:Date.now(), last:Date.now()};
  S = null; VIEW = search;
  app.innerHTML = `
    <div class="top"><span class="spacer"></span><h1>Buscar</h1>${themeBtn()}</div>
    <div class="card tight"><input id="s" placeholder="2-3 palabras de la pregunta"
      autocapitalize="off" autocorrect="off" spellcheck="false" oninput="hits(this.value)"></div>
    <div id="res"></div>`;
  hits("");
  navbar();
  document.getElementById("s").focus();
}

function hits(v){
  const n = nrm(v).trim(), res = document.getElementById("res");
  if(!n){ res.innerHTML = `<div class="card mut ctr">${Q.length} preguntas oficiales.</div>`; return }
  const ws = n.split(/\s+/);
  const m = Q.filter(q => { const h = nrm(q.question + " " + q.options.join(" "));
                            return ws.every(w => h.includes(w)) }).slice(0,25);
  res.innerHTML = m.length
    ? `<div class="card">${m.map(q=>`<div class="hit${RUN.done.has(q.id)?" done":""}" onclick="one('${esc(q.id)}')">
        <small>T${q.tarea}</small>${marked(q.question, q.titles)}</div>`).join("")}</div>`
    : `<div class="card mut ctr">Sin resultados. Prueba con menos palabras.</div>`;
}

function one(id){
  const q = Q.find(x=>x.id===id);
  S = null;
  ask(q, `${RUN.items.length+1}`);
}

home();

// Caches the app for offline use. Requires a secure origin, so this quietly does
// nothing when the page is opened over plain HTTP or straight off the filesystem.
if("serviceWorker" in navigator){
  addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
