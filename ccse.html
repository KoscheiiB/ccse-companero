ex":0,"titles":["La verbena"],"explanation":"Maruja Mallo (1902-1995) es la autora de La verbena, cuadro conservado en el Museo Reina Sofía de Madrid, el mismo museo que guarda el Guernica de Picasso.","why_wrong":{"Carmen Maura.":"Es actriz de fama internacional del cine español, como Maribel Verdú o Victoria Abril.","Clara Lago.":"también es actriz del cine español, no pintora."},"source_page":55,"source_quote":"La verbena / Maruja Mallo (1902-1995) / Museo Reina Sofía / Madrid"},{"id":"1ee9f30cb7","num":4026,"tarea":4,"type":"mc","question":"¿En qué museo español puedes ver el cuadro Guernica de Picasso?","options":["Museo del Prado.","Museo Reina Sofía.","Museo Thyssen-Bornemisza."],"answer_index":1,"titles":["Guernica"],"explanation":"El Guernica de Pablo Picasso (1881-1973) se expone en el Museo Reina Sofía de Madrid, que también alberga Figura en una ventana de Dalí y La verbena de Maruja Mallo.","why_wrong":{"Museo del Prado.":"Conserva Las meninas de Velázquez y los Goya, como Los fusilamientos del 3 de mayo y La maja desnuda.","Museo Thyssen-Bornemisza.":"Es otro museo madrileño de fama internacional, con sede en el Palacio de Villahermosa."},"source_page":54,"source_quote":"Guernica / Pablo Picasso (1881-1973) / Museo Reina Sofía / Madrid"},{"id":"a18ac6248d","num":4027,"tarea":4,"type":"mc","question":"¿Qué escritora española escribe en otra lengua oficial de España?","options":["Mercè Rodoreda.","Almudena Grandes.","Ana María Matute."],"answer_index":0,"explanation":"Mercè Rodoreda escribió en catalán, otra de las lenguas oficiales de España, su novela La plaça del Diamant.","why_wrong":{"Almudena Grandes.":"Escribió en castellano la serie Episodios de una guerra interminable, sobre la memoria histórica.","Ana María Matute.":"Novelista en castellano de la posguerra, autora de Los hijos muertos."},"source_page":47},{"id":"d113e5f6e9","num":4028,"tarea":4,"type":"mc","question":"¿Qué tres culturas convivieron en la España medieval?","options":["La cristiana, la judía y la musulmana.","La fenicia, la judía y la musulmana.","La griega, la cristiana y la judía."],"answer_index":0,"explanation":"En 1252 Alfonso X convirtió Toledo en referente de la cultura medieval, y por esa convivencia Toledo es conocida como la ciudad de las tres culturas: la judía, la musulmana y la cristiana.","why_wrong":{"La fenicia, la judía y la musulmana.":"Los fenicios fueron un pueblo muy anterior a la Edad Media: la tercera cultura de Toledo era la cristiana.","La griega, la cristiana y la judía.":"Falta la musulmana; el griego era solo una de las lenguas de las obras que se traducían en la Escuela de Traductores de Toledo."},"source_page":57},{"id":"0dd42ded12","num":4029,"tarea":4,"type":"mc","question":"El 6 de diciembre se celebra en España...","options":["el Día de la Constitución.","la llegada de Colón a América.","el Día del Libro."],"answer_index":0,"explanation":"El 6 de diciembre o Día de la Constitución española es una de las principales fiestas nacionales del calendario laboral, que tiene 14 días festivos; recuerda el referéndum de 1978, aprobado con una alta participación y un 88 % a favor.","why_wrong":{"la llegada de Colón a América.":"Se conmemora el 12 de octubre, Fiesta Nacional de España; en 1992 se celebró su quinto centenario.","el Día del Libro.":"Es el 23 de abril, fecha en que murieron Cervantes, Shakespeare y el Inca Garcilaso de la Vega."},"source_page":76,"source_quote":"1 de noviembre o Todos los Santos; 6 de diciembre o Día de la Constitución española; 8 de diciembre o la Inmaculada Concepción, y 25 de diciembre o Navidad."},{"id":"17c379adea","num":4030,"tarea":4,"type":"mc","question":"¿Qué ciudad fue un centro científico en Al-Ándalus, donde se estudiaba medicina y astronomía?","options":["Barcelona.","Madrid.","Córdoba."],"answer_index":2,"explanation":"En la Edad Media Córdoba fue centro de cultura de Al-Ándalus, donde se estudiaban medicina, filosofía, matemáticas y astronomía, y donde pensadores como Averroes y Maimónides difundieron conocimientos que después influyeron en toda Europa.","why_wrong":{"Barcelona.":"Destaca por su patrimonio modernista (Parque Güell, Casa Milà, Sagrada Familia) y por el Museo Picasso, no por la ciencia andalusí.","Madrid.":"No fue ciudad de Al-Ándalus; se asocia al Monasterio de El Escorial y a los museos nacionales del Prado y Reina Sofía."},"source_page":56},{"id":"a7e26f9d74","num":4031,"tarea":4,"type":"mc","question":"¿En qué ciudad española está el Museo Guggenheim?","options":["Bilbao.","Madrid.","Valencia."],"answer_index":0,"explanation":"El Museo Guggenheim se encuentra en Bilbao, capital de Vizcaya (País Vasco), y figura entre los museos españoles de fama internacional, junto al Museo Picasso de Barcelona y al Thyssen-Bornemisza de Madrid.","why_wrong":{"Madrid.":"Alberga el Prado, el Reina Sofía, el Thyssen-Bornemisza y la Casa Museo Sorolla.","Valencia.":"No es sede del Guggenheim; su gran referencia son las Fallas de marzo."},"source_page":52},{"id":"6fa22ac40d","num":4032,"tarea":4,"type":"mc","question":"El Premio Cervantes se da a...","options":["actores.","escritores.","pintores."],"answer_index":1,"explanation":"El Premio Cervantes, equivalente al Premio Nobel de las letras hispanas, premia la obra literaria completa en español de un escritor español o hispanoamericano; se concedió por primera vez a Jorge Guillén en 1976.","why_wrong":{"actores.":"A los profesionales del cine los premian los Goya, de la Academia de las Artes y las Ciencias Cinematográficas de España.","pintores.":"No es un premio de pintura; la gran cita del arte contemporáneo es la Feria Internacional de Arte Contemporáneo (ARCO), en Madrid desde 1981."},"source_page":63},{"id":"a690ec56f7","num":4033,"tarea":4,"type":"mc","question":"¿Qué premio reconoce a los mejores actores y películas?","options":["Premio Goya.","Premio Nobel.","Premio Cervantes."],"answer_index":0,"explanation":"Los Premios Goya los concede la Academia de las Artes y las Ciencias Cinematográficas de España y premian a los mejores profesionales de cada una de las especialidades técnicas y creativas del cine.","why_wrong":{"Premio Nobel.":"Es internacional y se concede en especialidades como Literatura o Fisiología y Medicina; entre los españoles lo recibieron Ramón y Cajal o Severo Ochoa.","Premio Cervantes.":"Premia la obra literaria completa en español y equivale al Nobel de las letras hispanas."},"source_page":63},{"id":"99cce4183f","num":4034,"tarea":4,"type":"mc","question":"¿Qué premios promueven en España valores científicos, culturales y humanísticos?","options":["Los Premios Cervantes.","Los Premios Princesa de Asturias.","Los Premios Goya."],"answer_index":1,"explanation":"Los Premios Princesa de Asturias los concede anualmente la Fundación Princesa de Asturias para promover valores científicos, culturales y humanísticos a nivel internacional.","why_wrong":{"Los Premios Cervantes.":"Se limitan a la literatura en español y se concedieron por primera vez a Jorge Guillén en 1976.","Los Premios Goya.":"Reconocen exclusivamente el cine, por especialidades técnicas y creativas."},"source_page":63},{"id":"6f18e0bd65","num":4035,"tarea":4,"type":"mc","question":"¿Cuál de estos deportes es muy popular en España?","options":["El fútbol.","El esquí.","El golf."],"answer_index":0,"explanation":"El fútbol es el deporte de mayor importancia en España, con sus campeonatos de Liga y de Copa del Rey y con sus selecciones nacionales masculina y femenina.","why_wrong":{"El esquí.":"el deporte de montaña que destaca en España es el montañismo, con figuras como Edurne Pasaban.","El golf.":"no está entre los deportes de mayor seguimiento en España, donde destacan el fútbol, el baloncesto y el ciclismo de la Vuelta a España."},"source_page":65},{"id":"1e9afeddd8","num":4036,"tarea":4,"type":"mc","question":"¿Cuál de estos deportistas juega al tenis?","options":["Pau Gasol.","Carlos Sainz.","Carlos Alcaraz."],"answer_index":2,"explanation":"Carlos Alcaraz es tenista, ganador de torneos de Grand Slam como el de Roland Garros.","why_wrong":{"Pau Gasol.":"Practica baloncesto, igual que su hermano Marc Gasol.","Carlos Sainz.":"Es piloto de automovilismo (Fórmula 1)."},"source_page":65},{"id":"bc31845837","num":5001,"tarea":5,"type":"mc","question":"¿Qué documento deben solicitar los extranjeros para residir legalmente en España?","options":["El Documento Nacional de Identidad (DNI).","La Tarjeta de Identidad de Extranjero (TIE).","El certificado de empadronamiento."],"answer_index":1,"explanation":"La tarjeta de identidad de extranjero (TIE) es el documento que acredita la autorización de residencia: los extranjeros que quieran residir en España deben realizar los trámites necesarios para obtenerla, y se tramita de forma presencial en la comisaría de policía, que depende del Ministerio del Interior.","why_wrong":{"El Documento Nacional de Identidad (DNI).":"es el documento obligatorio para los españoles mayores de 14 años, y su número, con una letra al final, sirve también como Número de Identificación Fiscal (NIF).","El certificado de empadronamiento.":"solo muestra el lugar de residencia y lo expide el Ayuntamiento; de hecho, para empadronarse hay que presentar antes un documento de identidad como la TIE o el pasaporte."},"source_page":71},{"id":"d9b3e9d451","num":5002,"tarea":5,"type":"mc","question":"¿Cuál es el documento que certifica el lugar de residencia del titular?","options":["El certificado de empadronamiento.","La partida de nacimiento.","El carné de conducir."],"answer_index":0,"explanation":"El certificado de empadronamiento lo expide el Ayuntamiento del municipio donde se vive, y para empadronarse hay que justificar que se reside en una vivienda y presentar un documento original de identidad, como el pasaporte o la Tarjeta de Identidad de Extranjero (TIE).","why_wrong":{"La partida de nacimiento.":"el certificado de nacimiento es el documento que muestra cuándo y dónde nace alguien, y se obtiene en el Registro Civil, que depende del Ministerio de Justicia.","El carné de conducir.":"solo acredita que se puede conducir legalmente por España y lo expide la Dirección General de Tráfico (DGT) tras dos exámenes."},"source_page":71},{"id":"a3e63d32a4","num":5003,"tarea":5,"type":"mc","question":"¿A qué sustituye el registro electrónico individual?","options":["Al DNI.","Al permiso de conducir.","Al libro de familia."],"answer_index":2,"explanation":"Desde el 1 de mayo de 2021 el registro electrónico individual convive con el libro de familia, que era el documento que se obtenía al tener o adoptar un hijo o al casarse; en el registro electrónico se anota el nacimiento, la mayoría de edad, la fecha de matrimonio o la adquisición de la nacionalidad.","why_wrong":{"Al DNI.":"el Documento Nacional de Identidad (DNI) sigue siendo obligatorio para los españoles mayores de 14 años y su número funciona además como Número de Identificación Fiscal (NIF), así que ningún registro lo sustituye.","Al permiso de conducir.":"es un documento de tráfico que expide la Dirección General de Tráfico (DGT) y no recoge datos de estado civil ni de filiación."},"source_page":70},{"id":"caf39d8d14","num":5004,"tarea":5,"type":"mc","question":"¿Cuál es la edad mínima para conducir un coche en España?","options":["16 años.","18 años.","20 años."],"answer_index":1,"explanation":"El carné o permiso de conducir lo pueden conseguir las personas mayores de 18 años, además de aprobar el examen teórico y el práctico y presentar un informe de aptitud psicofísica.","why_wrong":{"16 años.":"es la edad mínima para trabajar en España y la edad en la que termina la educación básica obligatoria, no la de conducir.","20 años.":"no corresponde a ningún requisito del permiso de conducir, que ya se puede obtener a los 18."},"source_page":71},{"id":"b543b440ba","num":5005,"tarea":5,"type":"mc","question":"El carné de conducir se hace en...","options":["la Dirección General de Tráfico (DGT).","la Policía Nacional.","el Registro Civil."],"answer_index":0,"explanation":"La Dirección General de Tráfico (DGT) es el organismo responsable de examinar y de expedir el permiso de conducir; hay que aprobar un examen teórico y uno práctico y aportar un informe de aptitud psicofísica, el Documento Nacional de Identidad (DNI) o pasaporte en vigor y una fotografía.","why_wrong":{"la Policía Nacional.":"en las comisarías se tramitan de forma presencial el DNI, la Tarjeta de Identidad de Extranjero (TIE) y el pasaporte, documentos que dependen del Ministerio del Interior.","el Registro Civil.":"depende del Ministerio de Justicia y se ocupa de las inscripciones de nacimiento, matrimonio o divorcio y de los trámites de nacionalidad."},"source_page":71},{"id":"82bbafbbc4","num":5006,"tarea":5,"type":"mc","question":"Para sacar el carné de conducir hay que aprobar...","options":["un examen teórico.","un examen práctico.","un examen teórico y otro práctico."],"answer_index":2,"explanation":"Hacen falta las dos pruebas y, además, un informe de aptitud psicofísica, el Documento Nacional de Identidad (DNI) o pasaporte en vigor y una fotografía; después hay que mantener el carné en vigor, porque si se pierden todos los puntos se retira el permiso de conducir.","why_wrong":{"un examen teórico.":"por sí solo no basta: acredita el conocimiento de la normativa, pero la Dirección General de Tráfico (DGT) exige demostrar también la conducción real del vehículo.","un examen práctico.":"tampoco basta por sí solo, porque antes de la prueba al volante hay que superar el examen teórico de normas de circulación."},"source_page":71,"source_quote":"Para obtenerlo hay que aprobar un examen teórico y uno práctico, presentar un informe de aptitud psicofísica, el DNI o pasaporte en vigor y una fotografía."},{"id":"a0780bc60e","num":5007,"tarea":5,"type":"mc","question":"¿Dónde se tramita el libro de familia?","options":["En el Registro Civil.","En la Seguridad Social.","En las comisarías de policía."],"answer_index":0,"explanation":"El Registro Civil, que pertenece al Ministerio de Justicia, tramitaba el libro de familia y se encarga de las inscripciones de nacimiento, matrimonio y divorcio; desde el 1 de mayo de 2021 ese libro convive con el registro electrónico individual.","why_wrong":{"En la Seguridad Social.":"su Tesorería General expide el número de la Seguridad Social cuando una persona empieza a trabajar y a cotizar, no documentos de estado civil.","En las comisarías de policía.":"allí se tramitan de forma presencial el Documento Nacional de Identidad (DNI), la Tarjeta de Identidad de Extranjero (TIE) y el pasaporte, porque dependen del Ministerio del Interior."},"source_page":70},{"id":"06ba6387e8","num":5008,"tarea":5,"type":"mc","question":"¿Cuál de estos canales de televisión es autonómico?","options":["Telecinco.","Nova.","Canal Sur."],"answer_index":2,"explanation":"Canal Sur es la cadena autonómica de televisión pública de Andalucía; del mismo tipo son Euskal Telebista (ETB) en el País Vasco, Telemadrid en la Comunidad de Madrid, TV3, de la Corporació Catalana de Mitjans Audiovisuals, en Cataluña, y TVG, de la Compañía de Radio Televisión de Galicia.","why_wrong":{"Telecinco.":"es un canal privado del grupo Mediaset España, al que pertenecen también Cuatro, Boing o Divinity.","Nova.":"es un canal privado del grupo Atresmedia, junto con Antena 3, LaSexta, Neox y Mega."},"source_page":83},{"id":"0ebabc1964","num":5009,"tarea":5,"type":"mc","question":"¿Cuánto dura el permiso de maternidad o paternidad?","options":["12 semanas.","19 semanas.","22 semanas."],"answer_index":1,"explanation":"El permiso laboral por nacimiento o adopción y cuidado del menor es de 19 semanas para la madre y 19 para el padre; existen además el permiso de lactancia y la reducción de la jornada de trabajo por tener a cargo hijos menores de 12 años.","why_wrong":{"12 semanas.":"no corresponde a este permiso: los 12 son los años de edad del hijo que dan derecho a reducir la jornada.","22 semanas.":"supera la duración reconocida, que es de 19 semanas para cada progenitor."},"source_page":72},{"id":"770f5d480b","num":5010,"tarea":5,"type":"mc","question":"¿Cuál es la tasa máxima de alcohol en sangre permitida a los conductores, en gramos por litro (g/l)?","options":["0,5.","0,7.","0,9."],"answer_index":0,"explanation":"El control de alcoholemia fija el límite en 0,5 g/l en sangre y es una de las medidas que han reducido los accidentes mortales, junto con el control de velocidad (120 km/h en autopista o autovía, 90 en carretera convencional y 20, 30 o 50 en ciudad) y el uso obligatorio del cinturón por todos los ocupantes.","why_wrong":{"0,7.":"está por encima del límite legal, de modo que conducir con esa tasa ya sería una infracción de alcoholemia.","0,9.":"casi duplica la tasa permitida y supone igualmente conducir bajo los efectos del alcohol."},"source_page":87},{"id":"73440df33e","num":5011,"tarea":5,"type":"mc","question":"¿Cuál es el tipo de residencia más habitual en España?","options":["Casa rural.","Piso en un edificio de viviendas.","Chalé independiente."],"answer_index":1,"explanation":"En España el tipo de vivienda varía según la zona (urbana o rural) y la situación económica de las personas, y la residencia más habitual es el piso en un edificio de viviendas.","why_wrong":{"Casa rural.":"es la vivienda propia de las zonas rurales, no la modalidad mayoritaria del país.","Chalé independiente.":"entra en la vivienda unifamiliar (chalé o casa adosada a otras, con servicios comunes), que es otra modalidad y no la principal."},"source_page":73},{"id":"26ac8919cb","num":5012,"tarea":5,"type":"mc","question":"¿Qué comunidad autónoma es conocida por la calidad de su aceite de oliva?","options":["Cantabria.","Andalucía.","La Rioja."],"answer_index":1,"explanation":"Andalucía y Castilla-La Mancha son las comunidades con denominaciones de origen de aceite de oliva.","why_wrong":{"Cantabria.":"no es una región conocida por su aceite de oliva ni tiene denominaciones de origen de aceite.","La Rioja.":"es una de las denominaciones de origen de vinos, junto con Ribera del Duero y Jerez, no de aceite."},"source_page":75},{"id":"743acd7ece","num":5013,"tarea":5,"type":"mc","question":"¿Cómo se llama la revisión que deben pasar obligatoriamente los coches?","options":["IBI (Impuesto sobre Bienes Inmuebles).","ITV (Inspección Técnica de Vehículos).","ITE (Inspección Técnica de Edificios)."],"answer_index":1,"explanation":"La Inspección Técnica de Vehículos (ITV) es una de las obligaciones del propietario de un coche, junto con matricularlo, tener al día el seguro, pagar los impuestos anuales y no dejar conducir el vehículo a personas sin carné.","why_wrong":{"IBI (Impuesto sobre Bienes Inmuebles).":"es un impuesto que grava la propiedad de los bienes inmuebles; no es una revisión ni afecta a los vehículos.","ITE (Inspección Técnica de Edificios).":"tiene por objeto el estado de los edificios, mientras que la revisión obligatoria de los coches es la ITV."},"source_page":87},{"id":"ad50766b61","num":5014,"tarea":5,"type":"mc","question":"El aperitivo que acompaña a la bebida en bares y restaurantes se llama...","options":["bocadillo.","tapa.","primer plato."],"answer_index":1,"explanation":"El aperitivo se toma en bares o restaurantes antes de comer y tiene una gran importancia en la gastronomía española; recibe distintos nombres según el tamaño, la presentación o el origen: tapa, banderilla, pincho o ración.","why_wrong":{"bocadillo.":"no es uno de los nombres del aperitivo, que son tapa, banderilla, pincho y ración.","primer plato.":"pertenece a la estructura de la comida, por ejemplo al menú del día de dos platos con pan, bebida y postre o café, y no al aperitivo previo."},"source_page":75},{"id":"5f893a721a","num":5015,"tarea":5,"type":"mc","question":"¿Dónde se tramita la tarjeta sanitaria?","options":["En la comisaría de policía.","En el centro de salud.","En el Ministerio de Sanidad."],"answer_index":1,"explanation":"La tarjeta sanitaria se tramita en el centro de salud que corresponde al domicilio, y ese centro depende de la Consejería de Sanidad de la comunidad autónoma, que tiene transferidas la mayoría de las competencias sanitarias.","why_wrong":{"En la comisaría de policía.":"depende del Ministerio del Interior y solo tramita, de forma presencial, el Documento Nacional de Identidad (DNI), la Tarjeta de Identidad de Extranjero (TIE) y el pasaporte.","En el Ministerio de Sanidad.":"coordina y propone la política sanitaria del Gobierno y planifica el derecho a la protección de la salud, pero no atiende trámites individuales de los ciudadanos."},"source_page":72},{"id":"0cf7394c30","num":5016,"tarea":5,"type":"mc","question":"¿Con cuántos hijos una familia es numerosa?","options":["Con 1 hijo.","Con 2 hijos.","Con 3 hijos."],"answer_index":2,"explanation":"Las familias numerosas son las que tienen tres hijos o más; las familias tienen reconocidas ayudas fiscales, como la desgravación por hijos en la declaración de la renta, y descuentos en transporte público, matrículas universitarias, guardería o comedores escolares.","why_wrong":{"Con 1 hijo.":"no da esa condición; con un solo progenitor y sus hijos se hablaría de familia monoparental.","Con 2 hijos.":"se queda por debajo del umbral, que está en tres hijos o más."},"source_page":72},{"id":"8007186d94","num":5017,"tarea":5,"type":"mc","question":"En España está permitido el matrimonio...","options":["solo entre personas del mismo sexo.","entre personas del mismo y diferente sexo.","solo entre personas de diferente sexo."],"answer_index":1,"explanation":"Se permite el matrimonio entre personas del mismo sexo y también entre personas de sexo diferente, y los matrimonios pueden ser religiosos o civiles; quienes no quieren casarse pueden registrarse como pareja de hecho.","why_wrong":{"solo entre personas del mismo sexo.":"excluiría el matrimonio entre hombre y mujer, que es igualmente válido y se inscribe en el Registro Civil.","solo entre personas de diferente sexo.":"niega el matrimonio entre personas del mismo sexo, que está expresamente permitido en España."},"source_page":72},{"id":"ff713b0e30","num":5018,"tarea":5,"type":"mc","question":"Los propietarios de perros deben registrarlos en...","options":["el Ministerio de Justicia.","la comisaría de policía.","el Ayuntamiento."],"answer_index":2,"explanation":"El registro se hace en el Ayuntamiento y, además, los perros deben llevar obligatoriamente un microchip electrónico, vacunarse, pasar revisiones veterinarias periódicas y contar con un seguro de responsabilidad civil por daños a terceros.","why_wrong":{"el Ministerio de Justicia.":"de él depende el Registro Civil, que inscribe nacimientos, matrimonios y divorcios de personas.","la comisaría de policía.":"tramita el Documento Nacional de Identidad (DNI), la Tarjeta de Identidad de Extranjero (TIE) y el pasaporte, es decir, documentos de identidad de personas, no censos de animales."}},{"id":"d8ef16008d","num":5019,"tarea":5,"type":"mc","question":"Los principales ingredientes de la tortilla española son huevos y...","options":["pimientos.","patatas.","tomates."],"answer_index":1,"explanation":"La tortilla de patatas o tortilla española se hace con huevos, patata y cebolla, y es uno de los platos españoles más conocidos internacionalmente, junto con la paella, los churros, el gazpacho o la sangría.","why_wrong":{"pimientos.":"el pimiento es uno de los ingredientes del gazpacho, con tomate, pepino, ajo y cebolla.","tomates.":"el tomate es la base del gazpacho, no de la tortilla española."},"source_page":75},{"id":"4476b2324d","num":5020,"tarea":5,"type":"mc","question":"¿Cuál es uno de los platos más conocidos internacionalmente de la gastronomía española?","options":["Gazpacho.","Pizza.","Pasta."],"answer_index":0,"explanation":"El gazpacho, hecho con tomate, pepino, pimiento, ajo y cebolla, es una de las comidas españolas más conocidas internacionalmente, junto a la paella, la tortilla de patatas, los churros y la sangría.","why_wrong":{"Pizza.":"es un plato de origen italiano.","Pasta.":"es la base de la cocina italiana; el plato español de arroz es la paella."},"source_page":75},{"id":"b1ad953afc","num":5021,"tarea":5,"type":"mc","question":"¿Cuál de estos canales de televisión es público?","options":["Tele 5.","La 1.","Antena 3."],"answer_index":1,"explanation":"La 1 es el canal generalista de la Corporación RTVE (Radio Televisión Española), cuyos otros canales públicos son La 2 (cultural), Clan (infantil), 24 horas (noticias) y Teledeporte (deportes).","why_wrong":{"Tele 5.":"Telecinco es un canal privado de Mediaset España, grupo al que pertenecen además Cuatro, Boing o Divinity.","Antena 3.":"es un canal privado del grupo Atresmedia, junto con LaSexta, Neox, Nova, Mega y Atreseries."},"source_page":83},{"id":"c44ee965e1","num":5022,"tarea":5,"type":"mc","question":"En una comunidad de vecinos, una de las normas es...","options":["abrir la puerta al cartero.","no molestar con ruido.","limpiar los espacios comunes."],"answer_index":1,"explanation":"Entre las normas básicas de convivencia de las comunidades de vecinos está no molestar a los demás con ruidos, sobre todo a partir de las 22:00 horas; también hay que pagar los gastos de la comunidad y reciclar la basura.","why_wrong":{"abrir la puerta al cartero.":"no es una norma de convivencia vecinal; los envíos postales se gestionan en Correos.","limpiar los espacios comunes.":"la norma vecinal es cuidar los espacios comunes, que no es lo mismo que encargarse de limpiarlos."},"source_page":74},{"id":"1140ea0a70","num":5023,"tarea":5,"type":"mc","question":"¿Cuál de estos es el principal ingrediente de la paella valenciana?","options":["Arroz.","Chorizo.","Garbanzos."],"answer_index":0,"explanation":"La paella es un plato de arroz con verduras y azafrán al que se añade pollo, mariscos o carne, y es uno de los platos españoles más conocidos fuera de España.","why_wrong":{"Chorizo.":"es un producto ibérico del cerdo, no el ingrediente principal de la paella valenciana.","Garbanzos.":"no son ingrediente de la paella, que se hace con arroz, verduras y azafrán."},"source_page":74},{"id":"9dfd5686ce","num":5024,"tarea":5,"type":"mc","question":"La sidra es una bebida típica de...","options":["Asturias.","Valencia.","Canarias."],"answer_index":0,"explanation":"El Principado de Asturias es la denominación de origen de la sidra, una de las bebidas españolas más conocidas junto con el vino y el cava.","why_wrong":{"Valencia.":"no es zona sidrera; se asocia a la paella, plato de arroz con azafrán y verduras.","Canarias.":"no es zona de sidra: es un archipiélago atlántico de clima subtropical."},"source_page":75},{"id":"5cfc089999","num":5025,"tarea":5,"type":"mc","question":"Los españoles tienen dos apellidos, el primero es...","options":["obligatoriamente el de la madre.","obligatoriamente el del padre.","puede ser el de la madre o el del padre."],"answer_index":2,"explanation":"Generalmente el primer apellido es el primer apellido del padre y el segundo el primer apellido de la madre, pero los padres pueden decidir invertir el orden; el nombre, por su parte, puede ser simple (Ana) o compuesto (Juan Carlos).","why_wrong":{"obligatoriamente el de la madre.":"solo va en primer lugar si los padres deciden invertir el orden habitual; no es una imposición legal.","obligatoriamente el del padre.":"es lo más frecuente, pero no obligatorio, precisamente porque el orden se puede invertir."},"source_page":70},{"id":"efa786d4ac","num":5026,"tarea":5,"type":"mc","question":"La Fiesta Nacional de España es el...","options":["6 de diciembre.","15 de agosto.","12 de octubre."],"answer_index":2,"explanation":"El 12 de octubre es la Fiesta Nacional de España y una de las principales fiestas del calendario laboral, que va de enero a diciembre y suma 14 días festivos entre nacionales, autonómicos y locales.","why_wrong":{"6 de diciembre.":"es el Día de la Constitución española, otro festivo nacional distinto de la Fiesta Nacional.","15 de agosto.":"es la Asunción de la Virgen, fiesta de origen religioso incluida también entre las principales."},"source_page":76},{"id":"15f3c9aa9c","num":5027,"tarea":5,"type":"mc","question":"¿Qué días suelen cerrar la mayoría de las tiendas o el pequeño comercio?","options":["Los lunes.","Los domingos.","Los sábados por la tarde."],"answer_index":1,"explanation":"Los domingos las tiendas suelen estar cerradas; el pequeño comercio abre de lunes a viernes, con una pausa larga para la comida, aunque muchos hipermercados y centros comerciales abren de 10:00 a 22:00 horas todos los días.","why_wrong":{"Los lunes.":"es día laborable de apertura, porque el horario habitual del comercio va de lunes a viernes.","Los sábados por la tarde.":"el sábado el pequeño comercio abre solo por la mañana, así que se trata de media jornada de apertura y no del día de cierre semanal."},"source_page":76},{"id":"f5b13dd3d6","num":5028,"tarea":5,"type":"mc","question":"¿Dónde se hace el pasaporte?","options":["En el registro civil.","En una comisaría de policía.","En el Ayuntamiento."],"answer_index":1,"explanation":"El pasaporte se tramita de forma presencial en la comisaría de policía, que depende del Ministerio del Interior, igual que el Documento Nacional de Identidad (DNI) y la Tarjeta de Identidad de Extranjero (TIE); es el documento oficial español para viajar a países que no pertenecen a la Unión Europea ni al espacio Schengen.","why_wrong":{"En el registro civil.":"pertenece al Ministerio de Justicia y se encarga de las inscripciones de nacimiento, matrimonio o divorcio y de los trámites de nacionalidad.","En el Ayuntamiento.":"expide el certificado de empadronamiento, que acredita el lugar de residencia, pero no documentos de viaje."},"source_page":72},{"id":"dd1f73e911","num":5029,"tarea":5,"type":"mc","question":"El Ministerio de Igualdad es el encargado de luchar contra la violencia de género y la...","options":["separación.","discriminación.","solidaridad."],"answer_index":1,"explanation":"El Ministerio de Igualdad se encarga de luchar contra la discriminación y la violencia de género, y de él depende el 016, servicio gratuito de atención a las víctimas, disponible las 24 horas los 365 días del año, que atiende en 53 idiomas y no deja rastro en la factura telefónica.","why_wrong":{"separación.":"la separación y el divorcio están permitidos y son situaciones legales que se inscriben en el Registro Civil, con regulación de la custodia y la responsabilidad económica.","solidaridad.":"es un valor positivo que no hay que combatir; en ese ámbito trabajan organizaciones no gubernamentales (ONG) como Cáritas o Cruz Roja."},"source_page":82},{"id":"ea0e666db6","num":5030,"tarea":5,"type":"mc","question":"¿Qué comunidad autónoma es conocida por la calidad de sus cavas?","options":["Galicia.","Cataluña.","Castilla-La Mancha."],"answer_index":1,"explanation":"Cataluña es la denominación de origen de los cavas; el cava es, junto con el vino y la sidra, una de las bebidas españolas más conocidas.","why_wrong":{"Galicia.":"no es denominación de origen de bebidas; las de los vinos son La Rioja, Ribera del Duero y Jerez.","Castilla-La Mancha.":"es denominación de origen de aceite de oliva, junto con Andalucía."},"source_page":75,"source_quote":"Las regiones más conocidas por sus denominaciones de origen (D. O.) son: La Rioja, Ribera del Duero y Jerez, para los vinos; Principado de Asturias, para la sidra; Cataluña, para los cavas; Andalucía y Castilla-La Mancha, para el aceite de oliva."},{"id":"b5c8c4b43a","num":5031,"tarea":5,"type":"mc","question":"¿Qué documento se necesita para recibir atención médica en la sanidad pública?","options":["El pasaporte.","La tarjeta sanitaria.","El certificado de nacimiento."],"answer_index":1,"explanation":"La tarjeta sanitaria identifica a la persona para ser atendida en la sanidad pública y es necesaria también para las recetas médicas y para acudir a los especialistas; cada ciudadano tiene asignado un médico de familia al que hay que pedir cita previa.","why_wrong":{"El pasaporte.":"es el documento oficial para viajar a países ajenos a la Unión Europea y al espacio Schengen, y se tramita en la comisaría de policía.","El certificado de nacimiento.":"muestra cuándo y dónde nace alguien y lo expide el Registro Civil, sin dar acceso a la asistencia sanitaria."},"source_page":81},{"id":"733c932964","num":5032,"tarea":5,"type":"mc","question":"El horario de Canarias, con respecto a la Península, es de...","options":["dos horas menos.","una hora menos.","una hora más."],"answer_index":1,"explanation":"Canarias tiene una hora menos que la Península, cuyo horario es el del meridiano de Greenwich (GMT/UTC) más 1 hora en invierno y más 2 horas en verano.","why_wrong":{"dos horas menos.":"exagera la diferencia, que es de una sola hora.","una hora más.":"invierte la relación, porque en Canarias es más temprano que en la Península, no más tarde."},"source_page":76},{"id":"f9bc1f2a0e","num":5033,"tarea":5,"type":"mc","question":"Para acceder a la Universidad se debe superar una prueba de evaluación llamada...","options":["Selectividad.","Examen preuniversitario.","Prueba de Acceso a la Universidad."],"answer_index":2,"explanation":"Los titulados en Bachillerato deben realizar la Prueba de Acceso a la Universidad (PAU); también se puede acceder a la universidad con un título de Técnico Superior de Formación Profesional, obtenido en un ciclo formativo de Grado Superior.","why_wrong":{"Selectividad.":"no es el nombre oficial de la prueba actual, que se llama Prueba de Acceso a la Universidad (PAU).","Examen preuniversitario.":"tampoco es el nombre oficial de esa prueba; los estudios universitarios se organizan en Grado, Máster y Doctorado."},"source_page":78},{"id":"2c130eae10","num":5034,"tarea":5,"type":"mc","question":"¿Cuál de estos productos necesita importar España de otros países?","options":["Petróleo.","Aceite de oliva.","Medicamentos."],"answer_index":0,"explanation":"España importa petróleo y derivados, además de componentes del automóvil, textiles y confección, y realiza estas transacciones principalmente con países de la Unión Europea.","why_wrong":{"Aceite de oliva.":"es un producto de exportación español, con denominaciones de origen en Andalucía y Castilla-La Mancha.","Medicamentos.":"también se exportan, junto con automóviles, frutas y legumbres, vino y calzado; el sector farmacéutico es uno de los de mayor innovación en España."},"source_page":90},{"id":"bb6a7b5907","num":5035,"tarea":5,"type":"mc","question":"¿Qué tipo de impuestos tienen que pagar los ciudadanos en España?","options":["Impuestos directos como el IRPF.","Impuestos indirectos como el IVA.","Impuestos directos e indirectos."],"answer_index":2,"explanation":"Se pagan los dos tipos: los directos gravan la posesión de un patrimonio y la obtención de una renta (Impuesto sobre la Renta de las Personas Físicas o IRPF, Impuesto sobre la Renta de no Residentes, Impuesto de Sociedades) y los indirectos se aplican al consumo o a actos de transmisión (Impuesto sobre el Valor Añadido o IVA e Impuestos Especiales sobre alcohol, hidrocarburos, tabaco o matriculación de vehículos).","why_wrong":{"Impuestos directos como el IRPF.":"es solo una parte: el IRPF se liquida en la declaración de la renta anual, pero deja fuera la tributación del consumo.","Impuestos indirectos como el IVA.":"también es incompleta, porque el IVA grava el consumo y no sustituye a los impuestos sobre la renta o el patrimonio."},"source_page":91},{"id":"e6d1b26f64","num":5036,"tarea":5,"type":"mc","question":"Los adultos sin Bachillerato pueden estudiar en la Universidad haciendo una prueba especial a partir de los...","options":["18 años.","23 años.","25 años."],"answer_index":2,"explanation":"Los centros de educación de personas adultas (CEPA) imparten cursos de preparación para el acceso a la universidad para mayores de 25 años; esos mismos centros permiten obtener el título de Graduado en Educación Secundaria Obligatoria (ESO).","why_wrong":{"18 años.":"es la edad a partir de la cual se puede acudir a un CEPA para completar, actualizar o ampliar estudios, no la de esa prueba especial.","23 años.":"no es la edad de esa prueba especial, que se dirige a los mayores de 25 años."},"source_page":79},{"id":"450e4b7571","num":5037,"tarea":5,"type":"mc","question":"¿Dónde puede encontrarse la siguiente norma «No pisar el césped, ni arrancar flores»?","options":["En zonas de recreo.","En los teatros.","En los estadios de fútbol."],"answer_index":0,"explanation":"Es una de las normas de las zonas de recreo y descanso de las ciudades, como parques, jardines o instalaciones deportivas, donde también hay que respetar el mobiliario urbano y los horarios de apertura y cierre; en parques naturales y espacios protegidos, además, hay que extremar el cuidado para evitar incendios.","why_wrong":{"En los teatros.":"son espacios cerrados de espectáculos, sin césped ni flores; allí rigen las normas escritas del propio establecimiento.","En los estadios de fútbol.":"son instalaciones deportivas de uso reglamentado en las que el césped es la superficie de juego y no una zona de paseo abierta al público."},"source_page":87,"source_quote":"No consumir bebidas, ni alimentos, si no está permitido. No fumar, en el caso de que el lugar público esté frente a un hospital o centro educativo. No pisar el césped, ni arrancar flores."},{"id":"f496714016","num":5038,"tarea":5,"type":"mc","question":"El Bachillerato en España...","options":["es obligatorio.","se compone de dos cursos académicos.","es la enseñanza a alumnos de 14 a 16 años."],"answer_index":1,"explanation":"El Bachillerato dura dos cursos académicos, 1.º y 2.º de Bachillerato, y se cursa entre los 16 y los 18 años; su título permite el acceso a las distintas enseñanzas de educación superior, aunque para la universidad haya que superar además la Prueba de Acceso a la Universidad (PAU).","why_wrong":{"es obligatorio.":"la educación básica es obligatoria y gratuita de los 6 a los 16 años y termina con la Educación Secundaria Obligatoria (ESO), de modo que el Bachillerato es ya enseñanza secundaria no obligatoria.","es la enseñanza a alumnos de 14 a 16 años.":"esa franja de edad queda dentro de la ESO, que se cursa de los 12 a los 16 años en cuatro cursos académicos."},"source_page":77},{"id":"95bf1ceacc","num":5039,"tarea":5,"type":"mc","question":"El Impuesto sobre el Valor Añadido (IVA) forma parte de los...","options":["Impuestos indirectos.","Impuestos sobre la renta.","Impuestos sobre sociedades."],"answer_index":0,"explanation":"El IVA es un impuesto indirecto porque se aplica al consumo; en el mismo grupo están los Impuestos Especiales sobre el alcohol y las bebidas alcohólicas, los hidrocarburos, el tabaco o la matriculación de medios de transporte.","why_wrong":{"Impuestos sobre la renta.":"son impuestos directos, como el Impuesto sobre la Renta de las Personas Físicas (IRPF) o el Impuesto sobre la Renta de no Residentes, y se liquidan en la declaración anual de la renta.","Impuestos sobre sociedades.":"el Impuesto de Sociedades es también un impuesto directo y grava la renta obtenida por las empresas."},"source_page":91},{"id":"08a742ec86","num":5040,"tarea":5,"type":"mc","question":"¿Qué número reciben los trabajadores al comenzar su primer empleo?","options":["El de la Seguridad Social.","El del pasaporte.","El número de servicio."],"answer_index":0,"explanation":"El número de la Seguridad Social se recibe al empezar a trabajar y a cotizar, y se obtiene en la Tesorería General de la Seguridad Social; a partir de ahí, el informe de vida laboral refleja la cotización y toda la trayectoria profesional, con las empresas, las fechas y los tipos de contrato.","why_wrong":{"El del pasaporte.":"identifica un documento de viaje para países ajenos a la Unión Europea y al espacio Schengen, y se tramita en la comisaría de policía.","El número de servicio.":"no corresponde a ningún documento español; los números oficiales de una persona son el del Documento Nacional de Identidad (DNI) y el de la Seguridad Social."},"source_page":71},{"id":"0314945117","num":5041,"tarea":5,"type":"mc","question":"Los colegios públicos...","options":["pueden decidir su número de plazas.","pueden contratar a los profesores que quieran.","son gratuitos."],"answer_index":2,"explanation":"La educación es obligatoria y gratuita de los 6 a los 16 años, excepto los libros y los materiales educativos, y los centros públicos están financiados por la Administración pública; son además centros laicos en cuyo control y gestión participan alumnos, padres y profesores.","why_wrong":{"pueden decidir su número de plazas.":"tienen plazas limitadas y el acceso se regula por requisitos como la cercanía de la vivienda, que no fija el propio centro.","pueden contratar a los profesores que quieran.":"la libertad de gestión corresponde a los centros privados, financiados exclusivamente por los padres, y en parte a los concertados, que reciben subvenciones públicas."}},{"id":"de2099c0eb","num":5042,"tarea":5,"type":"mc","question":"¿Cuál de estos puertos es uno de los principales de España?","options":["Tenerife.","Alicante.","Algeciras."],"answer_index":2,"explanation":"Algeciras es uno de los principales puertos de España, junto con Barcelona, Las Palmas, Bilbao, Valencia y Vigo.","why_wrong":{"Tenerife.":"no es uno de los principales puertos; el puerto canario que sí lo es es Las Palmas.","Alicante.":"es capital de provincia en la Comunidad Valenciana, pero el puerto valenciano que figura entre los principales es el de Valencia."},"source_page":89,"source_quote":"Puertos más importantes: Algeciras, Barcelona, Las Palmas, Bilbao, Valencia y Vigo."},{"id":"8a0048231b","num":5043,"tarea":5,"type":"mc","question":"Un colegio concertado es un colegio privado que...","options":["recibe dinero de la Administración.","financian los padres de los alumnos.","recibe dinero de los bancos."],"answer_index":0,"explanation":"Los centros concertados son centros privados que reciben subvenciones de la Administración pública; la mayoría son religiosos y, aunque tienen libertad de gestión, la Administración les impone el límite de alumnos por clase y el calendario escolar.","why_wrong":{"financian los padres de los alumnos.":"esa es la definición de los centros privados, financiados exclusivamente por las familias y con completa libertad de gestión y cierta libertad de currículum.","recibe dinero de los bancos.":"los centros se clasifican según su financiación en públicos, concertados y privados, y en ninguno interviene la banca."}},{"id":"39361d4615","num":5044,"tarea":5,"type":"mc","question":"España exporta productos principalmente a países...","options":["de Hispanoamérica.","de la Unión Europea.","del norte de África."],"answer_index":1,"explanation":"Las transacciones comerciales españolas se realizan principalmente con países de la Unión Europea, donde destacan los automóviles, las frutas y legumbres, el vino, el aceite, el calzado y los medicamentos.","why_wrong":{"de Hispanoamérica.":"no es el destino principal de las exportaciones españolas, que se dirigen sobre todo a la Unión Europea.","del norte de África.":"tampoco es un destino comercial principal; la economía española es la quinta de la Unión Europea y opera sobre todo dentro de ese mercado, del que importa y al que exporta."},"source_page":90},{"id":"06f3dd51e5","num":5045,"tarea":5,"type":"mc","question":"Las bibliotecas públicas son gratuitas para...","options":["todos.","los parados.","los niños."],"answer_index":0,"explanation":"Las bibliotecas son de acceso gratuito para cualquier ciudadano y, además del préstamo y la consulta de libros, ofrecen videoteca, sala de ordenadores, conexión wifi y lugar de estudio.","why_wrong":{"los parados.":"los parados son las personas mayores de 16 años sin trabajo pero disponibles para trabajar, y la gratuidad de la biblioteca no depende de la situación laboral.","los niños.":"la gratuidad no está limitada por edad; donde sí hay reducciones por edad es en el precio de museos, espectáculos y transporte público para mayores de 65 años."},"source_page":80},{"id":"678fc9ba04","num":5046,"tarea":5,"type":"mc","question":"¿Cuál de estos productos exporta España más que importa?","options":["Gas.","Ropa.","Calzado."],"answer_index":2,"explanation":"El calzado es uno de los principales productos de exportación españoles, junto con los automóviles, las frutas y legumbres, el vino, el aceite y los medicamentos.","why_wrong":{"Gas.":"los productos energéticos están del lado de las importaciones: España importa petróleo y sus derivados.","Ropa.":"los textiles y la confección son productos que España importa, aunque el textil destaque como sector de actividad empresarial."},"source_page":90},{"id":"41059574fa","num":5047,"tarea":5,"type":"mc","question":"Una persona mayor de 18 años puede obtener el título de Graduado en Educación Secundaria Obligatoria en...","options":["un Centro de Educación de Personas Adultas.","un centro de enseñanza primaria.","una universidad."],"answer_index":0,"explanation":"Los centros de educación de personas adultas (CEPA) dan a los mayores de 18 años la posibilidad de completar estudios y obtener el Título de Graduado en Educación Secundaria Obligatoria, actualizar o ampliar su formación e incluso preparar el acceso a la universidad para mayores de 25 años.","why_wrong":{"un centro de enseñanza primaria.":"la Educación Primaria es la primera etapa obligatoria, de los 6 a los 12 años y con seis cursos académicos; no expide títulos de secundaria.","una universidad.":"la universidad imparte grados, másteres y doctorados, y para acceder a ella ya se exige el título de Bachillerato o un título de Técnico Superior de Formación Profesional."},"source_page":79},{"id":"ccaba07d89","num":5048,"tarea":5,"type":"mc","question":"La formación profesional...","options":["es para mayores de 25 años.","puede ser de grado medio o superior.","es obligatoria."],"answer_index":1,"explanation":"La Formación Profesional se organiza en Formación Profesional Básica, ciclos formativos de Grado Medio (título de Técnico) y ciclos formativos de Grado Superior (título de Técnico Superior, que abre la puerta a la universidad); cada ciclo dura dos cursos académicos.","why_wrong":{"es para mayores de 25 años.":"los 25 años son la edad de otra enseñanza distinta: los cursos de preparación para el acceso a la universidad para mayores de 25 años que imparten los centros de adultos.","es obligatoria.":"solo son obligatorias la Educación Primaria y la Educación Secundaria Obligatoria (ESO), de los 6 a los 16 años; la Formación Profesional es una vía posterior y voluntaria, alternativa al Bachillerato."},"source_page":77},{"id":"6883d090e5","num":5049,"tarea":5,"type":"mc","question":"¿Adónde vamos para ver al médico de familia o al pediatra?","options":["Al hospital.","Al centro de salud.","A la farmacia."],"answer_index":1,"explanation":"El centro de salud es el establecimiento de atención primaria y en él prestan servicio médicos de familia, pediatras y enfermeros; cada ciudadano tiene un médico asignado al que hay que pedir cita previa, y para ser atendido hace falta la tarjeta sanitaria.","why_wrong":{"Al hospital.":"el hospital se destina al internamiento clínico y a la asistencia especializada, especialmente la cirugía, además del servicio de urgencias.","A la farmacia.":"la farmacia solo dispensa medicinas, con o sin receta, y tiene servicio de guardia; allí no hay consulta médica."},"source_page":81},{"id":"067e492777","num":5050,"tarea":5,"type":"mc","question":"¿Para cuántos años vale la tarjeta sanitaria europea?","options":["Para un año.","Para dos años.","Para 10 años."],"answer_index":1,"explanation":"La tarjeta sanitaria europea se solicita para utilizarla en otros países de la Unión Europea y tiene una validez de dos años; es distinta de la tarjeta sanitaria española, que se tramita en el centro de salud correspondiente al domicilio.","why_wrong":{"Para un año.":"un año es el plazo que aparece en otro trámite, el de residencia exigido en casos especiales para pedir la nacionalidad (nacido en España, casado o viudo de un ciudadano español).","Para 10 años.":"diez años es el plazo general de residencia que se exige a la mayoría de extranjeros para solicitar la nacionalidad española, no la validez de esta tarjeta."},"source_page":81},{"id":"abb7461e1b","num":5051,"tarea":5,"type":"mc","question":"¿A qué hora se cena normalmente en España?","options":["A las 18 h.","A las 23 h.","A las 21 o 22 h."],"answer_index":2,"explanation":"Los horarios habituales de las comidas en España son el desayuno de 7:30 a 8:30, la comida de 14:00 a 15:30 y la cena de 21:00 a 22:00 h, aunque varían según el día de la semana y las costumbres de cada familia.","why_wrong":{"A las 18 h.":"a esa hora no se hace ninguna de las comidas principales: queda entre la comida, de 14:00 a 15:30, y la cena.","A las 23 h.":"es más tarde que el horario general; a partir de las 22:00 rige además en las comunidades de vecinos la norma de no molestar a los demás con ruidos."},"source_page":75},{"id":"1d685ba0bd","num":5052,"tarea":5,"type":"mc","question":"¿Cuál es el número de teléfono único para cualquier emergencia?","options":["060.","112.","911."],"answer_index":1,"explanation":"El 112 es gratuito y atiende cualquier tipo de emergencia (sanitaria, incendio, salvamento o seguridad ciudadana) en toda la Unión Europea; de la protección civil y la atención de emergencias responden las comunidades autónomas, la Administración central y los Cuerpos y Fuerzas de Seguridad del Estado.","why_wrong":{"060.":"es el teléfono de información de la Administración General del Estado, no un número de emergencias.","911.":"es el número de emergencias de Estados Unidos; en el ámbito de la Unión Europea el número único y gratuito es el 112."},"source_page":82},{"id":"5d030b7b2f","num":5053,"tarea":5,"type":"mc","question":"¿Cuál de estos periódicos se publica a nivel nacional?","options":["El Diario Vasco.","El País.","La Voz de Galicia."],"answer_index":1,"titles":["El Diario Vasco","El País","La Voz de Galicia"],"explanation":"El País es uno de los diarios de ámbito nacional, junto con ABC, El Mundo, La Razón y La Vanguardia; la prensa española se clasifica además en regional, deportiva (As, Marca, Mundo Deportivo) y económica (Cinco Días, Expansión).","why_wrong":{"El Diario Vasco.":"es un diario regional, del ámbito del País Vasco, igual que El Correo.","La Voz de Galicia.":"es otro de los diarios regionales, del ámbito de Galicia."},"source_page":83},{"id":"1891e30c71","num":5054,"tarea":5,"type":"mc","question":"¿Dónde se venden sellos y tabaco?","options":["En el quiosco.","En la farmacia.","En el estanco."],"answer_index":2,"explanation":"El estanco es el establecimiento autorizado para vender tabaco y en él se despachan también los sellos de correos, mientras que el envío postal en sí se realiza en Correos.","why_wrong":{"En el quiosco.":"el quiosco es el lugar en el que se venden periódicos y revistas.","En la farmacia.":"la farmacia vende medicinas con o sin receta, algunas con ayuda económica de la Administración pública, y cuenta con servicio de guardia."}},{"id":"e49a2e4e3a","num":5055,"tarea":5,"type":"mc","question":"¿Cuándo se puede llamar al número de teléfono para atención a víctimas de violencia de género?","options":["Las 24 horas del día.","En horario de mañana.","De lunes a viernes."],"answer_index":0,"explanation":"El 016 está disponible las 24 horas del día, los 365 días del año, no deja rastro en la factura telefónica y atiende en 53 idiomas; dispone además de WhatsApp (600 000 016) y correo electrónico.","why_wrong":{"En horario de mañana.":"un horario de oficina dejaría sin cobertura las situaciones de riesgo del resto del día, y este servicio ofrece apoyo inmediato y asesoramiento jurídico en el momento.","De lunes a viernes.":"el servicio cubre los 365 días del año, de modo que también funciona los fines de semana y los festivos."},"source_page":82},{"id":"df8130bbac","num":5056,"tarea":5,"type":"mc","question":"La organización que trabaja para conseguir la integración de las personas con discapacidad visual es...","options":["la ONCE.","Unicef.","Cáritas."],"answer_index":0,"explanation":"La ONCE, Organización Nacional de Ciegos Españoles, trabaja por la integración de las personas con discapacidad visual y colabora en la atención y defensa de los derechos de personas con otros tipos de discapacidad; fue premiada con el Premio Príncipe de Asturias de la Concordia en 2013.","why_wrong":{"Unicef.":"es un organismo internacional centrado en la infancia, no en la discapacidad visual.","Cáritas.":"es una organización no gubernamental (ONG) de atención social, económica o sanitaria general, junto a Cruz Roja y la Asociación Española Contra el Cáncer, y no está especializada en discapacidad visual."},"source_page":82},{"id":"51a252207b","num":5057,"tarea":5,"type":"mc","question":"El Camino de Santiago es...","options":["Patrimonio de la Humanidad.","una vía de ferrocarril.","una ruta para excursionistas."],"answer_index":0,"explanation":"El Camino de Santiago es uno de los bienes españoles declarados Patrimonio de la Humanidad por la Unesco, la Organización de las Naciones Unidas para la Educación, la Ciencia y la Cultura, que ha reconocido 49 bienes españoles y sitúa a España en el tercer puesto mundial, detrás de Italia y China.","why_wrong":{"una vía de ferrocarril.":"la red ferroviaria española la operan Renfe, OUIGO, Iryo y Captrain y se divide en cercanías, media y larga distancia.","una ruta para excursionistas.":"se recorre a pie, pero es una de las rutas de peregrinación artístico-religiosas europeas más importantes, y lo que la caracteriza oficialmente es ese reconocimiento internacional."},"source_page":52},{"id":"eb85e39f5b","num":5058,"tarea":5,"type":"mc","question":"¿Cuál es el canal de televisión estatal que transmite noticias de actualidad nacional e internacional continuamente?","options":["Teledeporte.","La 1.","Canal 24 horas."],"answer_index":2,"explanation":"Dentro de la Corporación RTVE (Radio Televisión Española) el canal informativo es 24 horas; los demás canales públicos son La 1 (generalista), La 2 (cultural), Clan (infantil) y Teledeporte (deportes).","why_wrong":{"Teledeporte.":"es el canal de RTVE dedicado a la programación deportiva.","La 1.":"es el canal generalista de RTVE, con programación variada, no un informativo continuo."},"source_page":83},{"id":"afdfaa0b5d","num":5059,"tarea":5,"type":"mc","question":"El teléfono gratuito para las víctimas de violencia de género es el...","options":["091.","112.","016."],"answer_index":2,"explanation":"El 016 es el servicio gratuito de atención a víctimas de violencia de género: depende del Ministerio de Igualdad, informa sobre recursos y derechos, da asesoramiento jurídico en el momento y atiende de forma confidencial y anónima, sin necesidad de aportar datos personales.","why_wrong":{"091.":"es el número de la Policía Nacional, no el servicio de atención a las víctimas de violencia de género.","112.":"el 112 es el número europeo gratuito para cualquier emergencia (sanitaria, incendio, salvamento o seguridad ciudadana), no el servicio especializado de información y asesoramiento."},"source_page":82},{"id":"3b2564b641","num":5060,"tarea":5,"type":"mc","question":"En España, la red de trenes puede ser de larga distancia, de media distancia y...","options":["de cercanías.","rural.","transnacional."],"answer_index":0,"explanation":"La red de trenes se divide en cercanías, media distancia y larga distancia; Renfe Operadora, la compañía pública y la más grande, gestiona esas tres, además de la alta velocidad y las mercancías.","why_wrong":{"rural.":"no es una categoría ferroviaria; lo que sí puede ser estatal, autonómica o local es la red de carreteras.","transnacional.":"tampoco existe esa clasificación: los servicios de alta velocidad y las compañías privadas OUIGO e Iryo operan dentro de esas mismas categorías."},"source_page":88},{"id":"3672a00132","num":5061,"tarea":5,"type":"mc","question":"¿Qué está prohibido en la puerta de un colegio?","options":["Fumar un cigarrillo.","Conducir un coche.","Vender refrescos."],"answer_index":0,"explanation":"Entre las normas de los lugares públicos está la de no fumar cuando el lugar público está frente a un hospital o un centro educativo.","why_wrong":{"Conducir un coche.":"circular no está prohibido; lo que la normativa de tráfico fija en ciudad es el límite de velocidad, de 20, 30 o 50 km/h.","Vender refrescos.":"la venta de bebidas y alimentos se hace en comercios como supermercados o mercados municipales; la norma que existe es no consumirlos donde no esté permitido, no prohibir que se vendan."},"source_page":87},{"id":"e5026be9ae","num":5062,"tarea":5,"type":"mc","question":"¿Qué título se obtiene al finalizar un ciclo de grado medio de Formación Profesional?","options":["Bachiller.","Técnico.","Graduado en ESO."],"answer_index":1,"explanation":"Los ciclos formativos de Grado Medio duran dos cursos académicos y al completarlos se obtiene el título de Técnico, que permite incorporarse al mundo laboral o continuar con un ciclo de Grado Superior; para acceder hace falta el título de Graduado en Educación Secundaria Obligatoria (ESO) o el Título Profesional Básico.","why_wrong":{"Bachiller.":"el Bachillerato es la otra vía de los 16 a los 18 años, con dos cursos académicos, y su título da acceso a la educación superior tras la Prueba de Acceso a la Universidad.","Graduado en ESO.":"es el título de la segunda y última etapa obligatoria (de 12 a 16 años) y funciona como requisito de entrada al Grado Medio, no como resultado de este."},"source_page":77},{"id":"4a11f786de","num":5063,"tarea":5,"type":"mc","question":"¿Qué título se obtiene tras realizar una tesis doctoral en España?","options":["Máster.","Graduado.","Doctor."],"answer_index":2,"explanation":"El Doctorado es el tercer ciclo universitario, formación avanzada en técnicas de investigación, y el título de Doctor se obtiene tras superar un período de formación e investigación y elaborar y presentar la tesis doctoral.","why_wrong":{"Máster.":"es el segundo ciclo, de especialización académica o profesional, con entre 60 y 120 créditos según dure uno o dos años.","Graduado.":"es el título del Grado, primer ciclo universitario, con un mínimo de 240 créditos y unos cuatro años de duración."},"source_page":78},{"id":"e017988ddc","num":5064,"tarea":5,"type":"mc","question":"¿Dónde se compran las medicinas con receta?","options":["En el hospital.","En el centro de salud.","En la farmacia."],"answer_index":2,"explanation":"Las medicinas, con receta o sin ella, se venden en las farmacias, y algunas cuentan con ayuda económica de la Administración pública; el Ministerio de Sanidad y las comunidades autónomas financian parte de los medicamentos según la edad.","why_wrong":{"En el hospital.":"el hospital se dedica al internamiento clínico, a la asistencia especializada y a las urgencias.","En el centro de salud.":"en el centro de salud se presta la atención primaria y el médico de familia extiende la receta, para lo que hace falta la tarjeta sanitaria, pero el medicamento se dispensa en la farmacia."},"source_page":86},{"id":"1721503177","num":5065,"tarea":5,"type":"mc","question":"¿Cuál de estas tres recomendaciones podemos encontrar en un parque?","options":["No pisar el césped.","Se recomienda pagar el billete con el dinero justo.","Respetar las normas sobre equipaje."],"answer_index":0,"explanation":"Entre las normas de los parques, jardines e instalaciones deportivas figura no pisar el césped ni arrancar flores, junto con el respeto al mobiliario urbano y la colaboración con los agentes de seguridad.","why_wrong":{"Se recomienda pagar el billete con el dinero justo.":"es una recomendación del transporte público, concretamente del autobús.","Respetar las normas sobre equipaje.":"es otra de las normas de comportamiento en los transportes públicos, donde cada medio fija sus propias condiciones de equipaje."},"source_page":87,"source_quote":"3. Respetar los horarios de apertura y cierre de las instalaciones. 4. No consumir bebidas, ni alimentos, si no está permitido. 5. No fumar, en el caso de que el lugar público esté frente a un hospital o centro educativo. 6. No pisar el césped, ni arrancar flores. 7. Colaborar con los agentes de seguridad, si fuera necesario."},{"id":"960a946b05","num":5066,"tarea":5,"type":"mc","question":"¿Cuál de las siguientes cosas es obligatoria para el propietario de un coche en España?","options":["El garaje.","El seguro.","La alarma."],"answer_index":1,"explanation":"El propietario debe tener al día el seguro del coche, además de registrarlo y matricularlo, pasar la Inspección Técnica de Vehículos (ITV), pagar los impuestos anuales, tener el carné en vigor y no dejar conducir el coche a personas sin carné.","why_wrong":{"El garaje.":"no consta entre las obligaciones del propietario, que son de tipo registral, fiscal y de seguridad vial.","La alarma.":"tampoco: el equipamiento de seguridad que la normativa impone es el cinturón para todos los ocupantes y la silla portabebés."},"source_page":87},{"id":"0103c42c8a","num":5067,"tarea":5,"type":"mc","question":"El aeropuerto Adolfo Suárez está en...","options":["Barcelona.","Madrid.","Bilbao."],"answer_index":1,"explanation":"El Adolfo Suárez Madrid-Barajas es el aeropuerto de Madrid y el primero de los aeropuertos más importantes de España, país que cuenta con 48 aeropuertos públicos, muchos de ellos internacionales.","why_wrong":{"Barcelona.":"el aeropuerto de Barcelona se denomina Josep Tarradellas Barcelona-El Prat.","Bilbao.":"Bilbao no está entre los cuatro aeropuertos más importantes (Madrid, Barcelona, Palma de Mallorca y Málaga); destaca por su puerto y por ser una de las primeras ciudades con metro."},"source_page":89},{"id":"a08080a0ab","num":5068,"tarea":5,"type":"mc","question":"En un coche es obligatorio el uso del cinturón de seguridad...","options":["solo en el asiento del conductor.","en los asientos delanteros.","en todos los asientos."],"answer_index":2,"explanation":"El uso del cinturón de seguridad es obligatorio para todos los ocupantes del vehículo y, junto al control de velocidad y al de alcoholemia (límite de 0,5 g/l en sangre), explica la reducción de accidentes mortales de los últimos años.","why_wrong":{"solo en el asiento del conductor.":"la obligación no distingue entre quien conduce y quien viaja: alcanza a todos los ocupantes.","en los asientos delanteros.":"los asientos traseros también están incluidos, y para los niños se añade la normativa sobre el uso de la silla portabebés."},"source_page":87},{"id":"6520bd7dad","num":5069,"tarea":5,"type":"mc","question":"¿Cuál es el límite de velocidad en autopista?","options":["90 km/h.","120 km/h.","150 km/h."],"answer_index":1,"explanation":"El límite de velocidad es de 120 km/h en autopista o autovía, de 90 km/h en carretera convencional y de 20, 30 o 50 km/h dentro de la ciudad; su control es una de las causas del descenso de accidentes mortales.","why_wrong":{"90 km/h.":"esos 90 km/h son el límite de la carretera convencional, no de la autopista.","150 km/h.":"ninguna vía española tiene ese límite; 120 km/h es el máximo legal en todo el país."},"source_page":87},{"id":"b7b1b09c33","num":5070,"tarea":5,"type":"mc","question":"Ceder el asiento a las personas con movilidad reducida es una norma que encontramos indicada en...","options":["el transporte público.","las bibliotecas.","los museos."],"answer_index":0,"explanation":"Es una de las normas de comportamiento en los transportes públicos (metro, autobús, tranvía, taxi y trenes), y la cesión del asiento alcanza también a las personas mayores y a las embarazadas.","why_wrong":{"las bibliotecas.":"las bibliotecas son de acceso gratuito y ofrecen préstamo de libros, videoteca, sala de ordenadores y lugar de estudio; sus normas no tratan de asientos.","los museos.":"los museos ofrecen visitas virtuales o guiadas y talleres, y lo que sí tienen para determinados colectivos son precios reducidos, como para los mayores de 65 años."},"source_page":88,"source_quote":"5. Dejar salir antes de entrar. 6. No fumar. 7. Ceder el asiento a las personas mayores, con movilidad reducida o embarazadas. 8. No permanecer en los pasillos durante el viaje en autobuses y trenes, o en lugares de paso, ni permanecer en las puertas de acceso del transporte."},{"id":"7b7e66a74c","num":5071,"tarea":5,"type":"mc","question":"¿Cuál es el medio de transporte público que tiene una luz verde encendida si está libre?","options":["El autobús.","El taxi.","El tranvía."],"answer_index":1,"explanation":"Los taxis se pueden tomar en las paradas de taxis o en circulación cuando llevan una luz verde encendida o el cartel de «Libre»; su color depende de la ciudad y los precios varían de una zona a otra.","why_wrong":{"El autobús.":"el autobús tiene paradas y recorrido fijos, y en él se recomienda llevar el dinero justo del billete.","El tranvía.":"circula sobre vía fija dentro del sistema de transporte urbano, igual que el metro, y no se detiene a petición del usuario en cualquier punto."},"source_page":88},{"id":"bcac165d37","num":5072,"tarea":5,"type":"mc","question":"¿Qué debes hacer si tienes un perro?","options":["Pasearlo sin correa.","Ponerle un microchip y vacunarlo.","No recoger sus excrementos."],"answer_index":1,"explanation":"Los perros y los gatos deben registrarse obligatoriamente con un microchip electrónico, vacunarse y pasar revisiones veterinarias periódicas; todos los perros necesitan además un seguro de responsabilidad civil por daños a terceros.","why_wrong":{"Pasearlo sin correa.":"en la calle hay que cumplir las medidas de seguridad obligatorias, como la correa y el bozal.","No recoger sus excrementos.":"es justo lo contrario: existe la obligación de recoger los excrementos de las vías públicas y de los jardines como parte de la convivencia con el resto de ciudadanos."},"source_page":74},{"id":"ac815921c9","num":5073,"tarea":5,"type":"mc","question":"Los españoles necesitan el pasaporte para viajar a...","options":["Italia.","China.","Alemania."],"answer_index":1,"explanation":"El pasaporte es el documento oficial español para viajar a países que no pertenecen a la Unión Europea o que no forman parte del espacio Schengen, como China; dentro de ese espacio basta el Documento Nacional de Identidad (DNI), obligatorio para los españoles mayores de 14 años.","why_wrong":{"Italia.":"es Estado miembro de la Unión Europea y del espacio Schengen, de modo que no se exige pasaporte.","Alemania.":"también pertenece a la Unión Europea y a Schengen, así que el viaje se hace con el DNI."},"source_page":70},{"id":"690e45ed69","num":5074,"tarea":5,"type":"mc","question":"¿Cuál es la edad mínima para trabajar en España?","options":["16 años.","18 años.","21 años."],"answer_index":0,"explanation":"La edad mínima para trabajar en España es de 16 años, la misma desde la que una persona puede contarse como parada o desempleada si está sin trabajo pero disponible para ejercer uno.","why_wrong":{"18 años.":"los 18 años son la edad mínima para obtener el permiso de conducir y para acceder a los centros de educación de personas adultas, no para trabajar.","21 años.":"no marca ningún umbral laboral; la edad mínima son los 16 años, cuando termina además la educación básica obligatoria."},"source_page":90},{"id":"248f93007f","num":5075,"tarea":5,"type":"mc","question":"¿Cuál es el sector de mayor peso en la economía española?","options":["Agricultura.","Servicios.","Construcción."],"answer_index":1,"explanation":"El sector terciario, el de los servicios, ocupa el primer lugar de la economía española, seguido del secundario (industria y construcción) y, en tercer lugar, del primario (agricultura, pesca y ganadería).","why_wrong":{"Agricultura.":"forma parte del sector primario, el último en peso, junto con la pesca y la ganadería.","Construcción.":"pertenece al sector secundario, que ocupa el segundo lugar junto con la industria."},"source_page":89},{"id":"8c89ab0095","num":5076,"tarea":5,"type":"mc","question":"España es innovadora en el sector de...","options":["la ingeniería aeroespacial.","las energías renovables.","la energía nuclear."],"answer_index":1,"explanation":"España tiene una posición importante en innovación, con desarrollos destacados en energías renovables, en biotecnología, en el sector farmacéutico y de transportes y en las pequeñas y medianas industrias tecnológicas.","why_wrong":{"la ingeniería aeroespacial.":"es el ámbito de instalaciones como la Estación de Seguimiento de Satélites de Villafranca del Castillo, centro de la Agencia Espacial Europea (ESA), pero no uno de los sectores de innovación destacados de España.","la energía nuclear.":"tampoco: en materia energética la innovación española destaca en las energías renovables."},"source_page":90},{"id":"6ae3c491b0","num":5077,"tarea":5,"type":"mc","question":"¿Cómo se llama la ley laboral más importante de España?","options":["La Constitución.","El Estatuto de los Trabajadores.","El Servicio Público de Empleo Estatal."],"answer_index":1,"explanation":"El Estatuto de los Trabajadores es la ley laboral más importante; por debajo de ella, los convenios colectivos firmados entre la empresa y los sindicatos concretan las condiciones laborales.","why_wrong":{"La Constitución.":"es la norma suprema del ordenamiento y no una ley laboral; en materia de consumo, por ejemplo, es su artículo 51 el que garantiza los intereses de los consumidores.","El Servicio Público de Empleo Estatal.":"es un organismo administrativo relacionado con el empleo, no una norma jurídica."},"source_page":91},{"id":"7e20afdb65","num":5078,"tarea":5,"type":"mc","question":"¿Cuál de estos establecimientos está abierto 24 horas si es necesario?","options":["Farmacia.","Pescadería.","Librería."],"answer_index":0,"explanation":"Las farmacias tienen un horario mínimo establecido y un servicio de guardia para atender a los ciudadanos durante las 24 horas del día.","why_wrong":{"Pescadería.":"el pescado fresco se vende en los puestos de los mercados municipales, sujetos al horario comercial habitual.","Librería.":"las librerías-papelerías venden libros, material escolar y artículos de oficina, con el horario general de tiendas, de 10:00 a 14:00 y de 17:00 a 20:00."},"source_page":86},{"id":"bb48f7d4cb","num":5079,"tarea":5,"type":"mc","question":"La educación infantil en España...","options":["es obligatoria.","tiene dos ciclos.","empieza a los 4 años."],"answer_index":1,"explanation":"La Educación Infantil se divide en dos ciclos, el primero de 0 a 3 años y el segundo de 3 a 6 años; ese segundo ciclo no es obligatorio pero sí es gratuito.","why_wrong":{"es obligatoria.":"la enseñanza obligatoria empieza con la Educación Primaria, a los 6 años, y se extiende hasta los 16, al terminar la Educación Secundaria Obligatoria (ESO).","empieza a los 4 años.":"el primer ciclo arranca a los 0 años, en las escuelas infantiles, que atienden de 0 a 6 años con carácter voluntario."},"source_page":77},{"id":"47295b52b0","num":5080,"tarea":5,"type":"mc","question":"¿Cuándo empieza el calendario escolar?","options":["En agosto.","En septiembre.","En octubre."],"answer_index":1,"explanation":"El calendario escolar comienza en septiembre y termina en junio, y cada comunidad autónoma decide las fechas concretas de inicio y finalización de las clases; el calendario laboral, en cambio, va de enero a diciembre y recoge 14 días festivos.","why_wrong":{"En agosto.":"agosto forma parte del período vacacional de verano, que se sitúa entre julio y agosto.","En octubre.":"en octubre el curso ya está en marcha; lo que ese mes aporta al calendario es la Fiesta Nacional de España, el día 12."},"source_page":76},{"id":"7eaec2ccf5","num":5081,"tarea":5,"type":"mc","question":"Las Escuelas Oficiales de Idiomas...","options":["son centros de enseñanza privada.","son para mayores de 16 años.","dependen del Instituto Cervantes."],"answer_index":1,"explanation":"Las Escuelas Oficiales de Idiomas imparten la enseñanza de idiomas en los tres niveles del Marco Común Europeo de Referencia para las Lenguas y para acceder es requisito tener 16 años o más.","why_wrong":{"son centros de enseñanza privada.":"son enseñanzas de régimen especial dentro del sistema educativo, al mismo nivel que las artísticas y las deportivas.","dependen del Instituto Cervantes.":"las Escuelas Oficiales de Idiomas forman parte del sistema educativo español, a cargo del Ministerio de Educación, Formación Profesional y Deportes, mientras que el Instituto Cervantes se dedica a la difusión y promoción del español."},"source_page":78},{"id":"18417f45c8","num":5082,"tarea":5,"type":"mc","question":"¿Cuál es el documento que recoge los años de cotización a la Seguridad Social?","options":["Informe de vida laboral.","Recibo de finiquito.","Certificado de profesionalidad."],"answer_index":0,"explanation":"El informe de vida laboral muestra la cotización a la Seguridad Social y toda la trayectoria profesional: las empresas en las que se ha trabajado y las fechas y los tipos de los contratos. El número de la Seguridad Social, en cambio, se obtiene en la Tesorería General de la Seguridad Social al empezar a trabajar.","why_wrong":{"Recibo de finiquito.":"es el documento de liquidación que se firma al terminar un contrato concreto, no un historial de cotización.","Certificado de profesionalidad.":"acredita una cualificación profesional, es decir la formación o la experiencia en una ocupación, no los años cotizados."},"source_page":71},{"id":"336ac2b89c","num":5083,"tarea":5,"type":"mc","question":"Los convenios colectivos de una empresa son los que se firman con los representantes de los trabajadores sobre...","options":["las condiciones laborales.","el futuro de la empresa.","la relación con los clientes."],"answer_index":0,"explanation":"Los convenios colectivos son acuerdos sobre las condiciones laborales firmados entre la empresa y los representantes de los trabajadores, es decir los sindicatos; existe una Comisión Consultiva Nacional de Convenios Colectivos en la que están representadas la Administración General del Estado, las organizaciones sindicales y las asociaciones empresariales.","why_wrong":{"el futuro de la empresa.":"las decisiones estratégicas o de gestión corresponden a la dirección; el convenio se limita al marco laboral que desarrolla el Estatuto de los Trabajadores.","la relación con los clientes.":"eso pertenece al ámbito del consumo, del que se ocupan la Agencia Española de Consumo, Seguridad Alimentaria y Nutrición y el Consejo de Consumidores."},"source_page":91},{"id":"a0ddf3bc9c","num":5084,"tarea":5,"type":"mc","question":"¿En cuál de estos sectores destaca España?","options":["En el turismo.","En la industria automovilística.","En tecnología digital."],"answer_index":0,"explanation":"Según la Organización Mundial de Turismo, España es el tercer país del mundo en número de turistas extranjeros, y recibió 93,8 millones de turistas internacionales en 2023; el sector turístico es además un motor importante en el aumento de nuevos empleos.","why_wrong":{"En la industria automovilística.":"los automóviles son un producto de exportación, pero España también importa componentes del automóvil; sus empresas destacan en infraestructuras, telecomunicaciones, ferrocarril, finanzas y textil.","En tecnología digital.":"la fortaleza tecnológica española está en la innovación en biotecnología y en las pequeñas y medianas industrias tecnológicas, no en un sector digital destacado."},"source_page":90}];
const TN = {1:"Gobierno y legislación",2:"Derechos y deberes",3:"Organización territorial",
            4:"Cultura e historia",5:"Sociedad española"};
// Official structure: 25 questions in 45 minutes. This split matches both the
// published sample exam and the proportions of the bank itself (120/36/24/36/84).
const MIX = {1:10, 2:3, 3:2, 4:3, 5:7};
const NQ = Object.values(MIX).reduce((a,b)=>a+b,0);
const HK = "ccse_hist", TK = "ccse_theme";
// examenes.cervantes.es/es/ccse/calificaciones: 15 of 25 correct (60%) to pass,
// and wrong answers are NOT penalised.
const PASS = 15, LIMIT = 45*60*1000;
const app = document.getElementById("app"), foot = document.getElementById("foot"),
      footin = document.getElementById("footin");

const nrm = s => (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const ls = k => { try { return localStorage.getItem(k) } catch { return null } };
const lset = (k,v) => { try { localStorage.setItem(k,v) } catch {} };
const hist = () => { try { return JSON.parse(ls(HK)) || [] } catch { return [] } };
const save = h => lset(HK, JSON.stringify(h));
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]} return a };
const pct = (ok,tot) => tot ? Math.round(100*ok/tot) : 0;
const BANK = [1,2,3,4,5].map(t => ({t, n:Q.filter(q=>q.tarea===t).length}));
// Official question wording is never edited; titles of works are marked at render
// time from a verified span list, so «El amor brujo» reads as a title.
function marked(text, titles){
  let h = esc(text);
  for(const t of (titles||[])){
    const e = esc(t);
    if(h.includes(e)) h = h.split(e).join("«" + e + "»");
  }
  return h;
}
const fmt = ms => { const s = Math.max(0, Math.round(ms/1000));
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}` };
const median = xs => { if(!xs.length) return 0;
  const a = xs.slice().sort((x,y)=>x-y), m = a.length>>1;
  return a.length%2 ? a[m] : (a[m-1]+a[m])/2 };
// Continuous hue, but hinged on the official pass mark rather than linear 0-100:
// 0% is red, exactly 60% is amber, 100% is green. A straight ramp would make 59%
// and 61% look identical, and 60% is the only number that changes the verdict.
const PASS_PCT = Math.round(100 * PASS / NQ);
function barColor(p){
  const h = p <= PASS_PCT ? (p / PASS_PCT) * 45
                          : 45 + ((p - PASS_PCT) / (100 - PASS_PCT)) * 85;
  return `hsl(${Math.round(h)} 68% 45%)`;
}

/* ---------- per-question miss history, for Repasar fallos ---------- */
// Walk history in order so `last` is the most recent outcome per question.
function misses(){
  const m = {};
  for(const r of hist().slice().sort((x,y)=>(x.ts||0)-(y.ts||0)))
    for(const it of r.items){
      const e = m[it.id] = m[it.id] || {wrong:0, seen:0, last:true};
      e.seen++; if(!it.ok) e.wrong++;
      e.last = !!it.ok;
    }
  return m;
}
// Only what you got wrong MOST RECENTLY: answering it right retires it, so the
// list can actually reach zero instead of being a permanent scoreboard of old sins.
function failList(){
  const m = misses();
  return Q.filter(q => m[q.id] && !m[q.id].last)
          .sort((a,b) => (m[b.id].wrong - m[a.id].wrong) || Math.random() - 0.5);
}

/* ---------- clock: counts down in examen, up elsewhere ---------- */
let TICK = null;
function stopClock(){ if(TICK){ clearInterval(TICK); TICK = null } }
function startClock(){ stopClock(); TICK = setInterval(tickClock, 1000); tickClock() }
function tickClock(){
  if(!RUN || !RUN.t0){ stopClock(); return }
  const down = RUN.mode === "examen", gone = Date.now() - RUN.t0;
  if(down && gone >= LIMIT){ RUN.timeUp = true; stopClock(); return finish() }
  const el = document.getElementById("clock");
  if(!el) return;
  const left = down ? LIMIT - gone : gone;
  el.textContent = fmt(left);
  el.className = "clock" + (down && left < 5*60000 ? " crit"
                          : down && left < 10*60000 ? " warn" : "");
}

/* ---------- theme: one icon, cycles auto -> claro -> oscuro ---------- */
