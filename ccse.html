,"En el Portal de la Administración Electrónica (PAe).":"es la web oficial que reúne información, servicios y recursos sobre la transformación digital de la Administración, no un diario oficial."},"source_page":14},{"id":"53c9f713d6","num":1089,"tarea":1,"type":"mc","question":"¿Cómo se llaman los órganos de gobierno que solo existen en Canarias?","options":["Cabildos.","Consejos insulares.","Diputaciones."],"answer_index":0,"explanation":"Canarias y Baleares son las dos excepciones al modelo provincial: allí no hay diputación. En Canarias gobiernan los cabildos, uno por isla.","why_wrong":{"Consejos insulares.":"son los órganos de gobierno de las Islas Baleares, la otra comunidad insular.","Diputaciones.":"gobiernan las provincias del resto de España, salvo en las comunidades uniprovinciales, que no tienen diputación."},"source_page":14,"source_quote":"El órgano de gobierno de la provincia es la Diputación, excepto en Canarias e Islas Baleares. En Canarias los órganos de gobierno son los cabildos y en Baleares son los consejos insulares."},{"id":"9f66a0f989","num":1090,"tarea":1,"type":"mc","question":"¿Cuál de estos trámites administrativos puede realizarse en la sede electrónica?","options":["Tramitar el DNI.","Renovar el pasaporte.","Pagar los impuestos."],"answer_index":2,"explanation":"Cada ministerio u organismo tiene su sede electrónica, desde la que se puede presentar documentos, pagar impuestos o consultar expedientes las 24 horas. Para ello hace falta una identidad digital: el documento nacional de identidad (DNI) electrónico, un certificado digital o Cl@ve.","why_wrong":{"Tramitar el DNI.":"la expedición del documento nacional de identidad (DNI) corresponde a la Policía Nacional y exige acudir en persona.","Renovar el pasaporte.":"el pasaporte también lo expide la Policía Nacional, que además controla la entrada y salida del territorio nacional."},"source_page":14},{"id":"b81723d590","num":1091,"tarea":1,"type":"mc","question":"¿Cuál es el número de teléfono de información de la Administración General del Estado?","options":["010.","060.","091."],"answer_index":1,"explanation":"El 060 es el canal de atención telefónica de la Administración General del Estado; junto a él, el canal electrónico equivalente es el Portal de la Administración Electrónica (PAe). Las administraciones ofrecen atención presencial, telefónica y electrónica.","why_wrong":{"010.":"es el teléfono de información de los ayuntamientos, es decir, del nivel local, no del Estado.","091.":"es el número de emergencias de la Policía Nacional, un cuerpo de seguridad, no un servicio de información administrativa."},"source_page":14},{"id":"5e9c07bf79","num":1092,"tarea":1,"type":"mc","question":"España está organizada en...","options":["cantones.","comunidades autónomas.","estados federales."],"answer_index":1,"explanation":"Desde la Constitución de 1978 España se organiza en comunidades autónomas, provincias y municipios: 17 comunidades y 2 ciudades autónomas. La base de su formación fueron rasgos históricos, culturales y económicos comunes de provincias vecinas.","why_wrong":{"cantones.":"no es una división del territorio español; los tres niveles administrativos son central, autonómico y local.","estados federales.":"España no es un Estado federal, sino una monarquía parlamentaria y una patria común e indivisible en la que las comunidades tienen autonomía, no soberanía."},"source_page":12},{"id":"b761470159","num":1093,"tarea":1,"type":"mc","question":"¿Cuántos partidos políticos hay en España?","options":["Ninguno.","Uno.","Muchos."],"answer_index":2,"explanation":"España tiene un sistema pluripartidista: los ciudadanos eligen entre diversas opciones políticas en el ámbito nacional, autonómico y local. La Constitución reconoce los partidos en el artículo 6 y el pluralismo político es uno de sus valores superiores.","why_wrong":{"Ninguno.":"los partidos son asociaciones amparadas por la Constitución; sin ellos no habría elecciones con distintas candidaturas.","Uno.":"el partido único es propio de sistemas no democráticos; entre 1979 y 2024 los presidentes españoles pertenecieron a tres partidos distintos: Unión de Centro Democrático (UCD), Partido Socialista Obrero Español (PSOE) y Partido Popular (PP)."},"source_page":16},{"id":"370bc0d772","num":1094,"tarea":1,"type":"mc","question":"¿Dónde tiene lugar la investidura del presidente del Gobierno?","options":["En el Palacio de la Moncloa.","En el Congreso de los Diputados.","En el Senado."],"answer_index":1,"explanation":"El candidato lo propone el rey y el Congreso lo inviste; en esa misma cámara se debaten después las cuestiones de confianza y las mociones de censura. Ya nombrados, los miembros del Gobierno juran o prometen el cargo ante un ejemplar de la Constitución en presencia del rey.","why_wrong":{"En el Palacio de la Moncloa.":"es la residencia oficial del presidente del Gobierno, no una sede parlamentaria.","En el Senado.":"es la cámara de representación territorial, con 265 senadores en la actualidad, y no interviene en la investidura."},"source_page":9},{"id":"aa82751028","num":1095,"tarea":1,"type":"mc","question":"¿Quién tiene el mando supremo de las Fuerzas Armadas?","options":["El rey.","El presidente del Gobierno.","El ministro de Defensa."],"answer_index":0,"explanation":"Como jefe del Estado, el rey es la máxima autoridad de las Fuerzas Armadas, formadas por el Ejército de Tierra, el Ejército del Aire y la Armada. Es un mando simbólico: la dirección efectiva corresponde al Ministerio de Defensa.","why_wrong":{"El presidente del Gobierno.":"dirige la política interior y exterior y la Administración civil y militar, pero el mando supremo es del rey, que además nombra a los ministros a propuesta suya.","El ministro de Defensa.":"dirige las Fuerzas Armadas en el día a día, aunque no ostenta el mando supremo; el mando de los cuerpos de seguridad estatales corresponde en cambio al ministro del Interior."},"source_page":10},{"id":"ea0f3fbb48","num":1096,"tarea":1,"type":"mc","question":"¿Quién es el representante del Estado en una comunidad autónoma?","options":["El presidente de la comunidad autónoma.","El delegado del Gobierno.","El presidente de la Asamblea autonómica."],"answer_index":1,"explanation":"El delegado del Gobierno coordina y supervisa la acción de la Administración del Estado en el territorio autonómico, cooperando con el gobierno de la comunidad, y coordina los medios estatales en catástrofes o emergencias.","why_wrong":{"El presidente de la comunidad autónoma.":"representa a la comunidad, no al Estado, y además ejerce funciones ejecutivas al frente del consejo de gobierno.","El presidente de la Asamblea autonómica.":"dirige la asamblea legislativa o parlamento autonómico, elegido por votación popular en las elecciones autonómicas."},"source_page":13},{"id":"e92e6d6d96","num":1097,"tarea":1,"type":"mc","question":"¿Cuántas provincias hay en España?","options":["45.","50.","55."],"answer_index":1,"explanation":"A las 50 provincias hay que sumar las ciudades autónomas de Ceuta y Melilla, que no son provincias. Hay comunidades con varias provincias, como Galicia o Cataluña, y comunidades uniprovinciales, como Madrid, Murcia o La Rioja.","why_wrong":{"45.":"45 se queda corto: en el total de 50 cuentan también las comunidades uniprovinciales, como Madrid, Murcia o La Rioja, que son a la vez comunidad y provincia.","55.":"supera el total incluso contando Ceuta y Melilla, con lo que solo se llega a 52 entidades territoriales."},"source_page":13},{"id":"f57088e93a","num":1098,"tarea":1,"type":"mc","question":"La enseñanza de las lenguas cooficiales es competencia...","options":["del Estado.","de la comunidad autónoma.","de la provincia."],"answer_index":1,"explanation":"Cada Estatuto de Autonomía fija las competencias asumidas y, entre las más importantes, están la sanidad y la educación. Las lenguas cooficiales son oficiales solo en las comunidades donde se usan: gallego, euskera, catalán, aranés y valenciano.","why_wrong":{"del Estado.":"sus competencias exclusivas son otras: nacionalidad, extranjería, inmigración, relaciones internacionales y administración de justicia.","de la provincia.":"la provincia se gobierna mediante la diputación y no asume competencias educativas."},"source_page":7},{"id":"76af600340","num":1099,"tarea":1,"type":"mc","question":"El poder ejecutivo corresponde...","options":["al Gobierno del Estado.","al Congreso y al Senado.","a los jueces y magistrados."],"answer_index":0,"explanation":"El Gobierno tiene su sede en Madrid y está formado por el presidente, uno o varios vicepresidentes y los ministros; dirige la política interior y exterior, la Administración civil y militar y la defensa del Estado.","why_wrong":{"al Congreso y al Senado.":"son las dos cámaras de las Cortes Generales y ejercen el poder legislativo: elaboran y aprueban las leyes y los Presupuestos y controlan la acción del Gobierno.","a los jueces y magistrados.":"forman el poder judicial, cuya función es administrar justicia bajo el principio de unidad jurisdiccional."},"source_page":9},{"id":"3128121d9c","num":1100,"tarea":1,"type":"mc","question":"¿Cuántas cámaras hay en el Parlamento español?","options":["Una.","Dos.","Tres."],"answer_index":1,"explanation":"Las Cortes Generales, nombre oficial del Parlamento, se componen del Congreso de los Diputados (350 diputados elegidos por provincias) y del Senado (265 senadores en la actualidad), que es la cámara de representación territorial.","why_wrong":{"Una.":"un sistema de cámara única no permitiría la doble representación española, por población en el Congreso y por territorio en el Senado.","Tres.":"las asambleas legislativas autonómicas no son cámaras de las Cortes Generales: son instituciones propias de cada comunidad."},"source_page":9},{"id":"475663b2dc","num":1101,"tarea":1,"type":"mc","question":"El suministro de agua y el alumbrado de las ciudades es competencia de...","options":["el ayuntamiento.","el Gobierno autonómico.","el Ministerio de Obras Públicas y Urbanismo."],"answer_index":0,"explanation":"Entre las competencias municipales están el suministro de agua y la iluminación, además del urbanismo, el medio ambiente, el patrimonio histórico local y las instalaciones culturales y deportivas. Quien las gestiona es el alcalde con los concejales.","why_wrong":{"el Gobierno autonómico.":"asume las competencias de su Estatuto de Autonomía, entre las que destacan la sanidad y la educación.","el Ministerio de Obras Públicas y Urbanismo.":"el urbanismo aparece expresamente entre las competencias de los ayuntamientos, no de un ministerio del nivel central."},"source_page":14},{"id":"ec050821bf","num":1102,"tarea":1,"type":"mc","question":"En materias como nacionalidad, inmigración, emigración o extranjería solo tiene competencia...","options":["el Estado.","las comunidades autónomas.","los ayuntamientos."],"answer_index":0,"explanation":"Son competencias exclusivas del Estado, igual que las relaciones internacionales y la administración de justicia. Por eso los trámites de residencia y trabajo los gestiona la Policía Nacional, un cuerpo estatal.","why_wrong":{"las comunidades autónomas.":"sus competencias son las que recoge cada Estatuto de Autonomía, sobre todo sanidad y educación.","los ayuntamientos.":"gestionan servicios públicos locales como el agua, el alumbrado o el urbanismo, y sus miembros se eligen en las elecciones municipales."},"source_page":12},{"id":"b1090ea11b","num":1103,"tarea":1,"type":"mc","question":"¿Cuántas mujeres han sido presidentas de Gobierno en España?","options":["Ninguna.","Una.","Dos."],"answer_index":0,"explanation":"Desde la Constitución de 1978 hasta 2023 han ocupado la presidencia del Gobierno siete personas, todas hombres, de tres partidos: Unión de Centro Democrático (UCD), Partido Socialista Obrero Español (PSOE) y Partido Popular (PP).","why_wrong":{"Una.":"no ha habido ninguna: los siete presidentes, de Adolfo Suárez a Pedro Sánchez, han sido hombres.","Dos.":"confunde el Gobierno con la Corona, donde sí se permite reinar tanto a hombres como a mujeres."},"source_quote":"1979-1981 Adolfo Suárez; 1981-1982 Leopoldo Calvo-Sotelo; 1982-1996 Felipe González; 1996-2004 José María Aznar; 2004-2011 José Luis Rodríguez Zapatero; 2011-2018 Mariano Rajoy; 2018- Pedro Sánchez."},{"id":"be688c7afb","num":1104,"tarea":1,"type":"mc","question":"Las relaciones internacionales son competencia de...","options":["el Estado.","las comunidades autónomas.","los ayuntamientos."],"answer_index":0,"explanation":"Es una de las competencias exclusivas del Estado, junto con nacionalidad, extranjería, inmigración y administración de justicia. En ese ámbito, España pertenece a la Unión Europea desde el 1 de enero de 1986 y también a la Organización de las Naciones Unidas (ONU), el Consejo de Europa, la Organización del Tratado del Atlántico Norte (OTAN), el Fondo Monetario Internacional (FMI) y el Banco Mundial.","why_wrong":{"las comunidades autónomas.":"actúan dentro de su territorio con las competencias de su Estatuto, y quien coordina allí la acción del Estado es el delegado del Gobierno.","los ayuntamientos.":"su ámbito es el municipio: servicios públicos locales, patrimonio histórico, medio ambiente y urbanismo."},"source_page":12},{"id":"94d72911c4","num":1105,"tarea":1,"type":"mc","question":"El Ayuntamiento está formado por el alcalde y...","options":["los concejales.","los diputados.","los senadores."],"answer_index":0,"explanation":"Los concejales se eligen en las elecciones municipales por los habitantes de la localidad y gestionan los servicios públicos del pueblo o la ciudad. En España hay 8132 municipios.","why_wrong":{"los diputados.":"son los 350 miembros del Congreso de los Diputados y se eligen por provincias en las elecciones generales.","los senadores.":"forman el Senado, la cámara de representación territorial; la mayoría los eligen los ciudadanos y el resto las comunidades autónomas."},"source_page":14},{"id":"c37a063f8c","num":1106,"tarea":1,"type":"mc","question":"¿Quiénes forman el gobierno de las comunidades autónomas?","options":["El presidente y los ministros.","El alcalde y los concejales.","El presidente y los consejeros."],"answer_index":2,"explanation":"El consejo de gobierno autonómico tiene las funciones ejecutivas y lo encabeza el presidente, que además representa a la comunidad. La otra institución autonómica es la asamblea legislativa, elegida en las elecciones autonómicas.","why_wrong":{"El presidente y los ministros.":"esa es la composición del Gobierno del Estado, con sede en Madrid, donde hay además uno o varios vicepresidentes.","El alcalde y los concejales.":"forman el ayuntamiento, órgano de gobierno del municipio, no de la comunidad."},"source_page":13},{"id":"43419af1b7","num":1107,"tarea":1,"type":"mc","question":"¿Cuál es el órgano de gobierno en los municipios?","options":["El ayuntamiento.","La diputación.","El cabildo."],"answer_index":0,"explanation":"Existen 8132 municipios en España y en cada uno el ayuntamiento, con el alcalde y los concejales, gestiona los servicios públicos. El municipio pertenece, con la provincia, al nivel local de la Administración.","why_wrong":{"La diputación.":"es el órgano de gobierno de la provincia, y las comunidades uniprovinciales no la tienen.","El cabildo.":"es el órgano de gobierno insular propio de Canarias."},"source_page":14},{"id":"727ef0617a","num":1108,"tarea":1,"type":"mc","question":"¿Cómo se llaman los órganos de gobierno de las provincias españolas?","options":["Cabildos.","Consejos insulares.","Diputaciones."],"answer_index":2,"explanation":"La diputación gobierna la provincia en todo el territorio salvo en Canarias y Baleares, y las comunidades de una sola provincia (Madrid, Murcia, La Rioja) no tienen diputación. Hay 50 provincias más Ceuta y Melilla.","why_wrong":{"Cabildos.":"son los órganos de gobierno de las islas de Canarias.","Consejos insulares.":"cumplen esa misma función insular, pero en las Islas Baleares."},"source_page":14},{"id":"4928c68d2f","num":1109,"tarea":1,"type":"mc","question":"¿Cuál es el órgano superior del poder ejecutivo?","options":["El Gobierno.","Las Fuerzas Armadas.","Las Cortes Generales."],"answer_index":0,"explanation":"El Gobierno dirige la política interior y exterior, la Administración civil y militar y la defensa del Estado, y lo integran el presidente, los vicepresidentes y los ministros. La Constitución separa los poderes ejecutivo, legislativo y judicial.","why_wrong":{"Las Fuerzas Armadas.":"son el Ejército de Tierra, el Ejército del Aire y la Armada; garantizan la independencia y la integridad territorial, dirigidas por el Ministerio de Defensa.","Las Cortes Generales.":"son el Parlamento y ejercen el poder legislativo; entre sus funciones está controlar la acción del Gobierno."},"source_page":9},{"id":"9aacffbcf8","num":1110,"tarea":1,"type":"mc","question":"El idioma español también se llama...","options":["aragonés.","castellano.","leonés."],"answer_index":1,"explanation":"La Constitución dice que el castellano es la lengua oficial de España: todos los españoles tienen el derecho de usarla y el deber de conocerla. Su organismo de normalización es la Real Academia Española (RAE) y su difusión corresponde al Instituto Cervantes.","why_wrong":{"aragonés.":"Aragón no figura entre las comunidades con lengua cooficial: solo lo son Galicia, Navarra, País Vasco, Cataluña, Baleares y la Comunidad Valenciana.","leonés.":"en Castilla y León la única lengua oficial es el castellano; el leonés no es lengua oficial ni tiene organismo de normalización."},"source_page":7},{"id":"bbce005a8b","num":1111,"tarea":1,"type":"mc","question":"¿A quiénes se elige en las elecciones al Parlamento Europeo?","options":["A los ministros europeos.","A los consejeros delegados.","A los eurodiputados."],"answer_index":2,"explanation":"Las elecciones europeas se celebran cada cinco años en toda la Unión Europea (UE), a diferencia de las generales, autonómicas y municipales, que se convocan cada cuatro. España forma parte de la Unión desde el 1 de enero de 1986.","why_wrong":{"A los ministros europeos.":"los ministros no se eligen en las urnas: los nombra el rey a propuesta del presidente del Gobierno, y forman parte del Gobierno de España.","A los consejeros delegados.":"el consejero delegado es un cargo directivo de una empresa, no un representante que se elija en unas elecciones."},"source_page":16},{"id":"b9c077ed5a","num":1112,"tarea":1,"type":"mc","question":"Los españoles pueden votar a partir de los...","options":["16 años.","18 años.","21 años."],"answer_index":1,"explanation":"A los 18 años los españoles son a la vez electores y elegibles, mediante sufragio universal, libre, igual, directo y secreto. Las elecciones las convoca el rey.","why_wrong":{"16 años.":"a esa edad todavía no se alcanza la mayoría de edad, y el voto corresponde a los españoles mayores de edad.","21 años.":"fijaría la barrera tres años por encima de la mayoría de edad y excluiría a votantes que sí son electores y elegibles."},"source_page":16},{"id":"c74e9313be","num":1113,"tarea":1,"type":"mc","question":"Algunos ciudadanos extranjeros pueden votar en las elecciones...","options":["municipales.","autonómicas.","generales."],"answer_index":0,"explanation":"Pueden votar los residentes en España procedentes de la Unión Europea y de algunos países con los que España tiene acuerdos firmados. En esas elecciones se eligen los concejales de los ayuntamientos.","why_wrong":{"autonómicas.":"en ellas se eligen los miembros de las asambleas y parlamentos autonómicos, y el voto queda reservado a los españoles mayores de 18 años.","generales.":"sirven para elegir a los diputados del Congreso y a los senadores, y solo votan los españoles."},"source_page":16},{"id":"26e2383a67","num":1114,"tarea":1,"type":"mc","question":"¿Quién controla la gestión financiera del Estado?","options":["El Banco de España.","La Agencia Tributaria.","El Tribunal de Cuentas."],"answer_index":2,"explanation":"Fiscaliza las finanzas y el presupuesto de las administraciones y también la contabilidad de los partidos políticos. Depende de las Cortes Generales, igual que el Defensor del Pueblo, y no del Gobierno.","why_wrong":{"El Banco de España.":"el Banco de España es uno de los organismos que dependen de un ministerio, no un órgano de las Cortes encargado de fiscalizar las cuentas públicas.","La Agencia Tributaria.":"recauda los impuestos y aplica el sistema tributario, y depende del Ministerio de Hacienda y Función Pública, es decir, es parte de la Administración controlada."},"source_page":12},{"id":"87bf1f3cbb","num":1115,"tarea":1,"type":"mc","question":"¿A quiénes se elige en las elecciones generales?","options":["A los senadores y diputados.","A los eurodiputados.","A los concejales."],"answer_index":0,"explanation":"Las generales se convocan cada cuatro años y renuevan las dos cámaras de las Cortes: los 350 diputados del Congreso y la mayoría de los senadores, ya que el resto los designan las comunidades autónomas.","why_wrong":{"A los eurodiputados.":"se eligen en las elecciones europeas, que se celebran cada cinco años en toda la Unión Europea.","A los concejales.":"se eligen en las elecciones municipales, por los habitantes de cada localidad, y forman el ayuntamiento con el alcalde."},"source_page":16},{"id":"002e452f1e","num":1116,"tarea":1,"type":"mc","question":"¿Cuántos miembros tiene el Congreso de los Diputados?","options":["300.","350.","400."],"answer_index":1,"explanation":"Los 350 diputados se eligen por provincias. Es una cifra fija, mientras que el número de senadores puede variar: en la actualidad hay 265.","why_wrong":{"300.":"no corresponde a ninguna de las dos cámaras; queda por encima de los 265 senadores y por debajo de los 350 diputados.","400.":"sobrepasa el tamaño del Congreso; ninguna cámara española llega a esa cifra."},"source_page":9},{"id":"34a2640a8b","num":1117,"tarea":1,"type":"mc","question":"Los municipios y provincias forman parte de la Administración...","options":["autonómica.","local.","central."],"answer_index":1,"explanation":"La Administración tiene tres niveles: central (del Estado), autonómica y local, y en el local se incluyen provincias y municipios. Cada nivel tiene autonomía para gestionar sus propios intereses.","why_wrong":{"autonómica.":"es el nivel de las 17 comunidades y 2 ciudades autónomas, con su asamblea legislativa, su consejo de gobierno y su presidente.","central.":"es el nivel del Estado, con competencias exclusivas como nacionalidad, extranjería o relaciones internacionales."},"source_page":12},{"id":"a355dfcc39","num":1118,"tarea":1,"type":"mc","question":"La comunidad autónoma más poblada de España es...","options":["Andalucía.","Cataluña.","Castilla y León."],"answer_index":0,"explanation":"Andalucía supera los 8,6 millones de habitantes y es la comunidad autónoma más poblada; España en su conjunto tenía en 2025 más de 49 millones de habitantes y es el cuarto país más poblado de la Unión Europea (UE).","why_wrong":{"Cataluña.":"es la segunda más poblada, con algo más de 8 millones, unos 600 000 habitantes por debajo de Andalucía.","Castilla y León.":"ronda los 2,4 millones de habitantes, muy lejos del primer puesto, aunque es una comunidad de gran extensión con varias provincias."},"source_page":16,"source_quote":"Andalucía 8 631 862; Cataluña 8 012 231; Madrid 7 009 268; Comunidad Valencia 5 319 285; Castilla y León 2 391 682."},{"id":"2567fb715e","num":1119,"tarea":1,"type":"mc","question":"¿Cómo se llama la organización que defiende los intereses de los trabajadores?","options":["Asociación.","Partido.","Sindicato."],"answer_index":2,"explanation":"Los sindicatos aparecen en los artículos 7 y 28 de la Constitución. Los más representativos negocian con empresarios y gobiernos y participan en el Consejo Económico y Social, órgano consultivo económico del Gobierno.","why_wrong":{"Asociación.":"es la figura general del artículo 22 de la Constitución, que obliga a todas las asociaciones a inscribirse en un registro; no defiende específicamente a los trabajadores.","Partido.":"los partidos políticos están en el artículo 6 de la Constitución y ofrecen opciones políticas a los ciudadanos en las elecciones."},"source_page":17},{"id":"cb0e8b543e","num":1120,"tarea":1,"type":"mc","question":"¿Quién elige al presidente del Gobierno?","options":["El Congreso de los Diputados.","El rey.","El Tribunal Supremo."],"answer_index":0,"explanation":"La investidura se celebra en el Congreso sobre un candidato propuesto por el rey, y esa misma cámara puede retirarle la confianza mediante una moción de censura.","why_wrong":{"El rey.":"propone al candidato y nombra a los ministros a propuesta del presidente, pero no elige: su papel es mediar y garantizar el funcionamiento de las instituciones.","El Tribunal Supremo.":"pertenece al poder judicial, formado por jueces y magistrados que administran justicia, ajeno a la formación del Gobierno."},"source_page":9},{"id":"ae6d530de2","num":2001,"tarea":2,"type":"tf","question":"En España, la Constitución obliga a todos los ciudadanos a practicar una religión.","options":["Verdadero.","Falso."],"answer_index":1,"explanation":"El artículo 16 de la Constitución solo garantiza la libertad ideológica y religiosa: practicar una religión es un derecho, nunca un deber, y España es un Estado aconfesional sin religión oficial.","why_wrong":{"Verdadero.":"Ninguna norma constitucional impone practicar culto alguno; la Constitución protege tanto creer como no creer."},"source_page":29},{"id":"4504e69f9c","num":2002,"tarea":2,"type":"tf","question":"Los españoles que obtienen la nacionalidad por residencia deben esperar tres años para poder votar en las elecciones.","options":["Verdadero.","Falso."],"answer_index":1,"explanation":"El derecho de voto (artículo 23 de la Constitución) corresponde a todos los españoles mayores de 18 años que no lo hayan perdido por sentencia judicial, sin ningún periodo de espera tras adquirir la nacionalidad.","why_wrong":{"Verdadero.":"El plazo de tres años no existe: se confunde con los plazos de residencia previos a obtener la nacionalidad, que nada tienen que ver con el voto."},"source_page":30},{"id":"0dc1b05e06","num":2003,"tarea":2,"type":"tf","question":"En España, la Constitución prohíbe la tortura y la pena de muerte.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"Lo hace el artículo 15 de la Constitución, junto con el derecho a la vida y a la integridad física y moral: se elimina la pena de muerte y se prohíbe la tortura.","why_wrong":{"Falso.":"Sería falso solo si la Constitución las admitiera; el artículo 15 las suprime sin excepciones."},"source_page":29},{"id":"becd93496b","num":2004,"tarea":2,"type":"tf","question":"El funcionamiento de los partidos políticos tiene que ser democrático.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"El artículo 6 de la Constitución exige que la estructura y el funcionamiento de los partidos sean democráticos; su creación es libre, pero siempre dentro del respeto a la Constitución y a la ley.","why_wrong":{"Falso.":"Si el funcionamiento pudiera no ser democrático, los partidos dejarían de expresar el pluralismo político de acuerdo con la voluntad popular."},"source_page":28},{"id":"3b5f771120","num":2005,"tarea":2,"type":"tf","question":"Se puede obligar a alguien a decir cuáles son sus ideas políticas o religiosas.","options":["Verdadero.","Falso."],"answer_index":1,"explanation":"Lo prohíbe el artículo 16.2 de la Constitución: nadie puede ser obligado a declarar sus ideas políticas o religiosas, garantía que acompaña a la libertad ideológica y religiosa.","why_wrong":{"Verdadero.":"Ni la policía ni ninguna autoridad puede exigir esa declaración; no hay supuesto en que sea lícito obligar."},"source_page":29},{"id":"057022658f","num":2006,"tarea":2,"type":"tf","question":"Se puede limitar a una persona el derecho a entrar y salir libremente de España por motivos ideológicos.","options":["Verdadero.","Falso."],"answer_index":1,"explanation":"Es falso por el motivo alegado, «por motivos ideológicos»: el artículo 19 de la Constitución permite entrar y salir de España sin que ese derecho pueda limitarse por motivos políticos o ideológicos.","why_wrong":{"Verdadero.":"Aceptar ese límite contradice el artículo 19 de la Constitución, que excluye precisamente esas razones."},"source_page":29},{"id":"ca139e6a92","num":2007,"tarea":2,"type":"tf","question":"La Educación Primaria (de 6 a 12 años) es gratuita y obligatoria.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"El artículo 27.4 de la Constitución declara la enseñanza básica obligatoria y gratuita, y la Primaria de 6 a 12 años es su primera etapa; la segunda es la Secundaria Obligatoria, de 12 a 16 años.","why_wrong":{"Falso.":"No es opcional ni de pago: la obligatoriedad y la gratuidad de la enseñanza básica están en la propia Constitución."},"source_page":30,"source_quote":"«La enseñanza básica es obligatoria y gratuita. Consta de dos etapas: Educación Primaria (de 6 a 12 años) y Educación Secundaria Obligatoria (de 12 a 16 años)»."},{"id":"ef355c4990","num":2008,"tarea":2,"type":"tf","question":"La Constitución garantiza el derecho de los españoles a una vivienda digna.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"El artículo 47 de la Constitución reconoce a todos los españoles el derecho a una vivienda digna y adecuada, junto a otros derechos sociales como el acceso a la Seguridad Social (artículo 41) o a un medio ambiente adecuado (artículo 45).","why_wrong":{"Falso.":"El derecho figura expresamente entre los que enumera la Constitución, no está ausente del texto."},"source_page":31},{"id":"af480b0757","num":2009,"tarea":2,"type":"tf","question":"En España la policía puede entrar en cualquier casa sin resolución judicial en cualquier momento.","options":["Verdadero.","Falso."],"answer_index":1,"explanation":"Es falso por «sin resolución judicial en cualquier momento»: el artículo 18.2 de la Constitución declara el domicilio inviolable y la policía solo puede entrar con autorización judicial o cuando se esté cometiendo un delito, además del permiso del titular.","why_wrong":{"Verdadero.":"Admitir la entrada libre borraría la inviolabilidad del domicilio, que exige permiso del titular, autorización judicial o delito en curso."},"source_page":29},{"id":"e172664a7f","num":2010,"tarea":2,"type":"tf","question":"Se garantiza el secreto de las comunicaciones de los españoles, salvo resolución judicial.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"Así lo fija el artículo 18.3 de la Constitución, que protege en especial las comunicaciones postales, telegráficas y telefónicas, con la única excepción de que exista resolución judicial.","why_wrong":{"Falso.":"Negarlo supondría un secreto absoluto o inexistente; la Constitución lo garantiza, pero cede ante el juez."},"source_page":29},{"id":"71617e7f70","num":2011,"tarea":2,"type":"tf","question":"La Constitución reconoce el derecho de los ciudadanos a asociarse libremente.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"El artículo 22 de la Constitución reconoce el derecho de asociación, con el único límite de que están prohibidas las asociaciones con fines ilegales.","why_wrong":{"Falso.":"El derecho está reconocido; lo vetado son las finalidades ilegales, no asociarse en sí."},"source_page":30},{"id":"ecc6093fd5","num":2012,"tarea":2,"type":"tf","question":"Los profesores pueden enseñar con libertad, dentro de los límites de la Constitución.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"El artículo 20.1.c de la Constitución protege que los profesores impartan sus enseñanzas con libertad, y el 20.2 añade que estas libertades no tienen censura, con el límite del respeto a los derechos reconocidos, sobre todo el honor y la intimidad.","why_wrong":{"Falso.":"No existe censura de la docencia; negar esa libertad contradice el artículo 20 de la Constitución."},"source_page":29},{"id":"c99af9d40a","num":2013,"tarea":2,"type":"tf","question":"La Constitución reconoce únicamente los derechos fundamentales de los españoles.","options":["Verdadero.","Falso."],"answer_index":1,"explanation":"Es falso por «únicamente los derechos fundamentales de los españoles»: la Constitución de 1978 recoge los derechos, deberes y libertades de los españoles dentro y fuera de España y también de los residentes extranjeros.","why_wrong":{"Verdadero.":"Leerlo como exclusivo de los españoles dejaría fuera a los extranjeros residentes, a quienes la Constitución ampara expresamente."},"source_page":28},{"id":"e6a079bb29","num":2014,"tarea":2,"type":"tf","question":"Los ciudadanos deben colaborar con los jueces si se lo piden.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"El artículo 118 de la Constitución impone cumplir las sentencias de jueces y tribunales y colaborar con ellos cuando lo pidan; es un deber, no una opción.","why_wrong":{"Falso.":"Tomarlo por voluntario ignora ese deber constitucional de colaboración con la justicia."},"source_page":32},{"id":"714081b469","num":2015,"tarea":2,"type":"tf","question":"La ley limita el acceso de terceras personas a datos de carácter personal.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"El artículo 18.4 de la Constitución limita el uso de la informática para garantizar el honor y la intimidad, y limita también el acceso de terceras personas a datos de carácter personal.","why_wrong":{"Falso.":"Si ese acceso fuera libre, quedaría sin protección la intimidad que el mismo artículo tutela."},"source_page":29},{"id":"710388cf12","num":2016,"tarea":2,"type":"tf","question":"La libertad de prensa está limitada por el respeto al honor de las personas.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"El artículo 20.2 de la Constitución establece que estas libertades no tienen ningún tipo de censura, pero su único límite es el respeto a los derechos reconocidos y, en especial, el honor, la intimidad, la propia imagen y la protección de la juventud y la infancia.","why_wrong":{"Falso.":"La libertad de prensa no es ilimitada: informar no autoriza a lesionar el honor ajeno."},"source_page":29,"source_quote":"«Su único límite es el respeto a los derechos reconocidos a los españoles y, especialmente, el derecho al honor, a la intimidad, a la propia imagen y a la protección de la juventud y de la infancia»."},{"id":"998ada07b8","num":2017,"tarea":2,"type":"tf","question":"En España las causas de separación y divorcio están reguladas por la ley.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"El artículo 32.1 remite a la ley la regulación de las formas de matrimonio, la edad y capacidad para contraerlo, los derechos y deberes de los cónyuges y las causas de separación y divorcio con sus efectos.","why_wrong":{"Falso.":"No queda al arbitrio de los cónyuges: es la ley la que lo regula, y fija además los 16 años como edad mínima para casarse."},"source_page":31},{"id":"684b4223da","num":2018,"tarea":2,"type":"tf","question":"La atención sanitaria gratuita es solo para personas mayores de 65 años.","options":["Verdadero.","Falso."],"answer_index":1,"explanation":"Es falso por «solo para personas mayores de 65 años»: el artículo 41 de la Constitución abre el sistema público de Seguridad Social a todos los ciudadanos, con atención en situaciones de necesidad y sin límite de edad.","why_wrong":{"Verdadero.":"Restringirlo a los mayores de 65 años excluiría a menores, trabajadores y parados, a quienes el artículo 41 de la Constitución protege de forma expresa."},"source_page":31},{"id":"0adc85d472","num":2019,"tarea":2,"type":"tf","question":"En España los hombres y las mujeres tienen los mismos derechos.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"El artículo 14 proclama que los españoles son iguales ante la ley y que no podrá existir discriminación por nacimiento, raza, sexo, religión o cualquier otra circunstancia personal o social.","why_wrong":{"Falso.":"Sostener lo contrario choca con esa igualdad ante la ley, que menciona el sexo entre las causas prohibidas."}},{"id":"b10622b6be","num":2020,"tarea":2,"type":"tf","question":"La enseñanza obligatoria consta de dos etapas: Educación Primaria y Educación Secundaria Obligatoria.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"El artículo 27.4 de la Constitución concreta esas dos etapas: Educación Primaria, de 6 a 12 años, y Educación Secundaria Obligatoria, de 12 a 16 años, ambas obligatorias y gratuitas.","why_wrong":{"Falso.":"No hay una tercera etapa obligatoria: Bachillerato y Formación Profesional quedan fuera de la enseñanza básica."},"source_page":30,"source_quote":"«Consta de dos etapas: Educación Primaria (de 6 a 12 años) y Educación Secundaria Obligatoria (de 12 a 16 años)»."},{"id":"cac19e4c43","num":2021,"tarea":2,"type":"tf","question":"En España hay una religión oficial.","options":["Verdadero.","Falso."],"answer_index":1,"explanation":"El artículo 16.3 de la Constitución afirma que no hay ninguna religión oficial y que por eso España es un Estado aconfesional.","why_wrong":{"Verdadero.":"Aunque el catolicismo sea mayoritario, ninguna confesión tiene carácter oficial en el Estado español."},"source_page":29},{"id":"9334db0cc2","num":2022,"tarea":2,"type":"tf","question":"La atención sanitaria pública es gratuita.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"La asistencia sanitaria se presta a través del Sistema Nacional de Salud, formado por los servicios y prestaciones que garantizan los poderes públicos, y para acceder a ella basta con la tarjeta sanitaria. El artículo 43 de la Constitución obliga a los poderes públicos a proteger la salud y a promover la educación sanitaria.","why_wrong":{"Falso.":"Tratarla como un servicio de pago desconoce ese deber de los poderes públicos de proteger la salud."}},{"id":"228d31edcf","num":2023,"tarea":2,"type":"tf","question":"La enseñanza básica en España es solo para los extranjeros.","options":["Verdadero.","Falso."],"answer_index":1,"explanation":"Es falso por «solo para los extranjeros»: el artículo 27 de la Constitución reconoce a todos el derecho a la educación y hace la enseñanza básica obligatoria y gratuita de los 6 a los 16 años, para españoles y extranjeros por igual.","why_wrong":{"Verdadero.":"Reservarla a los extranjeros dejaría fuera a los españoles, para quienes esa enseñanza es además un deber."},"source_page":30},{"id":"50f8aa5b5a","num":2024,"tarea":2,"type":"tf","question":"En España está reconocido el derecho de asociación.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"El artículo 22 de la Constitución lo reconoce y solo excluye las asociaciones con fines ilegales; el artículo 28 añade el derecho a pertenecer a cualquier sindicato.","why_wrong":{"Falso.":"El derecho tiene rango constitucional; negarlo dejaría sin base a partidos, sindicatos y asociaciones civiles."},"source_page":30},{"id":"49e3901c54","num":2025,"tarea":2,"type":"tf","question":"Los sindicatos pueden participar en negociaciones con empresarios y con el Gobierno.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"El artículo 37 de la Constitución garantiza la negociación colectiva laboral entre los representantes de los trabajadores y los empresarios y el cumplimiento de los convenios; el artículo 28 de la Constitución añade el derecho a pertenecer a cualquier sindicato y a la huelga.","why_wrong":{"Falso.":"Excluir esa participación vaciaría la negociación colectiva que la ley debe garantizar."}},{"id":"e0ca9ae5ac","num":2026,"tarea":2,"type":"tf","question":"Los trabajadores tienen derecho a hacer huelga.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"El artículo 28.2 de la Constitución reconoce el derecho de huelga de los trabajadores para defender sus intereses, con la exigencia de mantener los servicios mínimos a la comunidad mientras dure.","why_wrong":{"Falso.":"La huelga no está prohibida; lo que se le impone es respetar esos servicios mínimos."},"source_page":30},{"id":"e69f943b5f","num":2027,"tarea":2,"type":"tf","question":"La libertad ideológica está garantizada solo en parte del territorio nacional.","options":["Verdadero.","Falso."],"answer_index":1,"explanation":"Es falso por «solo en parte del territorio nacional»: el artículo 16.1 de la Constitución garantiza la libertad ideológica y religiosa de los individuos y las comunidades, sin distinción territorial alguna.","why_wrong":{"Verdadero.":"Una garantía distinta según la zona chocaría con la igualdad ante la ley del artículo 14 y con el propio artículo 16."},"source_page":29},{"id":"d166b28ddd","num":2028,"tarea":2,"type":"tf","question":"Todos los ciudadanos tienen acceso al sistema de Seguridad Social público, excepto si están desempleados.","options":["Verdadero.","Falso."],"answer_index":1,"explanation":"Es falso por la coletilla «excepto si están desempleados»: el artículo 41 de la Constitución garantiza atención en situaciones de necesidad y menciona especialmente a los que no tienen trabajo.","why_wrong":{"Verdadero.":"Excluir a los desempleados invierte el sentido del artículo 41 de la Constitución, que los señala como destinatarios preferentes."},"source_page":31},{"id":"cc7203ec7d","num":2029,"tarea":2,"type":"tf","question":"Todos tienen derecho a disfrutar de un medio ambiente adecuado para el desarrollo de la persona, así como el deber de conservarlo.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"Es el artículo 45 de la Constitución, que reconoce a la vez un derecho y un deber: disfrutar de un medio ambiente adecuado y conservarlo. La protección del medio ambiente es además una de las competencias de los ayuntamientos.","why_wrong":{"Falso.":"No es solo un derecho ni solo un deber: la Constitución recoge las dos caras en el mismo artículo."},"source_page":31},{"id":"a5524fce07","num":2030,"tarea":2,"type":"tf","question":"En España, los poderes públicos deben proteger la salud y promover el deporte.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"El artículo 43 de la Constitución encarga a los poderes públicos proteger la salud y promover la educación sanitaria, la educación física y el deporte.","why_wrong":{"Falso.":"El deporte no queda al margen: ese mismo artículo lo incluye entre lo que los poderes públicos deben promover."},"source_page":31},{"id":"4d83c488dd","num":2031,"tarea":2,"type":"tf","question":"La enseñanza básica en España es obligatoria y gratuita.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"Lo dice el artículo 27.4 de la Constitución, que además precisa que abarca dos etapas, de los 6 a los 12 años y de los 12 a los 16 años.","why_wrong":{"Falso.":"Ni es voluntaria ni de pago en esas etapas; la libertad de enseñanza del artículo 27.1 de la Constitución no elimina esa obligatoriedad."},"source_page":30},{"id":"a56cd23264","num":2032,"tarea":2,"type":"tf","question":"La ley prohíbe la discriminación por cualquier circunstancia personal o social.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"El artículo 14 de la Constitución prohíbe la discriminación por nacimiento, raza, sexo, religión o cualquier otra condición o circunstancia personal o social, una fórmula abierta que cubre supuestos no enumerados.","why_wrong":{"Falso.":"La lista del artículo 14 de la Constitución no es cerrada, así que no cabe entender que solo protege frente a unas pocas causas."},"source_page":28,"source_quote":"«Los españoles son iguales ante la ley y no podrá existir discriminación por su nacimiento, raza, sexo, religión o cualquier otra condición o circunstancia personal o social»."},{"id":"96c61be6d6","num":2033,"tarea":2,"type":"tf","question":"En España, los ciudadanos pueden desplazarse libremente por todo el territorio nacional.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"El artículo 19 de la Constitución reconoce la libre circulación por todo el territorio español y el derecho de entrar y salir, sin que pueda limitarse por motivos políticos o ideológicos.","why_wrong":{"Falso.":"No hay zonas del país vedadas al ciudadano ni permisos internos de desplazamiento."},"source_page":29},{"id":"c1a1be0864","num":2034,"tarea":2,"type":"tf","question":"Los jueces administran la justicia en España según las indicaciones del Gobierno.","options":["Verdadero.","Falso."],"answer_index":1,"explanation":"Es falso por «según las indicaciones del Gobierno»: el artículo 117 de la Constitución dispone que la justicia surge del pueblo y la administran jueces y magistrados de forma independiente y responsable.","why_wrong":{"Verdadero.":"Si el Gobierno pudiera darles instrucciones, desaparecería esa independencia judicial."},"source_page":32},{"id":"8e67b63bb0","num":2035,"tarea":2,"type":"tf","question":"Los españoles deben ayudar en los casos de catástrofe o calamidad pública.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"Es el artículo 30.4 de la Constitución, que obliga a los ciudadanos a ayudar en los casos de grave riesgo, catástrofe o calamidad pública; el mismo artículo recoge el derecho y el deber de defender a España.","why_wrong":{"Falso.":"No es un gesto voluntario: la Constitución lo formula como deber ciudadano."},"source_page":30},{"id":"1e1fe64fcf","num":2036,"tarea":2,"type":"tf","question":"En España los ciudadanos pueden elegir en qué ciudad quieren vivir.","options":["Verdadero.","Falso."],"answer_index":0,"explanation":"El artículo 19 de la Constitución reconoce a los españoles el derecho a elegir libremente dónde quieren vivir y a desplazarse por todo el territorio español.","why_wrong":{"Falso.":"Ninguna autoridad asigna el lugar de residencia; según el artículo 19 de la Constitución la elección es libre."},"source_page":29},{"id":"b4c9f74670","num":3001,"tarea":3,"type":"mc","question":"¿Dónde están Cáceres y Badajoz?","options":["En el Principado de Asturias.","En Andalucía.","En Extremadura."],"answer_index":2,"explanation":"Extremadura solo tiene dos provincias, Badajoz y Cáceres, y su capital de comunidad autónoma no es ninguna de las dos, sino Mérida.","why_wrong":{"En el Principado de Asturias.":"Asturias es una comunidad de una sola provincia en el norte de España, con capital en Oviedo.","En Andalucía.":"Andalucía está en el sur de España y tiene ocho provincias (Almería, Cádiz, Córdoba, Granada, Huelva, Jaén, Málaga y Sevilla), con capital en Sevilla."},"source_page":42},{"id":"ba58b1ef89","num":3002,"tarea":3,"type":"mc","question":"¿Cuál es la capital la Comunidad Valenciana?","options":["Alicante.","Castellón.","Valencia."],"answer_index":2,"explanation":"La Comunidad Valenciana tiene tres provincias, Alicante, Castellón y Valencia, y la ciudad de Valencia es a la vez capital de su provincia y capital de la comunidad autónoma.","why_wrong":{"Alicante.":"Alicante es capital de la provincia de Alicante, pero no de la comunidad.","Castellón.":"La capital de la provincia de Castellón se llama oficialmente Castellón de la Plana y tampoco es sede autonómica."},"source_page":42},{"id":"c41ab5b205","num":3003,"tarea":3,"type":"mc","question":"¿Dónde están las islas Baleares?","options":["En el mar Cantábrico.","En el mar Mediterráneo.","En el océano Atlántico."],"answer_index":1,"explanation":"España está formada por la mayor parte de la península ibérica, las islas Baleares en el mar Mediterráneo, las islas Canarias en el océano Atlántico y las ciudades de Ceuta y Melilla, en el norte de África. La capital de Baleares es Palma de Mallorca y allí está el parque nacional del Archipiélago de Cabrera.","why_wrong":{"En el mar Cantábrico.":"El mar Cantábrico baña la costa norte de España, la de las comunidades de clima oceánico, donde no hay archipiélagos.","En el océano Atlántico.":"En el Atlántico están las islas Canarias, con las provincias de Las Palmas y Santa Cruz de Tenerife."},"source_page":37},{"id":"252396c104","num":3004,"tarea":3,"type":"mc","question":"¿Cómo se llama la extensa llanura situada en el centro de la península ibérica?","options":["Marisma.","Cordillera.","Meseta."],"answer_index":2,"explanation":"La meseta tiene una altura media de más de 600 metros sobre el nivel del mar y está dividida en dos por una cordillera que la atraviesa de lado a lado, el Sistema Central. Es la zona de clima continental, con inviernos fríos y veranos muy calurosos.","why_wrong":{"Marisma.":"Una marisma es una zona húmeda e inundable próxima a la costa, no una gran llanura elevada del interior.","Cordillera.":"Una cordillera es una alineación de montañas; la que corta la meseta en dos es precisamente el Sistema Central."},"source_page":37},{"id":"2d4c98a5c7","num":3005,"tarea":3,"type":"mc","question":"El parque nacional de Ordesa está en...","options":["Aragón.","Navarra.","Castilla-La Mancha."],"answer_index":0,"explanation":"Ordesa y Monte Perdido es el parque nacional de Aragón, comunidad de tres provincias (Huesca, Teruel y Zaragoza) con capital en Zaragoza. España cuenta con 16 parques nacionales y aprobó su primera Ley de Parques Nacionales en 1916.","why_wrong":{"Navarra.":"Navarra es la Comunidad Foral de una sola provincia, con capital en Pamplona, y no figura entre las comunidades con parque nacional.","Castilla-La Mancha.":"Los parques nacionales de Castilla-La Mancha son Cabañeros y Tablas de Daimiel."},"source_page":39,"source_quote":"Ordesa y Monte Perdido (Aragón), Aigüestortes y Estany de Sant Maurici (Cataluña), Monfragüe (Extremadura)"},{"id":"af0530aa8e","num":3006,"tarea":3,"type":"mc","question":"¿En qué comunidad autónoma están Guadalajara y Cuenca?","options":["En Castilla y León.","En Castilla-La Mancha.","En Cantabria."],"answer_index":1,"explanation":"Castilla-La Mancha está formada por cinco provincias: Albacete, Ciudad Real, Cuenca, Guadalajara y Toledo, y su capital de comunidad es Toledo.","why_wrong":{"En Castilla y León.":"Castilla y León tiene nueve provincias (Ávila, Burgos, León, Palencia, Salamanca, Segovia, Soria, Valladolid y Zamora) y no tiene capital oficial: la sede de las administraciones está en Valladolid.","En Cantabria.":"Cantabria es una comunidad del norte de España formada por una sola provincia, con capital en Santander."},"source_page":41},{"id":"3904ace937","num":3007,"tarea":3,"type":"mc","question":"¿Qué comunidad autónoma tiene como capital Santiago de Compostela?","options":["Galicia.","Asturias.","Cantabria."],"answer_index":0,"explanation":"Galicia está en el noroeste y tiene cuatro provincias: La Coruña, Lugo, Orense y Pontevedra. Es uno de los pocos casos en que la capital de la comunidad, Santiago de Compostela, no es capital de ninguna provincia.","why_wrong":{"Asturias.":"El Principado de Asturias es una comunidad de una sola provincia cuya capital es Oviedo.","Cantabria.":"Cantabria tiene su capital en Santander y comparte con Asturias y Castilla y León el parque nacional de Picos de Europa."},"source_page":42},{"id":"b6ca15ea29","num":3008,"tarea":3,"type":"mc","question":"¿Dónde está Almería?","options":["En Andalucía.","En Canarias.","En Aragón."],"answer_index":0,"explanation":"Almería es una de las ocho provincias andaluzas y su capital de provincia se llama también Almería; la capital de la comunidad autónoma, en cambio, es Sevilla.","why_wrong":{"En Canarias.":"Canarias es un archipiélago del océano Atlántico con dos provincias, Las Palmas y Santa Cruz de Tenerife, y capitalidad compartida entre sus dos capitales.","En Aragón.":"Aragón está en el noreste de la Península y sus provincias son Huesca, Teruel y Zaragoza, con capital en Zaragoza."},"source_page":41},{"id":"f790e1f362","num":3009,"tarea":3,"type":"mc","question":"La capital de la comunidad autónoma de Galicia es...","options":["A Coruña.","Vigo.","Santiago de Compostela."],"answer_index":2,"explanation":"Santiago de Compostela es capital de comunidad autónoma sin ser capital de provincia. Las cuatro capitales provinciales gallegas son La Coruña, Lugo, Orense y Pontevedra.","why_wrong":{"A Coruña.":"La Coruña es capital de la provincia de La Coruña, una de las cuatro gallegas, pero no sede de la comunidad.","Vigo.":"Vigo es una ciudad gallega con uno de los puertos más importantes de España, pero la capital de su provincia es Pontevedra."},"source_page":42},{"id":"ccbcddef68","num":3010,"tarea":3,"type":"mc","question":"¿Cuál de estos ríos desemboca en el mar Mediterráneo?","options":["El Tajo.","El Júcar.","El Duero."],"answer_index":1,"explanation":"Los ríos españoles se agrupan en dos vertientes: el Júcar es uno de los que desembocan en el Mediterráneo, junto con el Ebro, el Segura y el Turia.","why_wrong":{"El Tajo.":"el Tajo es uno de los cinco ríos principales de la vertiente atlántica, junto al Miño, el Duero, el Guadiana y el Guadalquivir.","El Duero.":"el Duero también desemboca en el Atlántico y da nombre a la denominación de origen de vinos Ribera del Duero."},"source_page":37,"source_quote":"En el mar Mediterráneo desembocan los ríos Ebro, Júcar, Segura y Turia."},{"id":"ebcf5b8276","num":3011,"tarea":3,"type":"mc","question":"¿Dónde está el monte Aneto?","options":["En los Pirineos.","En el Sistema Central.","En Sierra Nevada."],"answer_index":0,"explanation":"El Aneto es el tercer monte más alto de España, por detrás del Teide, en Tenerife, y del Mulhacén, en Sierra Nevada. Los Pirineos son la primera de las grandes cordilleras peninsulares si se recorren de norte a sur.","why_wrong":{"En el Sistema Central.":"El Sistema Central es la cordillera que atraviesa la meseta de lado a lado y la divide en dos.","En Sierra Nevada.":"Sierra Nevada está en los sistemas Bético y Penibético y en ella se levanta el Mulhacén, el segundo pico más alto de España; además es parque nacional de Andalucía."},"source_page":37,"source_quote":"las principales montañas de la península ibérica, de norte a sur, son los Pirineos, donde se sitúa el tercer monte más alto de España, el Aneto"},{"id":"265a40dafb","num":3012,"tarea":3,"type":"mc","question":"La ciudad de Vitoria es la sede administrativa de...","options":["Navarra.","País Vasco.","La Rioja."],"answer_index":1,"explanation":"El País Vasco no tiene capital declarada en su Estatuto: Vitoria es la capital de la provincia de Álava y sede de las administraciones vascas. Las otras dos provincias son Guipúzcoa, con capital en San Sebastián, y Vizcaya, con capital en Bilbao.","why_wrong":{"Navarra.":"La Comunidad Foral de Navarra tiene una sola provincia y su capital es Pamplona.","La Rioja.":"La Rioja es también una comunidad de una sola provincia y su capital es Logroño."},"source_page":42},{"id":"5fcaa01a34","num":3013,"tarea":3,"type":"mc","question":"España se divide en...","options":["departamentos y regiones.","comunidades y ciudades autónomas.","regiones autónomas y distritos."],"answer_index":1,"explanation":"España se organiza en 17 comunidades autónomas, divididas a su vez en provincias, más 2 ciudades autónomas, Ceuta y Melilla, situadas en la costa norte de África y sin provincia propia.","why_wrong":{"departamentos y regiones.":"España no se organiza en departamentos: la unidad administrativa en que se subdivide cada comunidad es la provincia.","regiones autónomas y distritos.":"La denominación oficial es comunidad autónoma, y las dos entidades restantes son ciudades autónomas, no distritos."},"source_page":40,"source_quote":"En el mapa político de España, se puede observar la división de España en comunidades autónomas, divididas en provincias, y ciudades autónomas."},{"id":"4e38a7ca8c","num":3014,"tarea":3,"type":"mc","question":"El parque nacional de Aigüestortes está en...","options":["Cataluña.","Aragón.","Castilla y León."],"answer_index":0,"explanation":"Su nombre completo es Aigüestortes y Estany de Sant Maurici y es el único parque nacional de Cataluña, comunidad de cuatro provincias (Barcelona, Gerona, Lérida y Tarragona) con capital en Barcelona.","why_wrong":{"Aragón.":"El parque nacional de Aragón es Ordesa y Monte Perdido.","Castilla y León.":"Castilla y León comparte con Asturias y Cantabria el parque nacional de Picos de Europa."},"source_page":39,"source_quote":"Ordesa y Monte Perdido (Aragón), Aigüestortes y Estany de Sant Maurici (Cataluña), Monfragüe (Extremadura)"},{"id":"d91351ef8b","num":3015,"tarea":3,"type":"mc","question":"En el norte de África están Ceuta y...","options":["Almería.","Melilla.","Cádiz."],"answer_index":1,"explanation":"España está formada por la mayor parte de la península ibérica, las Baleares, las Canarias y las ciudades de Ceuta y Melilla, situadas en la costa norte de África; ambas son ciudades autónomas y no pertenecen a ninguna comunidad autónoma.","why_wrong":{"Almería.":"Almería es una provincia peninsular de Andalucía, en el sureste, y su capital de provincia es Almería.","Cádiz.":"Cádiz es otra provincia andaluza, esta en el suroeste de la Península, con capital en la ciudad de Cádiz."},"source_page":37},{"id":"0533e7f53f","num":3016,"tarea":3,"type":"mc","question":"¿En qué lugar de España hay un clima que se caracteriza por inviernos fríos y veranos muy calurosos?","options":["Canarias.","Comunidad Valenciana.","Madrid."],"answer_index":2,"explanation":"Ese es el clima continental, propio de las comunidades del centro de la península ibérica como la Comunidad de Madrid: temperaturas extremas, lluvias moderadas y alguna nevada.","why_wrong":{"Canarias.":"Canarias tiene clima subtropical, con temperaturas suaves todo el año y una media de 22 ºC.","Comunidad Valenciana.":"La Comunidad Valenciana está junto al mar Mediterráneo y tiene clima mediterráneo: inviernos suaves y pocas lluvias."},"source_page":40},{"id":"d1da6dda97","num":3017,"tarea":3,"type":"mc","question":"¿Cuál de estos ríos desemboca en el océano Atlántico?","options":["El Guadalquivir.","El Manzanares.","El Júcar."],"answer_index":0,"explanation":"El Guadalquivir es uno de los cinco ríos importantes que desembocan en el océano Atlántico, junto con el Miño, el Duero, el Tajo y el Guadiana, y es el que pasa por Córdoba, en Andalucía.","why_wrong":{"El Manzanares.":"el Manzanares es un río corto que pasa por Madrid y desemboca en el Jarama, no en el mar.","El Júcar.":"El Júcar desemboca en el mar Mediterráneo, junto con el Ebro, el Segura y el Turia."},"source_page":37,"source_quote":"los ríos más importantes de España que desembocan en el océano Atlántico son: Miño, Duero, Tajo, Guadiana y Guadalquivir"},{"id":"eadf64c607","num":3018,"tarea":3,"type":"mc","question":"¿Cuál de estas provincias forma parte de la Comunidad de Castilla y León?","options":["Burgos.","Huesca.","Guadalajara."],"answer_index":0,"explanation":"Burgos es una de las nueve provincias de Castilla y León, la comunidad con mayor número de provincias. Esta comunidad no tiene una capital oficial en su Estatuto: la sede de las administraciones y de las Cortes está en Valladolid.","why_wrong":{"Huesca.":"Huesca es una de las tres provincias de Aragón, junto con Teruel y Zaragoza.","Guadalajara.":"Guadalajara es una provincia de Castilla-La Mancha, comunidad cuya capital es Toledo."},"source_page":41},{"id":"7a0c7d8c58","num":3019,"tarea":3,"type":"mc","question":"¿En qué comunidad autónoma está la ciudad de Huesca?","options":["Castilla-La Mancha.","Aragón.","Extremadura."],"answer_index":1,"explanation":"Huesca es capital de la provincia del mismo nombre, una de las tres de Aragón; la capital de la comunidad autónoma es Zaragoza. En el Pirineo aragonés está el parque nacional de Ordesa y Monte Perdido.","why_wrong":{"Castilla-La Mancha.":"Las provincias de Castilla-La Mancha son Albacete, Ciudad Real, Cuenca, Guadalajara y Toledo.","Extremadura.":"Extremadura solo tiene las provincias de Badajoz y Cáceres, y su capital de comunidad es Mérida."},"source_page":41},{"id":"2f4d1e1747","num":3020,"tarea":3,"type":"mc","question":"Canarias tiene un clima...","options":["mediterráneo.","oceánico.","subtropical."],"answer_index":2,"explanation":"El clima subtropical de Canarias da temperaturas suaves durante todo el año, con una media de 22 ºC, y pocas lluvias, aunque a veces caen de forma intensa.","why_wrong":{"mediterráneo.":"El clima mediterráneo es el de los territorios situados cerca del mar Mediterráneo, con inviernos suaves y veranos calurosos.","oceánico.":"El clima oceánico corresponde a las comunidades del norte junto al mar Cantábrico y al Atlántico, donde llueve mucho."},"source_page":40},{"id":"21c6060367","num":3021,"tarea":3,"type":"mc","question":"El principal río que desemboca en el mar Mediterráneo es el...","options":["Ebro.","Duero.","Tajo."],"answer_index":0,"explanation":"El Ebro es el principal de los cuatro ríos que desembocan en el mar Mediterráneo; los otros tres son el Júcar, el Segura y el Turia.","why_wrong":{"Duero.":"el Duero pertenece a la vertiente atlántica y da nombre a la denominación de origen de vinos Ribera del Duero.","Tajo.":"el Tajo también desemboca en el océano Atlántico, junto al Miño, el Duero, el Guadiana y el Guadalquivir."},"source_page":37,"source_quote":"En el mar Mediterráneo desembocan los ríos Ebro, Júcar, Segura y Turia."},{"id":"f37ff9e830","num":3022,"tarea":3,"type":"mc","question":"España está entre los países de Europa más...","options":["lluviosos.","montañosos.","fríos."],"answer_index":1,"explanation":"España tiene una altitud media de 650 metros sobre el nivel del mar, y es además el cuarto país más grande del continente, con una extensión de 505 944 km2.","why_wrong":{"lluviosos.":"Las lluvias abundantes se concentran en la franja norte de clima oceánico; en el resto del país llueve poco.","fríos.":"Al contrario: con más de 3000 horas de sol al año, España es uno de los países más cálidos de Europa."},"source_page":37},{"id":"d4206df866","num":3023,"tarea":3,"type":"mc","question":"¿En qué provincia está el parque nacional de Monfragüe?","options":["En Cáceres.","En Murcia.","En Ciudad Real."],"answer_index":0,"explanation":"Monfragüe es el parque nacional de Extremadura, comunidad formada únicamente por las provincias de Badajoz y Cáceres. Está en la provincia de Cáceres, cuya capital de provincia es la ciudad de Cáceres, mientras la capital de la comunidad es Mérida.","why_wrong":{"En Murcia.":"La Región de Murcia es una comunidad de una sola provincia, con capital en Murcia, y no figura entre las comunidades con parque nacional.","En Ciudad Real.":"Ciudad Real es una provincia de Castilla-La Mancha, comunidad cuyos parques nacionales son Cabañeros y Tablas de Daimiel."},"source_page":39,"source_quote":"Monfragüe (Extremadura)"},{"id":"281faa3e50","num":3024,"tarea":3,"type":"mc","question":"¿Cuál es la capital de la comunidad autónoma de Extremadura?","options":["Cáceres.","Badajoz.","Mérida."],"answer_index":2,"explanation":"Extremadura tiene dos provincias, Badajoz y Cáceres, y su capital de comunidad es distinta de ambas: Mérida, que no es capital de provincia.","why_wrong":{"Cáceres.":"Cáceres es la capital de la provincia de Cáceres, una de las dos extremeñas.","Badajoz.":"Badajoz es la capital de la provincia de Badajoz, pero no la sede de la comunidad autónoma."},"source_page":42,"source_quote":"Extremadura        Badajoz           Badajoz               Mérida"},{"id":"d8eec8dccf","num":4001,"tarea":4,"type":"mc","question":"Los personajes principales de la novela el Quijote son don Quijote y...","options":["Don Juan.","Sancho Panza.","Doña Inés."],"answer_index":1,"titles":["Quijote"],"explanation":"Miguel de Cervantes (1547-1616), nacido en Alcalá de Henares, escribió El ingenioso hidalgo don Quijote de la Mancha, considerada la primera novela moderna, cuyos personajes principales son don Quijote y su escudero Sancho Panza.","why_wrong":{"Don Juan.":"Es otro mito literario español, pero pertenece a la obra de Tirso de Molina El burlador de Sevilla y convidado de piedra, de 1630.","Doña Inés.":"doña Inés no es un personaje de la novela de Cervantes, en la que a don Quijote acompaña su escudero Sancho Panza."},"source_page":46},{"id":"80e922f768","num":4002,"tarea":4,"type":"mc","question":"¿Qué científica española es reconocida por sus investigaciones?","options":["Almudena Grandes.","Montserrat Caballé.","Margarita Salas."],"answer_index":2,"explanation":"Margarita Salas es la científica española de referencia en bioquímica y biología molecular; la investigación pública española se concentra en el Consejo Superior de Investigaciones Científicas (CSIC), la mayor institución pública dedicada a la investigación en España y la cuarta de Europa.","why_wrong":{"Almudena Grandes.":"Es escritora: autora de la serie Episodios de una guerra interminable, sobre la memoria histórica de la posguerra.","Montserrat Caballé.":"Es cantante lírica, una de las sopranos españolas de mayor fama internacional."}},{"id":"a6e40dc23c","num":4003,"tarea":4,"type":"mc","question":"¿Quién escribió La casa de Bernarda Alba?","options":["Federico García Lorca.","Miguel de Cervantes.","Antonio Machado."],"answer_index":0,"titles":["La casa de Bernarda Alba"],"explanation":"Federico García Lorca fue la figura central de la Generación del 27, que supuso un auge lírico y teatral, y escribió La casa de Bernarda Alba en 1936.","why_wrong":{"Miguel de Cervantes.":"Autor del Siglo de Oro (1547-1616), escribió El ingenioso hidalgo don Quijote de la Mancha.","Antonio Machado.":"Poeta de la Generación del 98, preocupada por la realidad de España y su futuro, no autor de teatro."},"source_page":47},{"id":"43f1c10ff4","num":4004,"tarea":4,"type":"mc","question":"¿Quién escribió Nada, una novela sobre la posguerra española?","options":["Carmen Laforet.","Ana María Matute.","María Dueñas."],"answer_index":0,"titles":["Nada"],"explanation":"Carmen Laforet es una de las novelistas que destacaron en la posguerra, tras la Guerra Civil, con Nada, al lado de Camilo José Cela con La colmena y Miguel Delibes con El camino.","why_wrong":{"Ana María Matute.":"También es novelista de la posguerra, pero su obra destacada es Los hijos muertos.","María Dueñas.":"Autora ya del cambio de siglo: triunfó con El tiempo entre costuras, novela histórica ambientada en la Guerra Civil y en Marruecos."},"source_page":47},{"id":"3bec5cc572","num":4005,"tarea":4,"type":"mc","question":"¿Qué músico compuso El amor brujo?","options":["Manuel de Falla.","Isaac Albéniz.","Joaquín Rodrigo."],"answer_index":0,"titles":["El amor brujo"],"explanation":"El amor brujo, de Manuel de Falla, es una de las obras centrales de la música clásica española, como el Concierto de Aranjuez de Joaquín Rodrigo.","why_wrong":{"Isaac Albéniz.":"Isaac Albéniz es el autor de la suite para piano Iberia.","Joaquín Rodrigo.":"Es el compositor del Concierto de Aranjuez, no de El amor brujo."},"source_page":49},{"id":"ac777d0a7e","num":4006,"tarea":4,"type":"mc","question":"¿Qué es típico en la Noche de San Juan?","options":["Comer uvas.","Encender hogueras.","Regalar libros."],"answer_index":1,"explanation":"La Noche de San Juan se celebra en toda España la noche del 23 al 24 de junio: se encienden hogueras con objetos antiguos (madera, papel) y se salta por encima para demostrar valor y habilidad y recibir lo nuevo que está por venir.","why_wrong":{"Comer uvas.":"Es tradición de Nochevieja: las 12 uvas se toman la noche del 31 de diciembre.","Regalar libros.":"Corresponde a Sant Jordi, el 23 de abril en Cataluña y Baleares, cuando se regalan una rosa y un libro."},"source_page":62},{"id":"d1bdbeb0ac","num":4007,"tarea":4,"type":"mc","question":"¿Cuál es el instrumento más característico de la música flamenca?","options":["La gaita.","La guitarra.","El piano."],"answer_index":1,"explanation":"La guitarra es uno de los instrumentos típicos del folclore español y en el flamenco es el instrumento por excelencia: Paco de Lucía fue uno de los guitarristas y compositores fundamentales de su historia.","why_wrong":{"La gaita.":"Es un instrumento del folclore español, pero acompaña otras tradiciones populares, no el flamenco.","El piano.":"No es uno de los instrumentos típicos del folclore español, que son la guitarra, las castañuelas, la gaita, la dulzaina, el acordeón, el txistu y el tamboril."},"source_page":61},{"id":"da873c06ad","num":4008,"tarea":4,"type":"mc","question":"Isabel Coixet es una...","options":["cantante pop.","bailarina clásica.","directora de cine."],"answer_index":2,"explanation":"Isabel Coixet es una de las directoras que han ganado peso en el cine español reciente y una de las voces más singulares del panorama europeo; suya es la película La Librería.","why_wrong":{"cantante pop.":"Cantantes españolas de música moderna son, por ejemplo, Rosalía o Luz Casal.","bailarina clásica.":"El baile lo representan bailaoras de flamenco como Carmen Amaya o Sara Baras, y el Ballet Nacional de España."},"source_page":50},{"id":"c45c9c716f","num":4009,"tarea":4,"type":"mc","question":"Una de las cantantes españolas más famosas actualmente es...","options":["Rosalía.","Marisol.","Lola Flores."],"answer_index":0,"explanation":"Rosalía es una de las cantantes españolas más famosas de la actualidad, dentro de la canción moderna y con gran proyección en Estados Unidos e Hispanoamérica.","why_wrong":{"Marisol.":"Marisol fue una cantante y actriz española popular en los años sesenta, no una figura del panorama musical actual.","Lola Flores.":"Fue cantaora de flamenco, apodada la faraona, figura histórica y no una artista de la actualidad."},"source_page":49},{"id":"40981c915d","num":4010,"tarea":4,"type":"mc","question":"¿En qué ciudad de España hay una mezquita que es Patrimonio de la Humanidad?","options":["Santiago de Compostela.","Madrid.","Córdoba."],"answer_index":2,"explanation":"La Mezquita de Córdoba (siglos VIII-XIII) fue uno de los cinco primeros bienes españoles inscritos en la lista de Patrimonio de la Humanidad, en 1984, junto con la Alhambra, la Catedral de Burgos, El Escorial y las obras de Gaudí en Barcelona.","why_wrong":{"Santiago de Compostela.":"Su bien reconocido por la Organización de las Naciones Unidas para la Educación, la Ciencia y la Cultura (UNESCO) es el Camino de Santiago, una de las rutas de peregrinación artístico-religiosas más importantes de Europa.","Madrid.":"El bien madrileño de aquella primera lista de 1984 es el Monasterio y Sitio de El Escorial, del siglo XVI."},"source_page":51},{"id":"99c516080a","num":4011,"tarea":4,"type":"mc","question":"¿En qué ciudad de España se encuentra La Alhambra, que es Patrimonio de la Humanidad?","options":["En Sevilla.","En Córdoba.","En Granada."],"answer_index":2,"explanation":"La Alhambra y el Generalife de Granada (siglos X-XIV) entraron en la lista de Patrimonio de la Humanidad en 1984; España es hoy el tercer país con más bienes reconocidos, 49, por detrás de Italia y China.","why_wrong":{"En Sevilla.":"Sevilla es la cuarta ciudad más poblada de España y sede de la Exposición Universal de 1992, pero la Alhambra y el Generalife están en Granada.","En Córdoba.":"Córdoba tiene su propio bien declarado en 1984, la Mezquita de los siglos VIII-XIII."},"source_page":51},{"id":"c40b466200","num":4012,"tarea":4,"type":"mc","question":"¿Cuál es el nombre de la directora española que ha destacado por su mirada crítica y por modernizar el cine nacional?","options":["Pilar Miró.","Sara Baras.","Penélope Cruz."],"answer_index":0,"explanation":"Pilar Miró fue una de las grandes cineastas españolas posteriores a Luis Buñuel, de la misma etapa que Carlos Saura, José Luis Garci o Luis García Berlanga, y destacó por su papel en la modernización del cine nacional.","why_wrong":{"Sara Baras.":"Es bailaora, figura fundamental de la historia del flamenco, no directora de cine.","Penélope Cruz.":"Es actriz de fama internacional y ganadora de un Óscar, no directora."},"source_page":49},{"id":"c85147b45a","num":4013,"tarea":4,"type":"mc","question":"¿Qué novela de éxito ha escrito Irene Vallejo?","options":["El infinito en un junco.","El tiempo entre costuras.","El camino."],"answer_index":0,"titles":["El infinito en un junco","El tiempo entre costuras","El camino"],"explanation":"El infinito en un junco es un ensayo narrativo que cuenta la historia del libro y de la lectura, y se convirtió en un fenómeno cultural.","why_wrong":{"El tiempo entre costuras.":"Es la novela histórica de éxito de María Dueñas, ambientada en la Guerra Civil y en Marruecos.","El camino.":"Es obra de Miguel Delibes, novelista destacado en la etapa de la posguerra."},"source_page":48},{"id":"73b65b2e44","num":4014,"tarea":4,"type":"mc","question":"¿Cómo se llama la mayor institución pública dedicada a la investigación en España?","options":["Real Academia Española (RAE).","Consejo Superior de investigaciones Científicas (CSIC).","La sociedad General de Autores (SGAE)."],"answer_index":1,"explanation":"El CSIC no solo es la mayor institución pública de investigación de España, sino también la cuarta de Europa, y su objetivo principal es promover investigaciones para el progreso científico y tecnológico.","why_wrong":{"Real Academia Española (RAE).":"Es la institución que se ocupa de la lengua española, no de la investigación científica.","La sociedad General de Autores (SGAE).":"Es una sociedad de autores, dedicada a los derechos de autor y no a la investigación científica."},"source_page":56},{"id":"4dd03d966f","num":4015,"tarea":4,"type":"mc","question":"Paco de Lucía fue un famoso....","options":["científico.","guitarrista.","pintor."],"answer_index":1,"explanation":"Paco de Lucía fue compositor y guitarrista, uno de los nombres fundamentales del flamenco.","why_wrong":{"científico.":"en la ciencia española destacan nombres como Santiago Ramón y Cajal o Severo Ochoa, premios Nobel de Medicina.","pintor.":"los grandes pintores españoles son Velázquez, Goya o Picasso; Paco de Lucía tocaba la guitarra flamenca."},"source_page":49},{"id":"80a50e3568","num":4016,"tarea":4,"type":"mc","question":"¿Qué celebramos el 24 de diciembre?","options":["Carnaval.","Nochebuena.","San Juan."],"answer_index":1,"explanation":"Las Navidades se celebran entre el 24 de diciembre y el 6 de enero, y la cena en familia de la noche del 24 se llama Nochebuena; sus símbolos son el belén o nacimiento y el árbol de Navidad.","why_wrong":{"Carnaval.":"Se celebra en febrero, con disfraces y máscaras; los más conocidos son los de Tenerife y Cádiz.","San Juan.":"Su noche es la del 23 al 24 de junio, con hogueras, no en diciembre."},"source_page":61},{"id":"7fe2875481","num":4017,"tarea":4,"type":"mc","question":"Juan Mari Arzak es un famoso....","options":["escritor.","músico.","cocinero."],"answer_index":2,"explanation":"Juan Mari Arzak es uno de los grandes cocineros vascos de España, dentro de una gastronomía muy rica y variada por su variedad cultural y climática.","why_wrong":{"escritor.":"los grandes nombres de la literatura española son novelistas como Camilo José Cela o Miguel Delibes.","músico.":"en la música española destacan figuras como Manuel de Falla o Paco de Lucía."},"source_page":74,"source_quote":"España cuenta con grandes cocineros, entre otros, los catalanes Ferran Adrià, Carme Ruscalleda y los hermanos Roca, los vascos Juan Mari Arzak, Pedro Subijana y Martin Berasategui."},{"id":"6a4907d023","num":4018,"tarea":4,"type":"mc","question":"¿Quién fue Clara Campoamor?","options":["Una defensora de los derechos de la mujer.","Una cantante lírica.","Una directora de cine."],"answer_index":0,"explanation":"Clara Campoamor fue defensora de los derechos de la mujer y una de las figuras de la Generación de 1914, que representó una forma más europea de entender la realidad española.","why_wrong":{"Una cantante lírica.":"las cantantes líricas españolas conocidas son sopranos como Montserrat Caballé o Ainhoa Arteta.","Una directora de cine.":"Tampoco dirigió cine; su campo fue el jurídico y político."},"source_page":47},{"id":"75a7781920","num":4019,"tarea":4,"type":"mc","question":"¿Qué canciones típicas se cantan en Navidad?","options":["Flamenco.","Villancicos.","Jotas."],"answer_index":1,"explanation":"Los villancicos son las canciones tradicionales que se cantan en España durante las Navidades, que van del 24 de diciembre al 6 de enero.","why_wrong":{"Flamenco.":"Es propio de Andalucía y fue declarado Patrimonio Cultural Inmaterial de la Humanidad en 2010; no es música navideña.","Jotas.":"La jota es cante y baile popular presente en casi toda España, y la jota navarra se asocia a los sanfermines."},"source_page":61},{"id":"4e8434ab24","num":4020,"tarea":4,"type":"mc","question":"La Liga y la Copa del Rey son competiciones de...","options":["natación.","atletismo.","fútbol."],"answer_index":2,"explanation":"En España tienen mucha importancia los campeonatos de Liga y de Copa del Rey, que se disputan en fútbol y en baloncesto.","why_wrong":{"natación.":"las nadadoras españolas más destacadas, como Mireia Belmonte o Gemma Mengual, compiten en campeonatos y Juegos Olímpicos.","atletismo.":"la Liga y la Copa del Rey se disputan solo en fútbol y en baloncesto."},"source_page":65},{"id":"3df3503c25","num":4021,"tarea":4,"type":"mc","question":"¿Quién ha recibido el premio Nobel de Literatura?","options":["María Zambrano.","Pablo Picasso.","Vicente Aleixandre."],"answer_index":2,"explanation":"Vicente Aleixandre, poeta de la Generación del 27, recibió el premio Nobel de Literatura en 1977.","why_wrong":{"María Zambrano.":"Fue pensadora vinculada a la Generación del 27, pero no recibió el premio Nobel.","Pablo Picasso.":"Fue pintor (1881-1973), autor del Guernica; el Nobel no premia la pintura."},"source_page":64,"source_quote":"1977 Vicente Aleixandre Literatura / 1989 Camilo José Cela Literatura / 2010 Mario Vargas Llosa Literatura"},{"id":"2de5474e0d","num":4022,"tarea":4,"type":"mc","question":"¿Qué fiesta se celebra en Pamplona el 7 de julio?","options":["Los sanfermines.","Las Fallas.","La Feria de Abril."],"answer_index":0,"explanation":"Los sanfermines se celebran en julio en Pamplona (Comunidad de Navarra) por las fiestas de San Fermín, con los encierros delante de los toros, el pañuelo y el fajín rojos sobre traje blanco y la jota navarra como música.","why_wrong":{"Las Fallas.":"Son de Valencia y se celebran en el mes de marzo, por la fiesta de San José el día 19, quemando las fallas.","La Feria de Abril.":"es la feria de Sevilla y se celebra en abril, no en julio en Pamplona."},"source_page":62},{"id":"7b5ef3d234","num":4023,"tarea":4,"type":"mc","question":"Teresa Perales y Daniel Molina son...","options":["campeones paraolímpicos.","músicos famosos.","artistas de cine."],"answer_index":0,"explanation":"Teresa Perales y Daniel Molina destacaron en los Juegos Paralímpicos de París 2024: Perales, leyenda de la natación, sumó allí otra medalla hasta acumular 28 en su carrera, y Molina fue campeón en triatlón.","why_wrong":{"músicos famosos.":"No son músicos: su ámbito es el deporte paralímpico.","artistas de cine.":"Tampoco son actores; ambos son deportistas paralímpicos."},"source_page":65},{"id":"be75714caf","num":4024,"tarea":4,"type":"mc","question":"¿Qué toman los españoles la noche del 31 de diciembre para celebrar el cambio de año?","options":["Lentejas.","Uvas.","Aceitunas."],"answer_index":1,"explanation":"Tomar las 12 uvas la noche del 31 de diciembre es la tradición propia de la Nochevieja, dentro de unas Navidades que van del 24 de diciembre al 6 de enero.","why_wrong":{"Lentejas.":"No son un alimento navideño: en Navidad se toman turrón, mazapán, polvorones y cava.","Aceitunas.":"Tampoco forman parte de esta tradición; lo que se toma en Nochevieja son las doce uvas."},"source_page":61},{"id":"eb4d938274","num":4025,"tarea":4,"type":"mc","question":"¿Qué mujer es autora del cuadro La verbena?","options":["Maruja Mallo.","Carmen Maura.","Clara Lago."],"answer_ind
